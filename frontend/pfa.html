<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PFA 2026</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1;--success:#10b981;--warn:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:system-ui;font-size:14px}
.app{display:flex;height:100vh}.sidebar{width:260px;background:var(--card);border-right:1px solid #334155;display:flex;flex-direction:column;flex-shrink:0}
.sidebar h2{padding:16px;font-size:16px;border-bottom:1px solid #334155}
.hall-list{flex:1;overflow-y:auto;padding:8px}.hall-item{padding:10px 12px;border-radius:6px;cursor:pointer;margin-bottom:4px;display:flex;justify-content:space-between;transition:background .15s}
.hall-item:hover{background:#ffffff10}.hall-item.active{background:var(--accent);cursor:default}
.hall-item .name{font-weight:600}.hall-item .count{font-size:12px;color:var(--muted)}.hall-item.active .count{color:#c7d2fe}
.map-area{flex:1;position:relative;overflow:hidden;background:#000;cursor:default}
.map-area img{width:100%;height:100%;object-fit:contain}
.marker{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid #fff;transform:translate(-50%,-50%);cursor:pointer;z-index:10;transition:transform .15s}
.marker:hover{transform:translate(-50%,-50%) scale(1.5);background:var(--success);z-index:20}
.marker.p{background:var(--warn)}.marker.v{background:var(--success)}
.tooltip{position:absolute;background:var(--card);border:1px solid #334155;border-radius:6px;padding:6px 10px;font-size:12px;z-index:30;pointer-events:none}
.tooltip .bn{color:var(--muted)}.tooltip .exh{font-weight:600}
.panel{position:absolute;right:0;top:0;bottom:0;width:300px;background:var(--card);border-left:1px solid #334155;padding:16px;overflow-y:auto;z-index:50}
.panel h3{margin-bottom:12px}.panel label{display:block;font-size:11px;color:var(--muted);margin:8px 0 4px}
.panel textarea{width:100%;height:60px;background:#ffffff0a;border:1px solid #334155;color:var(--text);padding:6px;border-radius:4px;resize:vertical}
.btn{padding:6px 14px;border-radius:4px;border:1px solid #334155;background:transparent;color:var(--text);cursor:pointer;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent)}.btn.sm{padding:3px 8px;font-size:12px}
.btn-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.stars{font-size:18px;cursor:pointer}
.stars span{color:#334155;cursor:pointer}.stars span.on{color:#f59e0b}.close-btn{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
.info-bar{padding:8px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid #334155;background:#000}
</style></head><body><div id="app"><div class="app">
<div class="sidebar"><h2>PFA 2026</h2><div class="hall-list">
<div v-for="h in halls" :key="h.code" class="hall-item" :class="{active:h.code===cur}" @click="pick(h.code)">
<span class="name">{{h.code}} {{h.name}}</span><span class="count">{{h.booth_count}}</span></div></div></div>
<div class="map-area" ref="ma" @mousemove="mm">
<div class="info-bar" v-if="cur">{{cur}} {{curName}} · {{bs.length}} 展位</div>
<img v-if="cur" :src="'/taf/api/pfa/halls/'+cur+'/image'" @load="loaded" ref="mi">
<template v-for="b in bs" :key="b.id">
<div class="marker" :class="{p:b.v?.p, v:b.v?.r}"
:style="{left:mx(b)+'%',top:my(b)+'%'}"
@click.stop="sel(b)" @mouseenter="hv(b,$event)" @mouseleave="tt.v=false"></div>
</template>
<div class="tooltip" v-if="tt.v" :style="{left:tt.x+'px',top:tt.y+'px'}">
<div class="bn">{{tt.bn}}</div><div class="exh">{{tt.exh}}</div></div>
<div class="panel" v-if="sb"><button class="close-btn" @click="sb=null">x</button>
<h3>{{sb.booth_number}}</h3><div style="font-weight:600;margin-bottom:12px">{{sb.exhibitor}}</div>
<div class="btn-row">
<button class="btn sm" :class="{primary:!ed.p&&!ed.r}" @click="ed.p=false;ed.r=null;sv()">未标记</button>
<button class="btn sm" :class="{primary:ed.p}" @click="ed.p=true;sv()" style="background:#f59e0b;border-color:#f59e0b">要看</button>
<button class="btn sm" @click="ed.s=!ed.s;sv()" :style="ed.s?'background:#10b981;border-color:#10b981':''">社媒</button></div>
<label>评分</label><div class="stars"><span v-for="s in 5" :key="s" :class="{on:s<=ed.r}" @click="ed.r=s;sv()">*</span></div>
<label>备注</label><textarea v-model="ed.n" @blur="sv()" placeholder="备注..."></textarea></div></div></div></div>
<script>
const{createApp,ref,reactive,onMounted}=Vue
createApp({setup(){
const halls=ref([]),cur=ref('E1'),bs=ref([]),sb=ref(null),curName=ref('')
const ed=reactive({p:false,r:null,n:'',s:false}),tt=reactive({v:false,x:0,y:0,bn:'',exh:''})
const load=async()=>{const r=await fetch('/taf/api/pfa/halls');halls.value=await r.json()}
const pick=async(c)=>{
    cur.value=c;sb.value=null;
    const h=halls.value.find(x=>x.code===c);curName.value=h?h.name:''
    try{const r=await fetch('/taf/api/pfa/halls/'+c+'/booths');bs.value=await r.json()}catch(e){bs.value=[]}
}
const loaded=()=>{}
const mx=(b)=>b.x?(b.x/3000*100).toFixed(1):50
const my=(b)=>b.y?(b.y/1300*100).toFixed(1):50
const sel=(b)=>{sb.value=b;ed.p=b.v?.p||false;ed.r=b.v?.r||null;ed.n=b.v?.n||'';ed.s=b.v?.s||false}
const hv=(b,e)=>{tt.v=true;tt.x=e.clientX-300;tt.y=e.clientY-80;tt.bn=b.booth_number;tt.exh=b.exhibitor}
const mm=(e)=>{if(tt.v){tt.x=e.clientX-300;tt.y=e.clientY-80}}
const sv=async()=>{if(!sb.value)return;await fetch('/taf/api/pfa/booths/'+sb.value.id+'/visit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_planned:ed.p,rating:ed.r,notes:ed.n,social_ready:ed.s,photos:[]})});pick(cur.value)}
onMounted(async()=>{await load();await pick('E1')})
return{halls,cur,bs,sb,ed,tt,curName,pick,loaded,mx,my,sel,hv,mm,sv}
}}).mount('#app')</script></body></html>

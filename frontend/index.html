        _rsTimer = setTimeout(() => {
          fabricCanvas.setWidth(wrap.clientWidth)
          fabricCanvas.setHeight(wrap.clientHeight)
          fabricCanvas.renderAll()
        }, 100)
      })
      ro.observe(wrap)
    }

    const triggerUpload = () => { fileInput.value?.click() }

    const onFileUpload = async (e) => {
      const file = e.target.files[0]
      if (!file) return
      // Upload to backend
      const formData = new FormData()
      formData.append('file', file)
      formData.append('name', file.name)
      try {
        const r = await fetch(API.base + '/projects/' + route.params.id + '/basemaps', {
          method: 'POST', body: formData
        })
        if (!r.ok) throw await r.json()
        toast.show('✅ DXF 上传成功，正在解析...')
        // Parse and render
        const text = await file.text()
        renderDXF(text)
      } catch(e) {
        console.error(e)
        toast.show('❌ 上传失败')
      }
    }

    // ── SVG path → fabric 对象 (Maki 符号) ──
    const makeSymbol = (pathStr, vb, x, y, size, color) => {
      // 解析 viewBox "0 0 15 15" → 按 size 缩放, 中心对齐到 (x,y)
      const parts = (vb || '0 0 15 15').split(' ').map(Number)
      const w = (parts[2] || 15), h = (parts[3] || 15)
      const scale = size / Math.max(w, h)
      const obj = new fabric.Path(pathStr, {
        left: x - w * scale / 2, top: y - h * scale / 2,
        scaleX: scale, scaleY: scale,
        fill: color, stroke: 'rgba(0,0,0,0.35)', strokeWidth: 0.4 / scale,
        selectable: false, evented: false,
      })
      return obj
    }

    // ── 清理 MTEXT 富文本格式代码 → 纯文字 ──
    const cleanMtext = (raw) => {
      if (!raw) return ''
      let t = String(raw)
      t = t.replace(/\{[^}]*\}/g, (m) => {           // {\fArial|b0|...;内容} → 内容
        const semi = m.indexOf(';')
        return semi >= 0 ? m.slice(semi + 1, -1) : ''
      })
      t = t.replace(/\\[a-zA-Z][^;]*;/g, '')          // \fSTXihei|...; \W0.9; 等前缀
      t = t.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '')
      return t.trim()
    }
    // ── 世界坐标 ↔ 屏幕坐标映射 (DXF Y 向上 → canvas Y 向下) ──
    // pos/geoAnchors 存世界坐标 (供 CAD 导出), 渲染/取点时经此映射
    let coordMap = { scale: 1, offX: 0, offY: 0, bbox: null }   // sx = wx*scale+offX, sy = -wy*scale+offY
    const worldToScreen = (wx, wy) => ({ x: wx * coordMap.scale + coordMap.offX, y: -wy * coordMap.scale + coordMap.offY })
    const screenToWorld = (sx, sy) => ({ x: (sx - coordMap.offX) / coordMap.scale, y: -(sy - coordMap.offY) / coordMap.scale })

    // 进度条状态
    const loading = ref(false)
    const loadProgress = ref(0)
    const loadStage = ref('')

    // ── 离屏合成: 把 layers 数据画到离屏 canvas → dataURL (原生 2D, 一次性, 高性能) ──
    let offCanvas = null, offCtx = null
    let bgScaleMul = 1          // 背景合成超采样倍数 (1=4096px 级, 2/4=放大时重合成保清晰)
    let _recompTimer = null

    // 核心: 以 mul 倍分辨率重绘矢量合成 → 挂到 fabric 背景 (场景尺寸恒 = offCanvas 基础尺寸)
    function renderComposite(mul) {
      if (!offCanvas || !fabricCanvas) return
      const bw = offCanvas.width, bh = offCanvas.height   // 基础(场景)尺寸恒定
      const nw = Math.max(1, Math.round(bw * mul))
      const nh = Math.max(1, Math.round(bh * mul))
      const nCan = document.createElement('canvas')
      nCan.width = nw; nCan.height = nh
      const nCtx = nCan.getContext('2d')
      nCtx.fillStyle = '#111318'; nCtx.fillRect(0, 0, nw, nh)
      nCtx.scale(mul, mul)
      for (const l of layers.value) {
        if (!l.visible) continue
        nCtx.globalAlpha = (l.opacity || 100) / 100
        nCtx.strokeStyle = l.color; nCtx.fillStyle = l.color
        l.objects.forEach(e => strokeEntity(nCtx, e, l.color, 1))
      }
      nCtx.globalAlpha = 1
      const dataUrl = nCan.toDataURL('image/png')
      fabric.Image.fromURL(dataUrl, (img) => {
        img._isBg = true
        img.selectable = false; img.evented = false
        img.lockMovementX = true; img.lockMovementY = true
        img.scaleX = bw / nw   // 场景尺寸恒 = 基础尺寸
        img.scaleY = bh / nh
        const old = fabricCanvas.getObjects().find(o => o._isBg)
        if (old) fabricCanvas.remove(old)
        fabricCanvas.add(img)
        fabricCanvas.sendToBack(img)
        fabricCanvas.requestRenderAll()
      })
    }

    // 重绘合成图 (图层显隐/透明度变化时调用 — 始终按当前超采样倍数保持清晰)
    function redrawComposite() {
      if (!offCanvas || !fabricCanvas) return
      renderComposite(bgScaleMul)
    }

    // 🔴 自适应重合成 (消除放大锯齿): zoom 放大超过源像素 1:1 时提高超采样倍数
    function recomposeForZoom() {
      if (!fabricCanvas || !offCanvas || !layers.value.length) return
      const zoom = fabricCanvas.getZoom()
      const target = Math.min(4, Math.max(1, Math.ceil(zoom / 1.5)))   // 超采样 ≥1.5 源px/屏px
      if (target === bgScaleMul) return
      bgScaleMul = target
      if (_recompTimer) clearTimeout(_recompTimer)
      _recompTimer = setTimeout(() => { try { renderComposite(bgScaleMul) } catch(e) { console.error('recompose fail', e) } }, 150)
    }
    let dxfWorldBounds = null   // 世界坐标 bbox
    let drawingBorderBbox = null   // TAF-DRAWING_BORDER 图框边界 (适应窗口优先以它为界)

    // ═══ 多边形几何工具 (大环包小环 = 洞, 自动布点排除) ═══
    function ringBBox(ring) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity
      for (const p of ring) { if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x; if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y }
      return { minX, minY, maxX, maxY }
    }
    // 点在环内 (射线法, 世界坐标)
    function pointInRing(x, y, ring) {
      let inside = false
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i].x, yi = ring[i].y, xj = ring[j].x, yj = ring[j].y
        if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-12) + xi)) inside = !inside
      }
      return inside
    }
    // 环 A 是否包含环 B (bbox 预筛 + B 任一顶点在 A 内)
    function ringContains(A, B) {
      const ba = ringBBox(A), bb = ringBBox(B)
      if (bb.minX <= ba.minX || bb.minY <= ba.minY || bb.maxX >= ba.maxX || bb.maxY >= ba.maxY) return false
      return B.some(p => pointInRing(p.x, p.y, A))
    }
    // 环组 → [{ring: 外环, holes: [内环...]}] (大包小 = 洞)
    function buildPolysWithHoles(rings) {
      const polys = []
      const used = new Set()
      // 1) 找外环: 不被任何其他环包含的环 (按面积降序保证大环先判)
      const areas = rings.map(r => { const b = ringBBox(r); return (b.maxX - b.minX) * (b.maxY - b.minY) })
      const idxs = rings.map((_, i) => i).sort((a, b) => areas[b] - areas[a])
      for (const i of idxs) {
        if (used.has(i)) continue
        // 判定是否被任一更大/未用环包含
        let parent = -1
        for (const j of idxs) {
          if (i === j || used.has(j)) continue
          if (areas[j] > areas[i] && ringContains(rings[j], rings[i])) { parent = j; break }
        }
        if (parent === -1) {
          // 独立外环: 它包含的未用小环都是洞
          const poly = { ring: rings[i], holes: [] }
          used.add(i)
          for (const k of idxs) {
            if (k === i || used.has(k)) continue
            if (areas[i] > areas[k] && ringContains(rings[i], rings[k])) { poly.holes.push(rings[k]); used.add(k) }
          }
          polys.push(poly)
        } else {
          used.add(i)   // 被包含环已被父外环收为洞
        }
      }
      return polys
    }
    // 点到环边界的最近距离 (世界坐标, 线段垂距+端点)
    function pointDistToRing(x, y, ring) {
      let dMin = Infinity
      const n = ring.length
      for (let i = 0; i < n; i++) {
        const a = ring[i], b = ring[(i + 1) % n]
        const dx = b.x - a.x, dy = b.y - a.y
        const L2 = dx * dx + dy * dy
        let t = 0
        if (L2 > 1e-12) t = Math.max(0, Math.min(1, ((x - a.x) * dx + (y - a.y) * dy) / L2))
        const px = a.x + t * dx, py = a.y + t * dy
        const d = Math.hypot(x - px, y - py)
        if (d < dMin) dMin = d
      }
      return dMin
    }
    // 点是否落在某环的"周边带"内 (近边界 ≤ band, 用于建筑周边规则)
    function pointInRingBand(x, y, ring, band) {
      return pointDistToRing(x, y, ring) <= band
    }
    // 点是否在任一 poly 内且不在其洞内 (世界坐标; 无 polys 时视为全域可用)
    function pointInPlaceableArea(x, y, polys) {
      if (!polys || !polys.length) return true
      for (const poly of polys) {
        if (!pointInRing(x, y, poly.ring)) continue
        if (poly.holes.some(h => pointInRing(x, y, h))) return false   // 在洞内 → 排除
        return true
      }
      return false
    }

    function computeWorldBounds(layerMap) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity
      for (const ents of Object.values(layerMap)) {
        for (const e of ents) {
          if (e.type === 'LINE' && e.vertices?.length >= 2) {
            for (const v of [e.vertices[0], e.vertices[1]]) { minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x); minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y) }
          } else if ((e.type === 'LWPOLYLINE' || e.type === 'POLYLINE') && e.vertices?.length) {
            for (const v of e.vertices) { minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x); minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y) }
          } else if (e.type === 'CIRCLE' && e.center) {
            minX = Math.min(minX, e.center.x - e.radius); maxX = Math.max(maxX, e.center.x + e.radius)
            minY = Math.min(minY, e.center.y - e.radius); maxY = Math.max(maxY, e.center.y + e.radius)
          } else if (e.type === 'ARC' && e.center) {
            minX = Math.min(minX, e.center.x - e.radius); maxX = Math.max(maxX, e.center.x + e.radius)
            minY = Math.min(minY, e.center.y - e.radius); maxY = Math.max(maxY, e.center.y + e.radius)
          } else if ((e.type === 'TEXT' || e.type === 'MTEXT') && e.position) {
            minX = Math.min(minX, e.position.x); maxX = Math.max(maxX, e.position.x)
            minY = Math.min(minY, e.position.y); maxY = Math.max(maxY, e.position.y)
          }
        }
      }
      if (minX === Infinity) return null
      const pad = Math.max((maxX - minX), (maxY - minY), 1) * 0.02
      return { minX: minX - pad, minY: minY - pad, maxX: maxX + pad, maxY: maxY + pad }
    }

    // 画单个实体到屏幕 ctx (坐标已映射到屏幕系)
    function strokeEntity(ctx, e, color, lwScale) {
      ctx.strokeStyle = color
      ctx.fillStyle = color
      if (e.type === 'LINE' && e.vertices?.length >= 2) {
        const a = worldToScreen(e.vertices[0].x, e.vertices[0].y)
        const b = worldToScreen(e.vertices[1].x, e.vertices[1].y)
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke()
      } else if ((e.type === 'LWPOLYLINE' || e.type === 'POLYLINE') && e.vertices?.length >= 2) {
        ctx.beginPath()
        e.vertices.forEach((v, i) => {
          const p = worldToScreen(v.x, v.y)
          i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)
        })
        if (e.shape || e.closed) ctx.closePath()   // 🔴 闭合多边形 → closePath
        ctx.stroke()
      } else if (e.type === 'CIRCLE' && e.center) {
        const c = worldToScreen(e.center.x, e.center.y)
        ctx.beginPath(); ctx.arc(c.x, c.y, e.radius * coordMap.scale, 0, Math.PI * 2); ctx.stroke()
      } else if (e.type === 'ARC' && e.center) {
        // ARC: dxf-parser 输出弧度 (Y-up 系)。屏幕系 Y 向下 → 角度取反
        const c = worldToScreen(e.center.x, e.center.y)
        const r = e.radius * coordMap.scale
        let sa = e.startAngle, ea = e.endAngle
        if (ea < sa) { const t = sa; sa = ea; ea = t }
        // Y 翻转: 屏幕角 = -世界角; arc 在 canvas 逆时针为负方向, 用 anticlockwise 处理
        ctx.beginPath()
        ctx.arc(c.x, c.y, r, -ea, -sa, false)   // 从 -ea 到 -sa (翻转后顺序)
        ctx.stroke()
      } else if ((e.type === 'TEXT' || e.type === 'MTEXT') && e.position) {
        const txt = cleanMtext(e.text || '')
        if (!txt) return
        const p = worldToScreen(e.position.x, e.position.y)
        ctx.font = `${Math.max(6, (e.height || 12) * coordMap.scale)}px sans-serif`
        ctx.textBaseline = 'middle'
        ctx.fillText(txt, p.x, p.y)
      }
    }

    const renderDXF = (dxfText) => {
      try {
        loading.value = true
        loadProgress.value = 5
        loadStage.value = '解析 DXF...'
        // 让进度条先渲染
        setTimeout(() => {
          try { doParseDXF(dxfText) } catch(e) { console.error(e); loading.value = false; toast.show('❌ DXF 解析失败: ' + e.message) }
        }, 30)
      } catch(e) {
        console.error(e)
        loading.value = false
        toast.show('❌ DXF 解析失败: ' + e.message)
      }
    }

    // 把 18 个设施标准项图层合并进图层数组 (未布点也列出; markers 由 renderFacilityMarkers 管理)
    const mergeFacilityLayersInto = (layerArr) => {
      const existing = new Set(layerArr.map(l => l.name))
      for (const [itemId, sym] of Object.entries(makiSymbols)) {
        if (existing.has(sym.layer)) continue
        const cat = itemId.split('-')[0]
        const placedN = facilities.value.filter(f => f.standard_item_id === itemId).reduce((s, f) => s + placCount(f), 0)
        layerArr.push({
          name: sym.layer,
          color: CAT_COLORS[cat] || '#4f8cff',
          count: placedN,
          visible: true, opacity: 100,
          objects: [],
          locked: false,
          isFacilityLayer: true,
          itemId,
          iconPath: sym.path, viewbox: sym.viewbox,
          nameZh: sym.name_zh,
        })
      }
    }

    const doParseDXF = (dxfText) => {
      const parser = new DxfParser()
      const dxf = parser.parseSync(dxfText)
      loadProgress.value = 25
      loadStage.value = `整理 ${dxf.entities.length} 实体...`

      // 按图层分组 (保留全部实体供合成绘制)
      const layerMap = {}
      for (const entity of dxf.entities) {
        const name = entity.layer || '0'
        if (!layerMap[name]) layerMap[name] = []
        layerMap[name].push(entity)
      }
      loadProgress.value = 40
      loadStage.value = '计算图纸范围...'

      // 世界坐标 bbox (Y-up, 原始)
      const wb = computeWorldBounds(layerMap)
      if (!wb) { loading.value = false; toast.show('⚠️ DXF 无有效几何实体'); return }
      dxfWorldBounds = wb
      // 建立坐标映射: 世界 bbox → 离屏 canvas (最长边 ~4096px 保持精度)
      const MAX_DIM = 4096
      const ww = wb.maxX - wb.minX, wh = wb.maxY - wb.minY
      const scale = Math.min(MAX_DIM / Math.max(ww, wh), 8)   // 上限 8 (防止小图过度放大)
      const cw = Math.ceil(ww * scale), ch = Math.ceil(wh * scale)
      coordMap = {
        scale,
        offX: -wb.minX * scale,
        offY: wb.maxY * scale,   // 使 wy=maxY → sy=0 (顶); wy=minY → sy=ch (底)
        bbox: wb,
      }
      loadProgress.value = 50
      loadStage.value = '创建合成画布...'
      // 画布状态栏: 世界尺寸 (米/单位)
      canvasSize.value = `${Math.round(ww)} × ${Math.round(wh)} (世界单位)`

      offCanvas = document.createElement('canvas')
      offCanvas.width = Math.max(1, cw)
      offCanvas.height = Math.max(1, ch)
      offCtx = offCanvas.getContext('2d')

      // 图层列表 (含颜色/实体引用; objects 存实体数组供合成)
      const newLayers = []
      const LAYER_TO_SPACE = {
        'TAF-BUILDING': 'building', 'BUILDING': 'building',
        'TAF-CHANNEL': 'channel', 'CHANNEL': 'channel',
        'TAF-NODE': 'node', 'NODE': 'node',
        'TAF-ROAD': 'road', 'ROAD': 'road',
        'TAF-GREEN': 'green', 'GREEN': 'green',
        'TAF-FACADE': 'facade', 'FACADE': 'facade',
        'TAF-BOUNDARY': 'boundary', 'BOUNDARY': 'boundary',
      }
      const layerColorOf = (nm) => LAYER_COLORS[nm] || LAYER_COLORS[nm.toUpperCase()] || '#5c6370'
      geoAnchors = { building: [], channel: [], node: [], green: [], facade: [], road: [], boundary: [] }

      for (const [name, ents] of Object.entries(layerMap)) {
        const color = layerColorOf(name)
        const locked = LOCKED_LAYERS.has(name) || LOCKED_LAYERS.has(name.toUpperCase())
        // 收集锚点 (世界坐标)
        const pts = []
        for (const e of ents) {
          if (e.type === 'LINE' && e.vertices?.length >= 2) pts.push(e.vertices[0], e.vertices[1])
          else if ((e.type === 'LWPOLYLINE' || e.type === 'POLYLINE') && e.vertices?.length) pts.push(...e.vertices)
          else if (e.type === 'CIRCLE' && e.center) pts.push({ x: e.center.x - e.radius, y: e.center.y - e.radius }, { x: e.center.x + e.radius, y: e.center.y + e.radius })
        }
        // 🔴 TAF-DRAWING_BORDER 图框边界: 记录其 bbox, 适应窗口以它为界
        if (/^TAF[-_]?DRAWING[-_]?BORDER$/i.test(name) && pts.length >= 2) {
          const xs = pts.map(p => p.x), ys = pts.map(p => p.y)
          drawingBorderBbox = {
            minX: Math.min(...xs), minY: Math.min(...ys),
            maxX: Math.max(...xs), maxY: Math.max(...ys),
          }
        }
        const spaceType = LAYER_TO_SPACE[name] || LAYER_TO_SPACE[name.toUpperCase()]
        if (spaceType && pts.length >= 2) {
          const xs = pts.map(p => p.x), ys = pts.map(p => p.y)
          // 🔴 多边形收集: 闭合 LWPOLYLINE/POLYLINE → 环; 环间包含关系 = 洞 (大包小=排除)
          const rings = []
          for (const e of ents) {
            if ((e.type === 'LWPOLYLINE' || e.type === 'POLYLINE') && (e.shape || e.closed) && e.vertices?.length >= 3) {
              rings.push(e.vertices.map(v => ({ x: v.x, y: v.y })))
            }
          }
          const anchor = {
            minX: Math.min(...xs), minY: Math.min(...ys),
            maxX: Math.max(...xs), maxY: Math.max(...ys),
            cx: (Math.min(...xs) + Math.max(...xs)) / 2,
            cy: (Math.min(...ys) + Math.max(...ys)) / 2,
            polys: rings.length ? buildPolysWithHoles(rings) : null,
          }
          // 仅当有有效外环才收 (防只有洞环/退化环)
          if (anchor.polys && !anchor.polys.some(p => p.ring.length >= 3)) anchor.polys = null
          if (!anchor.polys) delete anchor.polys
          geoAnchors[spaceType].push(anchor)
        }
        newLayers.push({
          name, color, count: ents.length, visible: true, opacity: 100,
          objects: ents,   // 实体引用 (合成用), 非 fabric 对象
          locked,
        })
      }
      // 融合 19 个设施标准项图层 (即使未布点也列出, 供显隐/锁定管理)
      mergeFacilityLayersInto(newLayers)
      layers.value = newLayers
      loadProgress.value = 70
      loadStage.value = '绘制合成图...'

      // 初次合成
      offCtx.fillStyle = '#111318'
      offCtx.fillRect(0, 0, offCanvas.width, offCanvas.height)
      for (const l of newLayers) {
        offCtx.strokeStyle = l.color
        for (const e of l.objects) strokeEntity(offCtx, e, l.color, 1)
      }
      loadProgress.value = 90
      loadStage.value = '渲染到画布...'

      // 清掉旧 fabric 对象 (保留 markers 之外全部)
      const old = fabricCanvas.getObjects().filter(o => !o._isFacility && !o._isFacilityLabel)
      old.forEach(o => fabricCanvas.remove(o))

      const dataUrl = offCanvas.toDataURL('image/png')
      fabric.Image.fromURL(dataUrl, (img) => {
        img._isBg = true
        img.selectable = false
        img.evented = false
        img.lockMovementX = true
        img.lockMovementY = true
        fabricCanvas.add(img)
        fabricCanvas.sendToBack(img)
        fabricCanvas.requestRenderAll()
        // 适配视图 (若无历史视图状态则全图适配)
        fitScreen()
        buildLegend()
        restoreViewState()   // 恢复上次图层显隐/透明度/视图
        // 🔴 竞态修复: refreshFacilities 若先于 DXF 解析完成执行(layers 尚空)会跳过 marker 渲染,
        //   此处兜底补渲染 (facilities 已加载时); 未加载则 refreshFacilities 稍后自行渲染
        if (facilities.value.length) {
          mergeFacilityLayersInto(layers.value)
          updateFacilityLayerCounts()
          renderFacilityMarkers()
        }
        loading.value = false
        loadProgress.value = 100
        loadStage.value = '完成'
        toast.show(`✅ 解析完成: ${dxf.entities.length} 实体, ${newLayers.length} 图层`)
      })
    }

    const fitScreen = () => {
      if (!fabricCanvas) return
      const wrap = canvasWrap.value
      const w = wrap.clientWidth, h = wrap.clientHeight
      if (w <= 0 || h <= 0) return
      // 🔴 优先以 TAF-DRAWING_BORDER 图框边界为适应基准 (用户新增图层语义)
      if (drawingBorderBbox && offCanvas) {
        const b = drawingBorderBbox
        const a = worldToScreen(b.minX, b.maxY)   // 左上
        const c = worldToScreen(b.maxX, b.minY)   // 右下
        const bw = Math.abs(c.x - a.x), bh = Math.abs(c.y - a.y)
        if (bw > 0 && bh > 0) {
          const zoom = Math.min(w / bw, h / bh) * 0.95
          const cx = (a.x + c.x) / 2, cy = (a.y + c.y) / 2
          fabricCanvas.setViewportTransform([zoom, 0, 0, zoom, w / 2 - cx * zoom, h / 2 - cy * zoom])
          zoomPct.value = Math.round(zoom * 100)
          fabricCanvas.requestRenderAll()
          recomposeForZoom()
          return
        }
      }
      // 基于离屏合成图尺寸精确适配 (避免遍历对象时 marker/文本干扰导致跑偏)
      if (offCanvas && offCanvas.width > 0 && offCanvas.height > 0) {
        const cw = offCanvas.width, ch = offCanvas.height
        const zoom = Math.min(w / cw, h / ch) * 0.92
        const cx = cw / 2, cy = ch / 2
        fabricCanvas.setViewportTransform([zoom, 0, 0, zoom, w / 2 - cx * zoom, h / 2 - cy * zoom])
        zoomPct.value = Math.round(zoom * 100)
        fabricCanvas.requestRenderAll()
        recomposeForZoom()
        return
      }
      // fallback: 无离屏图时按对象 bounds
      const objs = fabricCanvas.getObjects()
      if (!objs.length) return
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity
      objs.forEach(o => {
        const b = o.getBoundingRect()
        minX = Math.min(minX, b.left)
        minY = Math.min(minY, b.top)
        maxX = Math.max(maxX, b.left + b.width)
        maxY = Math.max(maxY, b.top + b.height)
      })
      const cw2 = maxX - minX, ch2 = maxY - minY
      if (cw2 <= 0 || ch2 <= 0) return
      const zoom2 = Math.min(w / cw2, h / ch2) * 0.92
      const cx2 = minX + cw2 / 2, cy2 = minY + ch2 / 2
      fabricCanvas.setViewportTransform([zoom2, 0, 0, zoom2, w / 2 - cx2 * zoom2, h / 2 - cy2 * zoom2])
      zoomPct.value = Math.round(zoom2 * 100)
      fabricCanvas.renderAll()
    }

    // 可见性切换 (眼睛图标, 替代 checkbox)
    const toggleLayerVisible = (layer) => {
      layer.visible = !layer.visible
      updateLayerVisibility(layer)
    }

    const updateLayerVisibility = (layer) => {
      layer.visible = layer.visible !== false
      if (layer.isFacilityLayer) {
        // 设施层: markers 可见性
        facilityMarkers.forEach(m => {
          if (m._facLayer === layer.name) m.visible = layer.visible
        })
        fabricCanvas.requestRenderAll()
      } else {
        redrawComposite()   // 底图层: 重绘合成图
      }
      if (typeof saveViewState === 'function') saveViewState()
    }

    const updateLayerOpacity = (layer) => {
      if (layer.opacity == null) layer.opacity = 100
      if (layer.isFacilityLayer) {
        facilityMarkers.forEach(m => {
          if (m._facLayer === layer.name) m.opacity = layer.opacity / 100
        })
        fabricCanvas.requestRenderAll()
      } else {
        redrawComposite()
      }
      if (typeof saveViewState === 'function') saveViewState()
    }

    // ── 自动保存视图状态 (图层显隐/透明度/缩放平移; position 已实时入库) ──
    const viewKey = () => 'taf_view_' + (route.params.id || '')
    const saveViewState = () => {
      try {
        const state = {
          layers: layers.value.map(l => ({ name: l.name, visible: l.visible, opacity: l.opacity || 100 })),
          viewport: fabricCanvas ? fabricCanvas.viewportTransform : null,
          t: Date.now(),
        }
        localStorage.setItem(viewKey(), JSON.stringify(state))
      } catch(e) { /* localStorage 不可用时静默 */ }
    }
    const restoreViewState = () => {
      try {
        const raw = localStorage.getItem(viewKey())
        if (!raw) return
        const st = JSON.parse(raw)
        // 恢复图层显隐/透明度 (统一设置后单次重绘)
        let changed = false
        st.layers?.forEach(s => {
          const l = layers.value.find(x => x.name === s.name)
          if (l) {
            l.visible = s.visible !== false
            l.opacity = s.opacity || 100
            changed = true
          }
        })
        if (changed) {
          redrawComposite()
          renderFacilityMarkers()
        }
        // 恢复视图变换
        if (st.viewport && fabricCanvas) {
          fabricCanvas.setViewportTransform(st.viewport)
          zoomPct.value = Math.round(fabricCanvas.getZoom() * 100)
          fabricCanvas.requestRenderAll()
          recomposeForZoom()
        }
      } catch(e) { console.warn('restore view state failed', e) }
    }
    // 定时自动保存 (每 30s) + 视图变更时立即保存
    if (typeof window !== 'undefined') {
      setInterval(() => { saveViewState() }, 30000)
    }

    // 图层显隐/透明度切换后保存
    const saveAfterLayerChange = (fn) => {
      return (layer) => { fn(layer); saveViewState() }
    }

    const toggleLayerLock = (layer) => {
      layer.locked = !layer.locked
      if (layer.isFacilityLayer) {
        renderFacilityMarkers()   // 重建 markers 应用锁定
        toast.show(layer.locked ? `🔒 ${layer.name} 已锁定 (不可拖动)` : `🔓 ${layer.name} 已解锁 (可拖动微调)`)
      } else {
        toast.show(layer.locked ? `🔒 ${layer.name} 锁定` : `🔓 ${layer.name} 解锁 (底图为合成图层, 几何不可单独编辑)`)
      }
    }

    // 透明度浮动面板开关 (再点关闭)
    const toggleOpacityPopup = (layer) => {
      opacityLayer.value = (opacityLayer.value === layer.name) ? null : layer.name
    }

    const confirmText = () => {
      if (!textValue.value.trim()) { textInput.value = false; return }
      const text = new fabric.Text(textValue.value, {
        left: textTargetX, top: textTargetY,
        fontSize: 16, fill: '#ff6b6b', fontFamily: 'sans-serif',
        backgroundColor: 'rgba(0,0,0,0.6)', padding: 4
      })
      fabricCanvas.add(text)
      fabricCanvas.renderAll()
      textInput.value = false
    }
    const cancelText = () => { textInput.value = false }

    const exportView = () => {
      if (!fabricCanvas) return
      const dataUrl = fabricCanvas.toDataURL({ format: 'png', multiplier: 2 })
      const link = document.createElement('a')
      link.download = 'taf-basemap-' + Date.now() + '.png'
      link.href = dataUrl
      link.click()
      toast.show('📸 截图已导出')
    }

    // ── 设施符号/颜色辅助 ──
    const facSymbol = (f) => {
      const id = f?.standard_item_id
      return (id && makiSymbols[id]) ? makiSymbols[id] : null
    }
    // 某标准项的布点实例数 (P0: placements 优先, 旧 f.position 兼容)
    const placCount = (f) => {
      if (!f) return 0
      if (Array.isArray(f.placements)) return f.placements.filter(p => p?.position?.x != null).length
      return (f.position && f.position.x != null) ? 1 : 0
    }
    const facColor = (f) => {
      const cat = (f?.category || 'P1').toUpperCase()
      return CAT_COLORS[cat] || '#4f8cff'
    }
    const isPlacable = (f) => !NON_PLACABLE.has(f?.standard_item_id)
    const placableCount = computed(() => facilities.value.filter(isPlacable).length)
    const showAllFac = ref(false)   // 默认只显示可布点设施
    const filteredFacilities = computed(() => {
      let list = facilities.value
      if (!showAllFac.value) list = list.filter(isPlacable)
      if (facFilter.value !== 'ALL') list = list.filter(f => (f.category || '').toUpperCase() === facFilter.value)
      return list
    })

    // 更新设施层已布点计数 (P0: 每项实例总数, 非 0/1)
    const updateFacilityLayerCounts = () => {
      layers.value.forEach(l => {
        if (l.isFacilityLayer) {
          let n = 0
          facilities.value.forEach(f => { if (f.standard_item_id === l.itemId) n += placCount(f) })
          l.count = n
        }
      })
    }

    const refreshFacilities = async () => {
      try {
        const list = await API.get('/projects/' + route.params.id + '/facilities')
        facilities.value = Array.isArray(list) ? list : (list.items || [])
        // 归一化: placements 未定义时给空数组 (多实例语义统一)
        facilities.value.forEach(f => { if (!Array.isArray(f.placements)) f.placements = [] })
        if (layers.value.length) {
          mergeFacilityLayersInto(layers.value)
          updateFacilityLayerCounts()
        }
        renderFacilityMarkers()
        buildLegend()
      } catch(e) { console.error(e) }
    }

    // ── 画布设施 marker (每 placement 一 marker; P0 多实例; position=世界坐标) ──
    const renderFacilityMarkers = () => {
      if (!fabricCanvas) return
      facilityMarkers.forEach(m => { try { fabricCanvas.remove(m) } catch(e){} })
      facilityMarkers = []
      const size = symScale.value * 6   // 符号尺寸 (场景单位)

      facilities.value.forEach(f => {
        // 多实例: placements 数组; 空则回退旧 f.position (兼容)
        const pts = (f.placements && f.placements.length)
          ? f.placements.map(p => ({ x: p.position?.x, y: p.position?.y, plid: p.id, seq: p.seq }))
          : ((f.position?.x != null) ? [{ x: f.position.x, y: f.position.y, plid: null, seq: 1 }] : [])
        const color = facColor(f)
        const sym = facSymbol(f)
        const facLayer = sym?.layer || null

        pts.forEach(pt => {
          if (pt.x == null || pt.y == null) return
          const sp = worldToScreen(pt.x, pt.y)
          const x = sp.x, y = sp.y
          let marker
          if (isAreaItem(f)) {
            // 区域型 (P1-01 防滑等): 文字标注带框, 非图钉 — C 方案
            const label = areaLabelOf(f)
            const t = new fabric.Text(label, {
              left: x - 34, top: y - 8, fontSize: 12, fill: '#111318',
              backgroundColor: color, padding: 3, fontFamily: 'sans-serif',
              hasControls: false, lockRotation: true, lockScalingX: true, lockScalingY: true,
            })
            t._isAreaMark = true
            marker = t
          } else if (sym?.path) {
            marker = makeSymbol(sym.path, sym.viewbox, x, y, size, color)
          } else {
            marker = new fabric.Circle({
              left: x - 6, top: y - 6, radius: 6,
              fill: color + '44', stroke: color, strokeWidth: 2,
              hasControls: false, lockRotation: true,
            })
          }
          marker._isFacility = true
          marker._facilityId = f.id
          marker._facilityData = f
          marker._placementId = pt.plid      // null = 旧单点兼容
          marker._placementSeq = pt.seq
          marker._facLayer = facLayer
          // 🔴 可编辑性: 选中标准项时, 仅该项点位可交互 (其他项锁定不可选/拖/删)
          const isSel = !selectedFac.value || selectedFac.value.id === f.id
          marker.selectable = isSel
          marker.evented = isSel
          marker.lockRotation = true
          marker.lockScalingX = true
          marker.lockScalingY = true
          marker.hasControls = false

          // 编号标签 (带序号) — 区域型已是文字标注, 跳过旁路编号
          const base = (f.standard_item_id || '').replace('P', '').replace('-', '')
          let lbl = null
          if (!isAreaItem(f)) {
            lbl = new fabric.Text((pts.length > 1 ? base + '-' + (pt.seq || 1) : base) || '', {
              left: x + size / 2 + 1, top: y - size / 2 - 1,
              fontSize: Math.max(6, size * 0.45), fill: color, fontFamily: 'sans-serif',
              selectable: false, evented: false,
            })
            lbl._isFacilityLabel = true
            // 🔴 图标-编号联动: marker 记住自己的 label 与初始偏移, 拖动时实时跟随
            marker._lbl = lbl
            marker._lblOff = { x: lbl.left - marker.left, y: lbl.top - marker.top }
          }

          const lobj = layers.value.find(l => l.name === facLayer)
          if (lobj) {
            if (lobj.visible) { fabricCanvas.add(marker); if (lbl) fabricCanvas.add(lbl) }
            marker.visible = lobj.visible
            if (lbl) lbl.visible = lobj.visible
            if (lobj.locked) { marker.selectable = false; marker.evented = false }
          } else {
            fabricCanvas.add(marker)
            if (lbl) fabricCanvas.add(lbl)
          }
          facilityMarkers.push(marker); if (lbl) facilityMarkers.push(lbl)
        })
      })
      fabricCanvas.requestRenderAll()
    }

    // ── 手动布点: 选中设施后点击画布落点 ──
    const setTool = (t) => {
      // 再点同一工具 = 取消 (toggle)
      if (tool.value === t && (t === 'place' || t === 'text')) {
        tool.value = 'pan'
        selectedFac.value = null
        facPlaceHint.value = ''
        return
      }
      tool.value = t
      if (t === 'place') {
        // 手动布点模式: 展开点位库 (选设施需要), 收起自动工具面板避免混淆
        hideLib.value = false
        autoPanelActive.value = false
        hideTools.value = true
        facPlaceHint.value = selectedFac.value
          ? `点击画布为「${selectedFac.value.name}」(${selectedFac.value.standard_item_id}) 连续加点 · 再点「手动布点」或 Esc 取消`
          : '先在点位库点选要布点的标准项，再到画布点击加一个点（可连续加多个）'
      } else {
        facPlaceHint.value = ''
      }
    }
    // Esc 取消手动布点 / 收起自动布点面板
    const _keyHandler = (e) => {
      if (e.key === 'Escape' && (tool.value === 'place' || tool.value === 'text')) {
        tool.value = 'pan'
        selectedFac.value = null
        facPlaceHint.value = ''
        if (textInput.value) { textInput.value = false }
        fabricCanvas?.requestRenderAll()
      }
      if (e.key === 'Escape' && autoPanelActive.value) {
        autoPanelActive.value = false
        hideTools.value = true
      }
    }
    if (typeof document !== 'undefined') document.addEventListener('keydown', _keyHandler)
    // ── Undo/Redo: 基于全量 position 快照 (含 null 状态) ──
    // P0: 快照 = 每设施的 placements 实例坐标列表 [{id,x,y}...] (含旧 f.position 兼容)
    const snapPositions = () => {
      const m = {}
      facilities.value.forEach(f => {
        const arr = []
        if (Array.isArray(f.placements)) {
          f.placements.forEach(p => {
            if (p?.position?.x != null) arr.push({ id: p.id, x: p.position.x, y: p.position.y })
          })
        }
        if (!arr.length && f.position?.x != null) arr.push({ id: null, x: f.position.x, y: f.position.y })
        m[f.id] = arr
      })
      return m
    }
    const pushUndo = () => {
      undoStack.value.push(snapPositions())
      if (undoStack.value.length > 100) undoStack.value.shift()
      redoStack.value = []
    }
    // 用 batch replace 恢复整项实例 (最简: 有 snap 的 PUT batch, 空的 DELETE)
    const applyPositions = async (snap) => {
      for (const f of facilities.value) {
        const insts = snap[f.id] || []
        try {
          if (insts.length) {
            const resp = await API.put('/facilities/' + f.id + '/placements/batch', insts.map(i => ({
              position: { x: i.x, y: i.y, lng: null, lat: null }
            })))
            // 🔴 用后端真实 id (勿伪造 'undo-' 假 id → 之后拖动保存 404)
            f.placements = (Array.isArray(resp) ? resp : []).map((r, idx) => ({
              id: r.id, seq: r.seq != null ? r.seq : idx + 1, position: r.position
            }))
            f.position = null
          } else {
            await API.delete('/facilities/' + f.id + '/placements')
            f.placements = []
            f.position = null
          }
        } catch(e) { console.error('undo sync fail', f.id, e) }
      }
      updateFacilityLayerCounts()
      renderFacilityMarkers()
    }
    const undoPlacement = async () => {
      if (!undoStack.value.length) { toast.show('无可撤销操作'); return }
      const prev = undoStack.value.pop()
      redoStack.value.push(snapPositions())
      await applyPositions(prev)
      toast.show('↶ 已撤销上一步')
    }
    const redoPlacement = async () => {
      if (!redoStack.value.length) { toast.show('无可重做操作'); return }
      const next = redoStack.value.pop()
      undoStack.value.push(snapPositions())
      await applyPositions(next)
      toast.show('↷ 已重做')
    }
    // Ctrl+Z / Ctrl+Y 快捷键
    const _undoKey = (e) => {
      if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undoPlacement() }
      else if (e.ctrlKey && e.key.toLowerCase() === 'y') { e.preventDefault(); redoPlacement() }
    }
    if (typeof document !== 'undefined') document.addEventListener('keydown', _undoKey)

    // 清空某标准项全部布点 (点位库 🗑)
    const removePlacement = async (f) => {
      pushUndo()
      try {
        await API.delete('/facilities/' + f.id + '/placements')
        f.placements = []
        f.position = null
        renderFacilityMarkers()
        updateFacilityLayerCounts()
        toast.show('🗑 已清空布点: ' + f.name)
      } catch(e) { console.error(e); toast.show('❌ 清空布点失败') }
    }
    // 删除单个布点实例 (Delete 键)
    const removeOnePlacement = async (pl) => {
      pushUndo()
      try {
        const f = facilities.value.find(x => x.id === pl._facilityId)
        if (!f) return
        if (pl._placementId) {
          await API.delete('/placements/' + pl._placementId)
          if (f.placements) {
            f.placements = f.placements.filter(p => p.id !== pl._placementId)
            // 重排 seq 连续
            f.placements.forEach((p, i) => { p.seq = i + 1 })
          }
        } else {
          f.position = null   // 旧单点兼容
        }
        renderFacilityMarkers()
        updateFacilityLayerCounts()
        toast.show('🗑 已删除一个布点 (' + (f.name || '') + ')')
      } catch(e) { console.error(e); toast.show('❌ 删除布点失败') }
    }
    // Delete 键: 删除画布上选中的 marker 实例
    const _delKey = (e) => {
      const tgt = e.target
      const inInput = tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA' || tgt.isContentEditable)
      if ((e.key === 'Delete' || e.key === 'Backspace') && !textInput.value && !inInput) {
        const sel = fabricCanvas?.getActiveObject()
        if (sel && sel._isFacility) {
          e.preventDefault()
          removeOnePlacement(sel)
          fabricCanvas.discardActiveObject()
          fabricCanvas.requestRenderAll()
        }
      }
    }
    if (typeof document !== 'undefined') document.addEventListener('keydown', _delKey)

    const selectFacility = (f) => {
      // A: 已选中该项再点 → 取消选择 (解锁全部点位, 恢复自由微调)
      if (selectedFac.value?.id === f.id) {
        selectedFac.value = null
        setTool('pan')
        facPlaceHint.value = ''
        toast.show('已取消选择 — 全部点位可自由微调')
        return
      }
      selectedFac.value = f
      // 点选标准项后: 保留右侧两列可见 + 自动选第一可用策略 (供自动布点直接执行)
      hideLib.value = false
      hideTools.value = false
      autoPanelActive.value = true
      const opts = ITEM_STRATEGIES[f?.standard_item_id]
      if (opts && opts.length && !opts.includes(placeStrategy.value)) {
        placeStrategy.value = opts[0]   // 默认第一个策略
      }
      if (tool.value !== 'place') setTool('place')
      // setTool('place') 会收起工具面板 → 重新展开 (选择后需同时看策略)
      hideTools.value = false
      autoPanelActive.value = true
      focusFacility(f)
    }
    // 选中项变化 → 重渲染 markers (其他项点位立即锁定/解锁)
    watch(selectedFac, () => { renderFacilityMarkers() })
    const placeAtPointer = async (sx, sy) => {
      const f = selectedFac.value
      if (!f) { toast.show('⚠️ 先在点位库点选要布点的标准项'); return }
      pushUndo()
      const w = screenToWorld(sx, sy)   // 场景 → 世界坐标 (CAD 用)
      // 🔴 不取整: 保留浮点坐标, 手动落点自由 (无网格吸附; 取整会造成 1 单位=1cm 的吸附感)
      const x = w.x, y = w.y
      try {
        // P0: 手动布点 = 追加一个 placement 实例 (连续加点, 不跳转)
        const resp = await API.post('/facilities/' + f.id + '/placements', {
          position: { x, y, lng: null, lat: null }
        })
        if (!f.placements) f.placements = []
        f.placements.push({ id: resp.id, seq: resp.seq, position: { x, y } })
        renderFacilityMarkers()
        updateFacilityLayerCounts()
        toast.show(`✅ ${f.name} 已加点 ${resp.seq} (可继续点击添加, 共 ${f.placements.length} 点)`)
      } catch(e) { console.error(e); toast.show('❌ 布点保存失败') }
    }

    // ── 自动布点引擎 ──
    // 自动布点 = 右侧「布点工具」面板 toggle (与「手动布点」画布模式互不干扰, 可同时开)
    const autoPanelActive = ref(false)
    const openAutoPlace = () => {
      autoPanelActive.value = !autoPanelActive.value
      hideTools.value = !autoPanelActive.value    // 面板随 toggle 显示/隐藏
      if (autoPanelActive.value) {
        toast.show('⚙️ 布点工具已展开 — 配置后点「🚀 自动布点」执行')
      } else {
        toast.show('⚙️ 布点工具已收起')
      }
    }

    // 防抖: 拉杆拖动时延迟重算
    let _reautoTimer = null
    const scheduleReauto = () => {
      if (_reautoTimer) clearTimeout(_reautoTimer)
      _reautoTimer = setTimeout(() => {
        const f = selectedFac.value
        if (!f) { toast.show('💡 先在点位库选一项，再调参数重布'); return }
        const has = placCount(f)
        if (has > 0 && autoOverwrite.value) runAutoPlace()
        else if (has > 0) toast.show('💡 勾选「覆盖已有布点」后拉杆实时重算')
        else runAutoPlace()
      }, 600)
    }

    // ── 自动布点引擎 (P2: 按标准项生成 N 点, 锚点不足自动降级, 弹性不卡死) ──
    // 每标准项的锚点池与派生数量
    const autoGenPoints = (f) => {
      const strat = placeStrategy.value
      const spacing = placeSpacing.value, margin = placeMargin.value, rowCap = perRow.value
      const poolOf = (t) => geoAnchors[t] || []
      const allPool = ['building','channel','node','green','facade','road','boundary'].flatMap(t => poolOf(t))
      const region = poolOf('boundary')[0] || (allPool.length ? {
        minX: Math.min(...allPool.map(b=>b.minX)), minY: Math.min(...allPool.map(b=>b.minY)),
        maxX: Math.max(...allPool.map(b=>b.maxX)), maxY: Math.max(...allPool.map(b=>b.maxY)),
      } : null)
      if (!allPool.length && !region) return []
      // 🔴 红线外轮廓避让 (全局约束, 用户规则): 红线 = 场地边界; 线外不是马路就是红线外邻楼共墙,
      //   物理上不可能布点 → 所有规则候选点须落在红线多边形内, 且距红线环 ≥ 避让带(取 1×间距)
      const redlineRing = (poolOf('boundary')[0]?.polys?.[0]?.ring) || null
      const redlineClear = Math.max(spacing, 10)
      const offRedline = (x, y) => {
        if (!redlineRing) return false   // 图纸未画闭合红线 → 不启用该约束 (兼容旧图)
        const d = pointDistToRing(x, y, redlineRing)
        return d < redlineClear || !pointInRing(x, y, redlineRing)
      }
      // 锚点选择 (按规则)
      const pools = (STRATEGY_POOL[strat] || ['channel']).map(t => poolOf(t)).filter(p => p.length)
      const anchors = pools.length ? pools[0] : allPool
      // 🔴 语义区分 (用户修正): building/facade 多边形=建筑实体=室内禁区 →
      //   布点在多边形外部 (室外); channel/green/node/boundary 多边形=开放空间 → 布点在内部
      const exteriorType = (strat === 'building' || strat === 'facade')
      // 全部建筑禁区: 建筑实体=室内禁区, 一律排除 (exterior 规则锚点自身环含于其中;
      //   开放空间规则同样避楼; fallback 区域散布/无闭合环锚点(facade 开放线)也靠它防进楼)
      const buildingBlocks = poolOf('building').flatMap(b => b.polys || [])
      const pointBlocked = (x, y) => {
        for (const poly of buildingBlocks) {
          if (poly && pointInRing(x, y, poly.ring)) return true
        }
        return false
      }
      // 🔴 节点(广场)禁区 (用户修正 2026-09-02): 建筑周边/facade 周边点须避让节点/广场多边形,
      //   设施贴墙布置, 不站广场中央 (102-4 悬在 node#12 内即此因)
      const nodePolys = poolOf('node').flatMap(b => b.polys || [])
      const inAnyNode = (x, y) => nodePolys.some(p => p && pointInRing(x, y, p.ring))
      // 目标数量: 全程扫描收集全部有效点, 再按主轴均匀抽样 rowCap 个
      const out = []
      for (const bb of anchors) {
        const capW = Math.max(1, Math.floor((bb.maxX - bb.minX) / Math.max(spacing, 8)))
        const capH = Math.max(1, Math.floor((bb.maxY - bb.minY) / Math.max(spacing, 8)))
        const cands = []
        for (let row = 0; row < capH; row++) {
          for (let col = 0; col < capW; col++) {
            const x = Math.round(bb.minX + margin + col * spacing + (row % 2) * (spacing / 2))
            const y = Math.round(bb.minY + margin + row * spacing)
            if (exteriorType) {
              // 建筑周边规则: 建筑多边形=室内禁区 → 布在建筑外沿周边带 (≤1×spacing, 收紧贴墙)
              // 🔴 用户修正: 无法分辨建筑内外时按"多边形外=室外"; 贴近建筑外沿而非远处空地
              if (bb.polys) {
                // 在任一建筑环内 → 跳过 (室内) [用取整后坐标检测, 避免边缘点 round 入内]
                if (bb.polys.some(p => pointInRing(x, y, p.ring))) continue
                // 不在任何建筑环的周边带内 → 跳过 (太远非"周边"); 带宽 2×spacing → 1×spacing 贴墙
                const bandOk = bb.polys.some(p => pointInRingBand(x, y, p.ring, spacing))
                if (!bandOk) continue
              }
              // 排除其他建筑块内部 (多建筑时避免落入邻楼)
              if (pointBlocked(x, y)) continue
              // 贴墙下限: 点不压墙 (距任何建筑环边 < 边距 margin → 剔除; 设施需离墙留位)
              if (buildingBlocks.some(p => pointDistToRing(x, y, p.ring) < margin)) continue
              // 避让节点/广场区域: 贴墙设施不落广场中央
              if (inAnyNode(x, y)) continue
              // 🔴 贴红线死角剔除 (用户修正): 建筑朝向红线侧的外墙, 若墙外净空不足
              //   (距红线 < 3×spacing) 即建筑与红线之间的狭缝死角 (红线外=马路/邻楼共墙),
              //   贴墙点不布入该狭缝 (102-4 曾布入 B#9 北墙与红线的楔形缝)
              if (redlineRing && pointDistToRing(x, y, redlineRing) < spacing * 3) continue
            } else {
              // 开放空间规则: 点在多边形内且非洞 (原语义)
              if (bb.polys && !pointInPlaceableArea(x, y, bb.polys)) continue
            }
            // 红线外轮廓避让: 贴红线/越红线点剔除 (马路或红线外邻楼共墙, 不可布点)
            if (offRedline(x, y)) continue
            cands.push({ x, y })
          }
        }
        if (!cands.length) continue
        // 按主轴排序: 形状长边方向优先展开 (通道等细长带)
        const spanX = bb.maxX - bb.minX, spanY = bb.maxY - bb.minY
        cands.sort((a, b) => (spanX >= spanY) ? (a.x - b.x || a.y - b.y) : (a.y - b.y || a.x - b.x))
        // 数量: 按需几何推导 (配置了 AUTO_GAP 的项) vs 原数量参数上限
        //   推导: N = max(AUTO_MIN, floor(锚点主轴跨度/间隔)+1), 受候选数自然约束, 不硬截断
        let need
        const autoGap = AUTO_GAP[f?.standard_item_id]
        if (autoGap) {
          const span = Math.max(spanX, spanY)
          need = Math.max(AUTO_MIN[f.standard_item_id] || 1, Math.floor(span / autoGap) + 1)
          need = Math.min(need, cands.length)
        } else {
          need = Math.min(rowCap, cands.length)
        }
        for (let k = 0; k < need; k++) {
          const idx = Math.round((cands.length - 1) * k / Math.max(need - 1, 1))
          out.push(cands[idx])
        }
      }
      // 锚点不足但期望多些 → 均匀散布区域 (弹性: 至少能布出来; 避开建筑内部)
      if (!out.length && region) {
        const need = Math.max(1, Math.floor(((region.maxX-region.minX)+(region.maxY-region.minY)) / (spacing*2)))
        for (let k = 0; k < Math.min(need, rowCap * 3); k++) {
          const col = k % Math.min(need, rowCap)
          const row = Math.floor(k / Math.min(need, rowCap))
          const x = region.minX + margin + col*spacing + (row%2)*(spacing/2)
          const y = region.minY + margin + row*spacing
          if (pointBlocked(x, y) || offRedline(x, y)) continue   // fallback 也不落建筑内/红线外
          out.push({ x: Math.round(x), y: Math.round(y) })
        }
      }
      // 去重
      const seen = new Set()
      return out.filter(p => { const key = p.x + ',' + p.y; if (seen.has(key)) return false; seen.add(key); return true })
    }

    // 为某标准项执行自动布点 (批写 placements; 覆盖模式先清空)
    const autoPlaceFacility = async (f) => {
      const pts = autoGenPoints(f)
      if (!pts.length) { toast.show('⚠️ 无可用锚点: ' + f.name); return false }
      pushUndo()
      try {
        if (autoOverwrite.value || !placCount(f)) {
          const resp = await API.put('/facilities/' + f.id + '/placements/batch', pts.map(p => ({
            position: { x: p.x, y: p.y, lng: null, lat: null }
          })))
          // 🔴 用后端返回的真实 placement id (勿伪造 'auto-' 假 id → 拖动保存会 404)
          f.placements = (Array.isArray(resp) ? resp : []).map((r, i) => ({
            id: r.id, seq: r.seq != null ? r.seq : i + 1, position: r.position
          }))
        } else {
          // 保留已有: 只追加缺失 (补齐到目标数量)
          const have = placCount(f)
          const add = pts.slice(have)
          for (const p of add) {
            const resp = await API.post('/facilities/' + f.id + '/placements', { position: { x: p.x, y: p.y, lng: null, lat: null } })
            f.placements.push({ id: resp.id, seq: resp.seq, position: { x: p.x, y: p.y } })
          }
        }
        f.position = null
        renderFacilityMarkers()
        updateFacilityLayerCounts()
        return true
      } catch(e) { console.error('auto place fail', f.id, e); toast.show('❌ 自动布点失败: ' + f.name); return false }
    }

    // 「🚀 自动布点」: 对当前选中标准项执行 (点位库行⚡ 或面板按钮)
    const runAutoPlace = async () => {
      if (autoPlacing.value) return
      const f = selectedFac.value
      if (!f) { toast.show('⚠️ 先在点位库点选要布点的标准项'); return }
      autoPlacing.value = true
      try {
        const ok = await autoPlaceFacility(f)
        if (ok) toast.show(`✅ ${f.name} 自动布点完成 (规则: ${STRATEGY_LABEL[placeStrategy.value] || placeStrategy.value})`)
      } finally { autoPlacing.value = false }
    }

    const focusFacility = (f) => {
      // P0: 定位到第一个实例
      let pt = null
      if (Array.isArray(f.placements) && f.placements.length) pt = f.placements[0]?.position
      else if (f.position?.x != null) pt = f.position
      if (!fabricCanvas || !pt) { toast.show('📍 该标准项尚未布点'); return }
      const sp = worldToScreen(pt.x, pt.y)   // 世界 → 场景
      const zoom = fabricCanvas.getZoom()
      const wrap = canvasWrap.value
      const cx = wrap.clientWidth / 2, cy = wrap.clientHeight / 2
      const tx = cx - sp.x * zoom, ty = cy - sp.y * zoom
      fabricCanvas.setViewportTransform([zoom, 0, 0, zoom, tx, ty])
      fabricCanvas.requestRenderAll()
      recomposeForZoom()
      toast.show('📍 定位: ' + f.name)
    }

    // ── 图例表格 (旧层 + 布点符号层) ──
    const buildLegend = () => {
      const rows = []
      // 1) 底图空间图层
      const baseNames = ['TAF-BOUNDARY', 'TAF-BUILDING', 'TAF-CHANNEL', 'TAF-ROAD', 'TAF-GREEN', 'TAF-NODE', 'TAF-FACADE', 'BASEMAP']
      const baseDesc = {
        'TAF-BOUNDARY': '红线边界', 'TAF-BUILDING': '建筑', 'TAF-CHANNEL': '通道/走廊',
        'TAF-ROAD': '道路', 'TAF-GREEN': '绿地', 'TAF-NODE': '节点/广场',
        'TAF-FACADE': '立面', 'BASEMAP': '原始底图',
      }
      for (const nm of baseNames) {
        const l = layers.value.find(x => x.name === nm) || layers.value.find(x => x.name.toUpperCase() === nm)
        if (l || nm === 'TAF-BOUNDARY') {
          rows.push({ layer: nm, main: `${baseDesc[nm] || nm}`, color: LAYER_COLORS[nm] || '#5c6370', icon: null })
        }
      }
      // 2) 布点符号层 (18 项, 每项独立图层)
      for (const [itemId, sym] of Object.entries(makiSymbols)) {
        const fac = facilities.value.find(f => f.standard_item_id === itemId)
        const zh = fac?.name || sym.name_zh || ''
        const cat = itemId.split('-')[0]
        rows.push({
          layer: sym.layer,
          main: `${itemId} ${zh}`,
          icon: sym.path, viewbox: sym.viewbox,
          color: CAT_COLORS[cat] || '#4f8cff',
        })
      }
      legendRows.value = rows
    }

    // ── 全屏 ──
    // 路由级浏览器内全宽由 App 模板 .main-fullwidth 控制 (进入底图页即全宽)
    const toggleTrueFullscreen = async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen()
          trueFs.value = true
        } else {
          await document.exitFullscreen()
          trueFs.value = false
        }
        setTimeout(() => { if (fabricCanvas) fabricCanvas.renderAll() }, 120)
      } catch(e) { toast.show('❌ 全屏不可用: ' + e.message) }
    }
    if (typeof document !== 'undefined') {
      document.addEventListener('fullscreenchange', () => {
        trueFs.value = !!document.fullscreenElement
        setTimeout(() => { if (fabricCanvas) { fabricCanvas.setDimensions({ width: canvasWrap.value?.clientWidth, height: canvasWrap.value?.clientHeight }); fabricCanvas.renderAll() } }, 150)
      })
    }

    const loadMaki = async () => {
      // 内嵌常量立即生效 (无外部依赖, 不受 fetch 污染/失败影响)
      if (typeof MAKI_SYMBOLS !== 'undefined' && MAKI_SYMBOLS && Object.keys(MAKI_SYMBOLS).length) {
        makiSymbols = MAKI_SYMBOLS
        if (layers.value.length) {
          mergeFacilityLayersInto(layers.value)
          updateFacilityLayerCounts()
        }
        buildLegend()
      }
      // fetch 校验: 外部 JSON 若可解析则覆盖 (支持后续独立更新符号库)
      try {
        const resp = await fetch('/taf/maki_symbols.json')
        if (resp.ok) {
          const text = await resp.text()
          if (!/^\s*</.test(text.slice(0, 10))) {   // 防 sub_filter 污染
            const d = JSON.parse(text)
            if (d?.symbols && Object.keys(d.symbols).length) {
              makiSymbols = d.symbols
              if (layers.value.length) {
                mergeFacilityLayersInto(layers.value)
                updateFacilityLayerCounts()
              }
              buildLegend()
            }
          }
        }
      } catch(e) { console.warn('maki fetch update failed (embedded copy in use)', e) }
    }

    onMounted(() => {
      loadProject()
      loadMaki()
      nextTick(() => {
        setTimeout(initCanvas, 100)
        setTimeout(loadBasemaps, 150)
      })
    })

    const loadBasemaps = async () => {
      try {
        const bms = await API.get('/projects/' + route.params.id + '/basemaps')
        if (bms?.length) {
          const dxfBm = bms.find(b => b.file_type === 'dxf')
          if (dxfBm?.file_url) {
            // file_url 形如 {upload_dir}/{project_id}/{filename}; 取末两段拼静态 URL
            const parts = dxfBm.file_url.split('/').filter(Boolean)
            const rel = parts.slice(-2).join('/')
            const url = '/taf/uploads/' + rel
            let tries = 0
            while (!fabricCanvas && tries < 20) { await new Promise(r => setTimeout(r, 100)); tries++ }
            if (!fabricCanvas) { console.error('canvas not ready'); return }
            const resp = await fetch(url)
            if (resp.ok) {
              const text = await resp.text()
              if (/^\s*</.test(text.slice(0, 50)) && !/SECTION|AC1\d\d/.test(text.slice(0, 200))) {
                console.error('DXF fetch returned HTML (SPA fallback?)', url)
                toast.show('⚠️ 无法加载已上传底图 (静态文件路由缺失), 请重新上传或联系管理员')
                return
              }
              renderDXF(text)
              refreshFacilities()
            } else {
              console.error('DXF fetch failed', resp.status, url)
              toast.show('⚠️ 底图加载失败 HTTP ' + resp.status + ', 请重新上传')
            }
          }
        }
      } catch(e) { console.error(e) }
    }

    return { projectName, projectCode, layers, tool, zoomPct, canvasSize, selectedObj, facilities,
      undoStack, redoStack, undoPlacement, redoPlacement, removePlacement, removeOnePlacement,
      textInput, textValue, canvasWrap, canvasEl, fileInput,
      triggerUpload, onFileUpload, fitScreen, updateLayerVisibility, updateLayerOpacity,
      confirmText, cancelText, exportView, refreshFacilities, focusFacility,
      hideLeft, hideLib, hideTools, fullscreen, trueFs, toggleTrueFullscreen, showAllFac,
      loading, loadProgress, loadStage,
      setTool, selectFacility, facFilter, filteredFacilities, selectedFac, facPlaceHint,
      facSymbol, facColor, isAreaItem, areaLabelOf, placCount, placableCount, autoPlacing, placeStrategy, placeSpacing,
      placeMargin, perRow, symScale, autoOverwrite, scheduleReauto,
      openAutoPlace, runAutoPlace, autoPanelActive, legendRows, buildLegend,
      availableStrategies, autoPlaceFacility, autoCountItem,
      facStatusCN, facStatusColor, facCats, facCountOf, toggleLayerLock,
      toggleLayerVisible, catNames, layerCN,
      opacityLayer, toggleOpacityPopup, startLeftDrag, leftWidth }
  }
}

      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:16px">
        <thead><tr style="color:var(--muted);font-size:14px;text-align:left"><th style="padding:8px;border-bottom:1px solid var(--border);width:60px">编号</th><th style="padding:8px;border-bottom:1px solid var(--border)">名称</th><th style="padding:8px;border-bottom:1px solid var(--border);width:60px">类型</th><th style="padding:8px;border-bottom:1px solid var(--border);width:70px">状态</th><th style="padding:8px;border-bottom:1px solid var(--border);width:50px">数量</th><th style="padding:8px;border-bottom:1px solid var(--border)">规格/备注</th><th style="padding:8px;border-bottom:1px solid var(--border);width:50px"></th></tr></thead>
        <tbody><tr v-for="f in cat.items" :key="f.id" @click="editFacility(f)" style="cursor:pointer" @mouseenter="e=>e.currentTarget.style.background='#ffffff04'" @mouseleave="e=>e.currentTarget.style.background=''"><td style="padding:8px;font-family:monospace;font-size:14px;color:var(--accent)">{{ f.standard_item_id }}</td><td style="padding:8px"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:{f.status==='installed'?'#67c23a':f.status==='confirmed'?'#e6a23c':f.status==='selected'?'#4f8cff':'#8b8fa3'}"></span>{{ f.name }}</td><td style="padding:8px"><span style="font-size:14px;padding:2px 6px;border-radius:3px" :style="{background:f.type==='prerequisite'?'#f56c6c1a':'#67c23a1a',color:f.type==='prerequisite'?'#f56c6c':'#67c23a'}">{{ f.type==='prerequisite'?'必选':'可选' }}</span></td><td style="padding:8px"><span :style="{color:f.status==='installed'?'#67c23a':f.status==='confirmed'?'#e6a23c':'#8b8fa3'}">{{ facStatusLabel(f.status) }}</span></td><td style="padding:8px">{{ f.quantity }}</td><td style="padding:8px;font-size:15px;color:var(--muted);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ f.notes || '-' }}</td><td style="padding:8px"><button class="btn sm" @click.stop="editFacility(f)">✎</button></td></tr></tbody>
      </table></div>
    </div>
    <div class="dialog-mask" v-if="editDlg" @click.self="editDlg=false"><div class="dialog" style="width:480px"><h3>{{ editForm.id ? '编辑' : '新增' }}设施</h3><div class="form-group"><label>关联标准项</label><input type="text" v-model="editForm.standard_item_id"></div><div class="form-group"><label>名称</label><input type="text" v-model="editForm.name"></div><div class="form-group"><label>类型</label><select v-model="editForm.type"><option value="prerequisite">必选</option><option value="credit">可选</option></select></div><div class="form-group"><label>类别</label><select v-model="editForm.category"><option v-for="c in cats" :key="c.id" :value="c.id">{{ c.id }} {{ c.name }}</option></select></div><div class="form-group"><label>状态</label><select v-model="editForm.status"><option value="draft">草稿</option><option value="selected">已选</option><option value="confirmed">已确认</option><option value="installed">已安装</option></select></div><div class="form-group"><label>数量</label><input type="number" v-model.number="editForm.quantity" min="1"></div><div class="form-group"><label>备注</label><textarea v-model="editForm.notes" rows="2"></textarea></div><div class="form-actions"><button class="btn" @click="editDlg=false">取消</button><button class="btn danger" v-if="editForm.id" @click="deleteFacility">删除</button><button class="btn primary" @click="saveFacility">保存</button></div></div></div>
  </div>`,
  setup() {
    const route = VueRouter.useRoute()
    const projectName = ref(''), facilities = ref([]), evalResult = ref(null), evaluating = ref(false)
    const editDlg = ref(false)
    const editForm = reactive({ id:null, standard_item_id:'', name:'', type:'credit', category:'P1', status:'draft', quantity:1, notes:'' })
    const cats = ref([])
    const groupedFacilities = computed(() => { const g={}; for(const f of facilities.value){ const c=f.category; if(!g[c]) g[c]={id:c,name:cats.value.find(x=>x.id===c)?.name||c,items:[]}; g[c].items.push(f) } return Object.values(g).sort((a,b)=>a.id.localeCompare(b.id)) })
    const load = async () => { try { const p=await API.get('/projects/'+route.params.id); projectName.value=p.name; const std=await API.get('/projects/'+route.params.id+'/standard'); cats.value=std?.standard?.config?.categories||[]; facilities.value=await API.get('/projects/'+route.params.id+'/facilities') } catch(e){console.error(e)} }
    onMounted(load)
    const editFacility = (f) => { Object.assign(editForm,{id:f.id,standard_item_id:f.standard_item_id,name:f.name,type:f.type,category:f.category,status:f.status,quantity:f.quantity,notes:f.notes||''}); editDlg.value=true }
    const addFacility = () => { Object.assign(editForm,{id:null,standard_item_id:'',name:'',type:'credit',category:'P1',status:'draft',quantity:1,notes:''}); editDlg.value=true }
    const saveFacility = async () => { try { const pid=route.params.id; if(editForm.id){ await API.put('/facilities/'+editForm.id,{name:editForm.name,type:editForm.type,category:editForm.category,status:editForm.status,quantity:editForm.quantity,notes:editForm.notes}) } else { await API.post('/projects/'+pid+'/facilities',{standard_item_id:editForm.standard_item_id,name:editForm.name,type:editForm.type,category:editForm.category,status:editForm.status,quantity:editForm.quantity,notes:editForm.notes}) } toast.show('✅ 保存成功'); editDlg.value=false; load() } catch(e){ toast.show('❌ 保存失败') } }
    const deleteFacility = async () => { if(!confirm('确认删除？')) return; try { await fetch(API.base+'/facilities/'+editForm.id,{method:'DELETE'}); toast.show('✅ 已删除'); editDlg.value=false; load() } catch(e){ toast.show('❌ 删除失败') } }
    const evaluate = async () => { evaluating.value=true; try { evalResult.value=await API.post('/projects/'+route.params.id+'/evaluate',{}) } catch(e){ toast.show('❌ 评估失败') }; evaluating.value=false }
    const batchConfirm = async () => {
      if (!confirm('将所有设施状态改为 confirmed？')) return
      try {
        for (const f of facilities.value) {
          if (f.status !== 'confirmed') await API.put('/facilities/'+f.id, {status:'confirmed'})
        }
        toast.show('✅ 全部确认完成')
        load()
        evaluate()
      } catch(e) { toast.show('❌ 确认失败') }
    }
    const exportReport = async () => {
      try {
        const r = await API.get('/projects/'+route.params.id+'/report')
        const blob = new Blob([r.report_html], {type:'text/html'})
        const url = URL.createObjectURL(blob)
        const a = document.createElement('a')
        a.href = url; a.download = 'TAF_Report_' + projectName.value + '_' + new Date().toISOString().slice(0,10) + '.html'
        a.click()
        URL.revokeObjectURL(url)
        toast.show('📄 报告已下载')
      } catch(e) { toast.show('❌ 导出失败') }
    }
    return { projectName, facilities, evalResult, evaluating, editDlg, editForm, cats, groupedFacilities, editFacility, addFacility, saveFacility, deleteFacility, evaluate, batchConfirm, exportReport, facStatusLabel }
  }
}

// ─── Deliverables Page ───
const DeliverablesPage = {
  template: `
  <div>
    <div style="margin-bottom:16px;display:flex;align-items:center;gap:12px">
      <button class="btn" @click="$router.back()">← 返回</button>
      <span style="font-size:21px;font-weight:600">{{ projectName }} · 策划成果</span>
    </div>

    <div v-if="loading" class="empty"><div class="icon">⏳</div>加载中...</div>

    <div v-if="!loading">
      <div class="card">
        <div class="card-title">📦 成果清单</div>
        <div class="card-sub">一键生成所有策划成果，自动打包上传坚果云</div>

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">
          <button class="btn primary" @click="generate('boq')" :disabled="generating">📋 设施清单</button>
          <button class="btn primary" @click="generate('priority-matrix')" :disabled="generating">📊 优先级矩阵</button>
          <button class="btn primary" @click="generate('layout')" :disabled="generating">🗺️ 布点图 DXF</button>
          <button class="btn primary" @click="generate('annotated-map')" :disabled="generating">🖼️ 标注渲染图</button>
          <button class="btn primary" @click="generate('heatmap')" :disabled="generating">🔥 热力图</button>
          <button class="btn primary" @click="generate('narrative')" :disabled="generating">✍️ 空间叙事</button>
          <button class="btn primary" @click="generate('prompts')" :disabled="generating">🎨 渲染提示词</button>
        </div>
        <button class="btn" style="background:var(--success);color:#fff;border-color:var(--success);width:100%;padding:10px" @click="packageAll" :disabled="generating">
          📦 一键打包全部 → 坚果云
        </button>
      </div>

      <div v-if="results.length" class="card" style="margin-top:16px">
        <div class="card-title">✅ 已生成 ({{ results.length }})</div>
        <div v-for="r in results" :key="r.id" style="display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);gap:12px">
          <span style="width:120px;font-size:16px">{{ r.name }}</span>
          <span style="font-size:14px;color:var(--muted)">{{ r.format }}</span>
          <span v-if="r.size" style="font-size:14px;color:var(--muted)">{{ (r.size/1024).toFixed(1) }} KB</span>
          <span v-if="r.status==='ok'" style="color:var(--success)">✅</span>
          <span v-if="r.status==='error'" style="color:var(--danger)">❌ {{ r.error }}</span>
          <button v-if="r.download_url" class="btn sm" @click="download(r)">⬇ 下载</button>
        </div>
      </div>

      <div v-if="packageResult" class="card" style="margin-top:16px">
        <div class="card-title">📦 打包结果</div>
        <div style="font-size:16px">ZIP: {{ (packageResult.zip_size/1024).toFixed(0) }} KB</div>
        <div v-if="packageResult.nutstore?.status===201" style="color:var(--success);font-size:16px">✅ 已上传坚果云</div>
        <div v-if="packageResult.nutstore?.path" style="font-size:14px;color:var(--muted)">{{ packageResult.nutstore.path }}</div>
      </div>
    </div>
  </div>`,
  setup() {
    const route = VueRouter.useRoute()
    const projectName = ref('')
    const loading = ref(true)
    const generating = ref(false)
    const results = ref([])
    const packageResult = ref(null)

    const API_BASE = '/taf/api/projects/' + route.params.id + '/deliverables'

    onMounted(async () => {
      try {
        const p = await (await fetch(API.base + '/projects/' + route.params.id)).json()
        projectName.value = p.name || p.code
      } catch(e) {}
      loading.value = false
    })

    const generate = async (type) => {
      generating.value = true
      const methods = { 'layout':'POST','annotated-map':'POST','benchmark':'POST' }
      const method = methods[type] || 'GET'
      const opts = method === 'POST' ? { method:'POST' } : {}
      try {
        const r = await fetch(API_BASE + '/' + type, opts)
        const ct = r.headers.get('content-type') || ''
        if (ct.includes('json')) {
          const json = await r.json()
          results.value.unshift({ id: Date.now(), name: json.code || type, format: 'json', status:'ok' })
        } else {
          const blob = await r.blob()
          results.value.unshift({
            id: Date.now(), name: type, format: type === 'layout' ? 'dxf' : type.includes('map')||type==='heatmap' ? 'png' : 'bin',
            size: blob.size, status:'ok',
            download_url: URL.createObjectURL(blob)
          })
        }
      } catch(e) {
        results.value.unshift({ id: Date.now(), name: type, status:'error', error: e.message })
      }
      generating.value = false
    }

    const packageAll = async () => {
      generating.value = true
      try {
        const r = await fetch(API_BASE + '/package', { method:'POST' })
        const json = await r.json()
        if (json.detail) throw new Error(json.detail)
        packageResult.value = json
        if (json.files) {
          json.files.forEach(f => {
            results.value.unshift({ id: Date.now(), name: f.name, format: f.format, size: f.size, status:'ok' })
          })
        }
      } catch(e) {
        packageResult.value = { error: e.message }
      }
      generating.value = false
    }

    const download = (r) => {
      const a = document.createElement('a')
      a.href = r.download_url
      a.download = r.name
      a.click()
    }

    return { projectName, loading, generating, results, packageResult, generate, packageAll, download }
  }
}

// ─── Router ───
const routes = [
  { path: '/', redirect: '/standards' },
  { path: '/standards', component: StandardsList },
  { path: '/standards/:code', component: StandardsDetail },
  { path: '/projects', component: ProjectsList },
  { path: '/projects/:id', component: ProjectDetail },
  { path: '/projects/:id/basemap', component: BasemapEditor },
  { path: '/projects/:id/facilities', component: FacilitiesPage },
  { path: '/projects/:id/deliverables', component: DeliverablesPage },
]
const router = createRouter({ history: createWebHashHistory(), routes })

// ─── App ───
const App = {
  template: `<div>
    <nav class="nav">
      <a href="#/" class="logo">它界 TAF</a>
      <router-link to="/standards">评估标准</router-link>
      <router-link to="/projects">评估项目</router-link>
    </nav>
    <div v-if="toast.msg.value" class="toast">{{ toast.msg.value }}</div>
    <div :class="isBasemap ? 'main main-fullwidth' : 'main'"><router-view></router-view></div>
  </div>`,
  setup() {
    const route = VueRouter.useRoute()
    const isBasemap = Vue.computed(() => /\/basemap$/.test(route.path))
    return { toast, isBasemap }
  }
}

const app = createApp(App)
app.use(router)
app.use(ElementPlus)
app.mount('#app')
</script>
</body>
</html>

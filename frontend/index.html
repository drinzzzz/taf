<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>它界 TAF — 人宠友好空间评估平台</title>
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
<script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dxf-parser@1/dist/dxf-parser.min.js"></script>
<style>
:root { --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a; --text: #e4e6eb; --muted: #8b8fa3; --accent: #4f8cff; --danger: #f56c6c; --success: #67c23a; --warning: #e6a23c; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
#app { display:flex; flex-direction:column; min-height:100vh; }

/* Nav */
.nav { background:var(--card); border-bottom:1px solid var(--border); padding:0 24px; display:flex; align-items:center; height:48px; gap:24px; flex-shrink:0; }
.nav .logo { font-size:18px; font-weight:700; color:var(--accent); text-decoration:none; }
.nav a { color:var(--muted); text-decoration:none; font-size:16px; padding:4px 12px; border-radius:4px; transition:all .2s; }
.nav a:hover, .nav a.router-link-active, .nav a.router-link-exact-active { color:var(--accent) !important; background:#ffffff0f !important; }

/* Layout */
.main { flex:1; padding:24px; max-width:1400px; margin:0 auto; width:100%; }
.card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:20px; margin-bottom:16px; }
.wizard-steps { display:flex; align-items:center; gap:0; }
.wizard-step { display:flex; flex-direction:column; align-items:center; gap:2px; }
.wizard-step .step-num { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; background:#ffffff08; color:var(--muted); border:2px solid var(--border); transition:all .3s; }
.wizard-step .step-label { font-size:10px; color:var(--muted); white-space:nowrap; }
.wizard-step.active .step-num { background:var(--accent); color:#fff; border-color:var(--accent); }
.wizard-step.active .step-label { color:var(--accent); }
.wizard-step.done .step-num { background:var(--success); color:#fff; border-color:var(--success); }
.wizard-step.done .step-label { color:var(--success); }
.wizard-line { flex:1; height:2px; background:var(--border); min-width:16px; transition:background .3s; }
.wizard-line.done { background:var(--success); }

.card-title { font-size:19px; font-weight:600; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.card-sub { font-size:14px; color:var(--muted); margin-bottom:20px; }

/* Table */
.el-table { --el-table-bg-color:transparent; --el-table-tr-bg-color:transparent; --el-table-header-bg-color:transparent; --el-table-border-color:var(--border); --el-table-text-color:var(--text); --el-table-header-text-color:var(--muted); }
.el-table th.el-table__cell { background:transparent; border-bottom:1px solid var(--border); font-size:13px; text-transform:uppercase; letter-spacing:.5px; }
.el-table tr { transition:background .15s; cursor:pointer; }
.el-table tr:hover > td { background:#ffffff06 !important; }

/* Element Plus dark mode overrides */
.el-loading-mask { background-color:rgba(10,10,30,0.85) !important; }
.el-loading-spinner .el-loading-text { color:var(--muted) !important; }
.el-loading-spinner .path { stroke:var(--accent) !important; }
.el-table__empty-block { background:transparent !important; }
.el-table__empty-text { color:var(--muted) !important; }


/* Category block */
.cat-block { border:1px solid var(--border); border-radius:8px; margin-bottom:12px; overflow:hidden; }
.cat-header { display:flex; align-items:center; padding:14px 18px; background:#ffffff05; cursor:pointer; gap:12px; user-select:none; }
.cat-header:hover { background:#ffffff0a; }
.cat-header .drag-handle { color:var(--muted); cursor:grab; font-size:16px; }
.cat-header .cat-name { font-weight:600; font-size:15px; flex:1; }
.cat-header .cat-weight { font-size:13px; color:var(--muted); }
.cat-header .cat-arrow { transition:transform .2s; color:var(--muted); }
.cat-header .cat-arrow.open { transform:rotate(90deg); }
.cat-body { border-top:1px solid var(--border); }
.cat-body.hidden { display:none; }

/* Item row */
.item-row { display:flex; align-items:center; padding:10px 18px 10px 30px; gap:12px; border-bottom:1px solid var(--border); transition:background .15s; }
.item-row:last-child { border-bottom:none; }
.item-row:hover { background:#ffffff03; }
.item-row .drag-handle { color:var(--muted); cursor:grab; font-size:14px; }
.item-row .item-id { font-size:11px; color:var(--accent); font-family:monospace; min-width:48px; }
.item-row .item-name { flex:1; font-size:15px; }
.item-row .item-type { font-size:13px; padding:2px 8px; border-radius:3px; }
.item-row .item-type.prerequisite { background:#f56c6c1a; color:#f56c6c; }
.item-row .item-type.credit { background:#67c23a1a; color:#67c23a; }
.item-row .item-score { font-size:14px; color:var(--muted); min-width:40px; text-align:right; }
.item-row .item-actions { display:flex; gap:4px; }

/* Editable */
/* Dark mode selects */
select { background:#1a1a2e; color:var(--text); border:1px solid var(--border); border-radius:4px; padding:6px 10px; font-size:14px; }
select option { background:#1a1a2e; color:var(--text); }
.el-select-dropdown { background:#1a1a2e !important; border:1px solid var(--border) !important; }
.el-select-dropdown__item { color:var(--text) !important; }
.el-select-dropdown__item.hover, .el-select-dropdown__item:hover { background:#ffffff0a !important; }
.el-select-dropdown__item.selected { color:var(--accent) !important; }
.el-popper.is-light { background:#1a1a2e !important; border:1px solid var(--border) !important; }
.dialog select, .dialog-mask select { background:#0f0f23; color:var(--text); border:1px solid var(--border); border-radius:4px; padding:8px 10px; font-size:14px; }

input[type=text], textarea { background:#ffffff0a; border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:4px; font-size:13px; width:100%; outline:none; }
input[type=text]:focus, textarea:focus { border-color:var(--accent); }
select { background:#ffffff0a; border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:4px; font-size:13px; outline:none; }
.weight-slider { display:flex; align-items:center; gap:12px; padding:4px 0; }
.weight-slider input[type=range] { flex:1; accent-color:var(--accent); }
.weight-slider .weight-val { font-size:14px; font-weight:600; min-width:48px; text-align:right; color:var(--accent); }

/* Buttons */
.btn { padding:6px 14px; border-radius:4px; font-size:13px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer; display:inline-flex; align-items:center; gap:4px; transition:all .15s; }
.btn:hover { background:#ffffff0a; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.primary:hover { opacity:.9; }
.btn.danger { color:var(--danger); border-color:var(--danger); }
.btn.sm { padding:3px 8px; font-size:12px; }

/* Dialog overlay */
.dialog-mask { position:fixed; inset:0; background:#00000080; z-index:1000; display:flex; align-items:center; justify-content:center; }
.dialog { background:var(--card); border:1px solid var(--border); border-radius:12px; width:520px; max-height:80vh; overflow-y:auto; padding:24px; }
.dialog h3 { margin-bottom:16px; font-size:16px; }
.dialog .form-group { margin-bottom:14px; }
.dialog .form-group label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; text-transform:none; letter-spacing:0; }
.dialog .form-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; }
/* Field display */
label { display:block; font-size:11px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px; }
.field-val { padding:6px 0; font-size:15px; }
.card label { display:block; font-size:11px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px; }
.card .field-val { padding:6px 0; font-size:15px; }

/* Sortable ghost */
.sortable-ghost { opacity:.3; background:var(--accent) !important; }
.sortable-chosen { background:#ffffff0a !important; }

/* Toast */
.toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--success); color:#fff; padding:10px 24px; border-radius:6px; font-size:14px; z-index:2000; animation:toastIn .3s; }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

/* Empty state */
.empty { text-align:center; padding:60px 20px; color:var(--muted); }
.empty .icon { font-size:48px; margin-bottom:16px; }

.scoring-row { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
.scoring-row input { flex:1; }
.scoring-row input[type=number] { width:60px; flex:0 0 60px; }
</style>
</head>
<body>
<div id="app">
  <nav class="nav">
    <a href="#/" class="logo">它界 TAF</a>
    <router-link to="/standards">评估标准</router-link>
    <router-link to="/projects">评估项目</router-link>
  </nav>
  <div class="main">
    <router-view></router-view>
  </div>
</div>

<script>
const { createApp, ref, reactive, computed, onMounted, nextTick, watch } = Vue
const { createRouter, createWebHashHistory } = VueRouter

const PRODUCT_LINES = ['HT','OS','AP','HO','RE','OF','MC']
const STATUS_LABELS = { draft: '草稿', active: '进行中', completed: '已完成', archived: '归档' }
const statusLabel = (s) => STATUS_LABELS[s] || s

// ─── API helper ───
const API = {
  base: (window.__TAF_API_BASE__ || '/taf/api'),
  async get(path) { const r = await fetch(this.base + path); if(!r.ok) throw await r.json(); return r.json(); },
  async post(path, data) { const r = await fetch(this.base + path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) }); if(!r.ok) throw await r.json(); return r.json(); },
  async put(path, data) { const r = await fetch(this.base + path, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) }); if(!r.ok) throw await r.json(); return r.json(); },
}

// ─── Toast ───
const toast = { ref: ref(null), msg: ref(''), show(m) { this.msg.value = m; clearTimeout(this._t); this._t = setTimeout(() => this.msg.value = '', 2000); } }

// ─── Standards List ───
const StandardsList = {
  template: `
  <div>
    <div class="card">
      <div class="card-title">📋 评估标准清单</div>
      <div class="card-sub">可插拔的评估标准插件，支持版本化管理</div>
      <el-table :data="standards" style="width:100%" v-loading="loading" empty-text="暂无标准" @row-click="openDetail">
        <el-table-column prop="code" label="编码" width="180" />
        <el-table-column prop="name" label="名称" min-width="200" />
        <el-table-column prop="version" label="版本" width="100" />
        <el-table-column label="状态" width="110">
          <template #default="{row}">
            <span :style="{color:row.status==='active'?'#67c23a':'#e6a23c'}">{{ row.status === 'active' ? '● 活跃' : '○ 预览' }}</span>
          </template>
        </el-table-column>
        <el-table-column label="指标" width="80">
          <template #default="{row}">
            {{ row.config?.total_items || row.config?.items?.length || '-' }}
          </template>
        </el-table-column>
        <el-table-column prop="release_date" label="发布日期" width="110" :formatter="formatDate" />
      </el-table>
    </div>
  </div>`,
  setup() {
    const standards = ref([])
    const loading = ref(true)
    onMounted(async () => {
      try {
        const list = await API.get('/standards')
        // Fetch full data for each
        const full = await Promise.all(list.map(s => API.get('/standards/' + s.code)))
        standards.value = full
      } catch(e) { console.error(e) }
      loading.value = false
    })
    const router = VueRouter.useRouter()
    const openDetail = (row) => { router.push('/standards/' + row.code) }
    const formatDate = (row, col, val) => { if(!val) return '-'; const d=val.split('T')[0].split('-'); return d[0]+'.'+parseInt(d[1])+'.'+parseInt(d[2]); };
    return { standards, loading, openDetail, formatDate }
  }
}

// ─── Standards Detail / Editor ───
const StandardsDetail = {
  template: `
  <div>
    <div style="margin-bottom:16px;display:flex;align-items:center;gap:12px">
      <button class="btn" @click="$router.back()">← 返回</button>
      <span style="font-size:18px;font-weight:600">{{ standard?.name }}</span>
      <span style="font-size:12px;color:var(--muted)">{{ standard?.code }} · v{{ standard?.version }}</span>
    </div>

    <div v-if="loading" class="empty"><div class="icon">⏳</div>加载中...</div>

    <div v-if="standard && !loading">
      <!-- Info card -->
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div>
            <span style="font-size:13px;color:var(--muted)">产品线：</span>
            <span v-for="pl in config?.product_lines" :key="pl" style="margin-right:8px;font-size:13px;background:var(--accent);color:#fff;padding:2px 8px;border-radius:3px">{{ pl }}</span>
          </div>
          <div style="font-size:13px;color:var(--muted)">
            总计 {{ config?.total_items || 0 }} 项 · 必选 {{ config?.prerequisite_count || 0 }} 项
          </div>
        </div>
      </div>

      <!-- Tip -->
      <div style="padding:0 0 16px;font-size:12px;color:var(--muted)">
        ↕ 拖拽排序 · 点击板块展开编辑 · 
        权重总和: <span :style="{color:weightTotal===100?'#67c23a':'#f56c6c'}">{{ weightTotal }}%</span>
        <button class="btn sm primary" @click="save" style="margin-left:16px">💾 保存</button>
      </div>

      <!-- Categories -->
      <div ref="catList">
        <div v-for="(cat, ci) in categories" :key="cat.id" class="cat-block" :data-cat-id="cat.id">
          <div class="cat-header" @click="toggleCat(ci)">
            <span class="drag-handle">⠿</span>
            <span class="cat-name">{{ cat.id }} {{ cat.name }}</span>
            <div class="weight-slider" style="width:200px" @click.stop>
              <input type="range" min="0" max="100" step="1" v-model.number="cat.weight_pct" @input="onWeightChange(ci)">
              <span class="weight-val">{{ cat.weight_pct }}%</span>
            </div>
            <span class="cat-arrow" :class="{open: cat.open}">▶</span>
            <button class="btn sm" style="color:#f56c6c;margin-left:4px" @click.stop="deleteCategory(ci)" title="删除板块">✕</button>
          </div>
          <div class="cat-body" :class="{hidden: !cat.open}">
            <div :ref="el => { if(el) itemLists[cat.id] = el }">
              <div v-for="(item, ii) in cat.items" :key="item.id" class="item-row" :data-item-id="item.id">
                <span class="drag-handle">⠿</span>
                <span class="item-id">{{ item.id }}</span>
                <span class="item-name">{{ item.name }}</span>
                <span class="item-type" :class="item.type">{{ item.type === 'prerequisite' ? '必选' : '可选' }}</span>
                <span class="item-score">满分 {{ item.score_max }}</span>
                <span class="item-actions">
                  <button class="btn sm" @click="editItem(ci, ii)">✎</button>
                </span>
              </div>
            </div>
            <div v-if="!cat.items.length" style="padding:16px;text-align:center;color:var(--muted);font-size:13px">暂无评估项</div>
            <button class="btn sm" style="margin:8px 18px" @click="addItem(cat.id)">+ 添加评估项</button>
          </div>
        </div>
      </div>

      <!-- Add category button -->
      <button class="btn" style="margin-top:12px" @click="addCategory">+ 新增板块</button>
    </div>

    <!-- Edit Item Dialog -->
    <div class="dialog-mask" v-if="editing" @click.self="closeEdit">
      <div class="dialog">
        <h3>编辑评估项</h3>
        <div class="form-group"><label>编号</label><input type="text" v-model="editForm.id"></div>
        <div class="form-group"><label>名称</label><input type="text" v-model="editForm.name"></div>
        <div class="form-group">
          <label>类型</label>
          <select v-model="editForm.type">
            <option value="prerequisite">必选 (prerequisite)</option>
            <option value="credit">可选 (credit)</option>
          </select>
        </div>
        <div class="form-group"><label>满分</label><input type="number" v-model.number="editForm.score_max" min="1" max="10"></div>
        <div class="form-group"><label>评分标准（分数 | 描述）</label>
          <div v-for="(c, i) in editForm.scoring_criteria" :key="i" class="scoring-row">
            <input type="number" v-model.number="c.score" min="0" :max="editForm.score_max" style="width:60px;flex:0 0 60px">
            <input type="text" v-model="c.label" :placeholder="'描述 (如：全屋防滑地胶)'">
            <button class="btn sm danger" @click="editForm.scoring_criteria.splice(i,1)">×</button>
          </div>
          <button class="btn sm" style="margin-top:4px" @click="editForm.scoring_criteria.push({score:0,label:''})">+ 添加评分等级</button>
        </div>
        <div class="form-actions">
          <button class="btn" @click="closeEdit">取消</button>
          <button class="btn primary" @click="saveEdit">确认</button>
        </div>
      </div>
    </div>
  </div>`,
  setup() {
    const route = VueRouter.useRoute()
    const router = VueRouter.useRouter()
    const standard = ref(null)
    const config = ref(null)
    const categories = ref([])
    const loading = ref(true)
    const editing = ref(false)
    const editForm = reactive({ id:'', name:'', type:'credit', score_max:5, scoring_criteria:[{score:5,label:''}] })
    let editCi = -1, editIi = -1
    const catList = ref(null)
    const itemLists = reactive({})

    onMounted(async () => {
      try {
        const s = await API.get('/standards/' + route.params.code)
        standard.value = s
        config.value = s.config
        // Parse categories with open state and weight as percentage
        categories.value = (s.config.categories || []).map(c => ({
          ...c,
          open: false,
          weight_pct: Math.round(c.weight * 100),
          items: (s.config.items || []).filter(i => i.category === c.id)
        }))
        await nextTick()
        initSortable()
      } catch(e) { console.error(e) }
      loading.value = false
    })

    const toggleCat = (i) => { categories.value[i].open = !categories.value[i].open }

    const onWeightChange = (ci) => {
      // Auto-normalize: keep others proportional
    }

    const weightTotal = computed(() => {
      return categories.value.reduce((sum, c) => sum + (c.weight_pct || 0), 0)
    })

    const addItem = (catId) => {
      const cat = categories.value.find(c => c.id === catId)
      if (!cat) return
      const idx = cat.items.length + 1
      const newId = catId + '-' + String(idx).padStart(2, '0')
      cat.items.push({
        id: newId, name: '新评估项', type: 'credit', score_max: 5,
        scoring_criteria: [{score: 5, label: ''}], category: catId,
        affected_subjects: [], evaluation_method: ''
      })
      nextTick(() => initSortable())
    }

    const editItem = (ci, ii) => {
      editCi = ci; editIi = ii
      const item = categories.value[ci].items[ii]
      editForm.id = item.id
      editForm.name = item.name
      editForm.type = item.type
      editForm.score_max = item.score_max
      editForm.scoring_criteria = JSON.parse(JSON.stringify(item.scoring_criteria || [{score:5,label:''}]))
      editing.value = true
    }

    const closeEdit = () => { editing.value = false }

    const saveEdit = () => {
      if (editCi < 0) return
      const item = categories.value[editCi].items[editIi]
      item.name = editForm.name
      item.type = editForm.type
      item.score_max = editForm.score_max
      item.scoring_criteria = editForm.scoring_criteria.filter(c => c.label || c.score)
      // Ensure category matches
      item.category = categories.value[editCi].id
      editing.value = false
    }

    const addCategory = () => {
      const id = 'P' + (categories.value.length + 1)
      categories.value.push({
        id, name: '新板块', weight: 0, weight_pct: 0,
        description: '', open: true, items: []
      })
      nextTick(() => initSortable())
    }

    const deleteCategory = (ci) => {
      if (!confirm(`确定删除板块「${categories.value[ci].name}」及其所有评估项？`)) return
      categories.value.splice(ci, 1)
      nextTick(() => initSortable())
    }

    const save = async () => {
      // Rebuild config
      const cats = categories.value.map(c => ({
        id: c.id, name: c.name, weight: c.weight_pct / 100,
        description: c.description
      }))
      const items = categories.value.flatMap(c => c.items.map(i => ({
        ...i, category: c.id
      })))
      const cfg = {
        ...config.value,
        categories: cats,
        items: items,
        total_items: items.length,
        prerequisite_count: items.filter(i => i.type === 'prerequisite').length,
      }
      // Fix weight_presets: preserve existing keys, update with current
      const wp = {}
      cats.forEach(c => { wp[c.id] = c.weight_pct / 100 })
      const existingWp = config.value?.weight_presets || {}
      cfg.weight_presets = { ...existingWp }
      // Update all existing presets with current weights
      for (const key of Object.keys(cfg.weight_presets)) {
        cfg.weight_presets[key] = { ...cfg.weight_presets[key] }
        cats.forEach(c => { cfg.weight_presets[key][c.id] = c.weight_pct / 100 })
      }

      try {
        const body = {
          name: standard.value.name,
          version: standard.value.version,
          status: standard.value.status,
          release_date: standard.value.release_date,
          code: standard.value.code,
          config: cfg
        }
        const result = await API.put('/standards/' + standard.value.code, body)
        toast.show('✅ 已保存为新版本: ' + result.code)
        // Redirect to new version after short delay
        setTimeout(() => router.push('/standards/' + result.code), 800)
      } catch(e) {
        console.error(e)
        toast.show('❌ 保存失败: ' + (e.detail || e.message || ''))
      }
    }

    function initSortable() {
      // Sortable for categories
      if (catList.value) {
        Sortable.create(catList.value, {
          handle: '.drag-handle',
          animation: 200,
          onEnd(evt) {
            const moved = categories.value.splice(evt.oldIndex, 1)[0]
            categories.value.splice(evt.newIndex, 0, moved)
          }
        })
      }
      // Sortable for items in each category
      for (const catId in itemLists) {
        if (itemLists[catId]) {
          Sortable.create(itemLists[catId], {
            handle: '.drag-handle',
            animation: 200,
            group: 'items',
            onEnd(evt) {
              const fromCat = categories.value.find(c => c.id === evt.from.closest('.cat-block')?.dataset.catId)
              const toCat = categories.value.find(c => c.id === evt.to.closest('.cat-block')?.dataset.catId)
              if (fromCat && toCat) {
                const moved = fromCat.items.splice(evt.oldIndex, 1)[0]
                moved.category = toCat.id
                toCat.items.splice(evt.newIndex, 0, moved)
              }
            }
          })
        }
      }
    }

    return { standard, config, categories, loading, editing, editForm, catList, itemLists, weightTotal,
      toggleCat, onWeightChange, editItem, closeEdit, saveEdit, addCategory, addItem, deleteCategory, save }
  }
}

      <span>画布: {{ canvasSize }}</span>
      <span v-if="selectedObj">选中: {{ selectedObj }}</span>
    </div>

    <!-- Annotation input -->
    <div v-if="textInput" class="dialog-mask" @click.self="cancelText">
      <div class="dialog" style="width:360px">
        <h3>标注文字</h3>
        <input type="text" v-model="textValue" @keyup.enter="confirmText" placeholder="输入标注文字..." style="width:100%">
        <div class="form-actions">
          <button class="btn" @click="cancelText">取消</button>
          <button class="btn primary" @click="confirmText">确认</button>
        </div>
      </div>
    </div>
  </div>`,
  setup() {
    const route = VueRouter.useRoute()
    const projectName = ref('')
    const layers = ref([])
    const tool = ref('pan')
    const zoomPct = ref(100)
    const canvasSize = ref('0 × 0')
    const selectedObj = ref('')
    const textInput = ref(false), textValue = ref('')
    const canvasWrap = ref(null), canvasEl = ref(null), fileInput = ref(null)
    let fabricCanvas = null, textTargetX = 0, textTargetY = 0
    const facilities = ref([])
    let facilityMarkers = []  // Fabric objects for facility markers

    // Layer colors for TAF semantic types
    const LAYER_COLORS = {
      'TAF-BUILDING': '#5b8def', 'BUILDING': '#5b8def',
      'TAF-CHANNEL': '#67c23a', 'CHANNEL': '#67c23a',
      'TAF-NODE': '#e6a23c', 'NODE': '#e6a23c',
      'TAF-ROAD': '#8b8fa3', 'ROAD': '#8b8fa3',
      'TAF-GREEN': '#3d9e6c', 'GREEN': '#3d9e6c',
      'TAF-FACADE': '#c97dff', 'FACADE': '#c97dff',
    }

    const loadProject = async () => {
      try {
        const p = await API.get('/projects/' + route.params.id)
        projectName.value = p.name
      } catch(e) { console.error(e) }
    }

    const initCanvas = () => {
      if (!canvasEl.value) return
      const wrap = canvasWrap.value
      fabricCanvas = new fabric.Canvas(canvasEl.value, {
        width: wrap.clientWidth,
        height: wrap.clientHeight,
        backgroundColor: '#111318',
        selection: true,
        preserveObjectStacking: true,
      })

      // Zoom
      fabricCanvas.on('mouse:wheel', (opt) => {
        const delta = opt.e.deltaY
        let zoom = fabricCanvas.getZoom()
        zoom *= 0.999 ** delta
        zoom = Math.max(0.1, Math.min(10, zoom))
        fabricCanvas.zoomToPoint({ x: opt.e.offsetX, y: opt.e.offsetY }, zoom)
        zoomPct.value = Math.round(zoom * 100)
        opt.e.preventDefault()
        opt.e.stopPropagation()
      })

      // Pan
      let isPanning = false
      fabricCanvas.on('mouse:down', (opt) => {
        if (tool.value === 'place' && opt.e) {
          const pt = fabricCanvas.getPointer(opt.e)
          placeFacilityAt(pt.x, pt.y)
          return
        }
        if (tool.value === 'pan' || (!opt.target && tool.value === 'pan')) {
          isPanning = true
          fabricCanvas.selection = false
          fabricCanvas.defaultCursor = 'grabbing'
        }
        if (tool.value === 'text' && !opt.target && opt.e) {
          const pt = fabricCanvas.getPointer(opt.e)
          textTargetX = pt.x; textTargetY = pt.y
          textInput.value = true; textValue.value = ''
        }
        if (tool.value === 'rect' && !opt.target) {
          // Start rect selection
        }
      })
      fabricCanvas.on('mouse:move', (opt) => {
        if (isPanning) {
          const e = opt.e
          fabricCanvas.relativePan({ x: e.movementX, y: e.movementY })
        }
      })
      fabricCanvas.on('mouse:up', () => {
        isPanning = false
        fabricCanvas.selection = true
        fabricCanvas.defaultCursor = 'default'
      })

      // Selection
      fabricCanvas.on('selection:created', (e) => {
        selectedObj.value = e.selected?.length ? `${e.selected.length} 对象` : ''
      })
      fabricCanvas.on('selection:cleared', () => { selectedObj.value = '' })

      // Resize
      const ro = new ResizeObserver(() => {
        if (fabricCanvas && wrap) {
          fabricCanvas.setWidth(wrap.clientWidth)
          fabricCanvas.setHeight(wrap.clientHeight)
          fabricCanvas.renderAll()
        }
      })
      ro.observe(wrap)
    }

    const triggerUpload = () => { fileInput.value?.click() }

    const onFileUpload = async (e) => {
      const file = e.target.files[0]
      if (!file) return
      // Upload to backend
      const formData = new FormData()
      formData.append('file', file)
      formData.append('name', file.name)
      try {
        const r = await fetch(API.base + '/projects/' + route.params.id + '/basemaps', {
          method: 'POST', body: formData
        })
        if (!r.ok) throw await r.json()
        toast.show('✅ DXF 上传成功，正在解析...')
        // Parse and render
        const text = await file.text()
        renderDXF(text)
      } catch(e) {
        console.error(e)
        toast.show('❌ 上传失败')
      }
    }

    const renderDXF = (dxfText) => {
      try {
        const parser = new DxfParser()
        const dxf = parser.parseSync(dxfText)

        // Clear previous
        fabricCanvas.clear()
        fabricCanvas.backgroundColor = '#111318'
        const newLayers = []

        // Group entities by layer
        const layerMap = {}
        for (const entity of dxf.entities) {
          const name = entity.layer || '0'
          if (!layerMap[name]) layerMap[name] = []
          layerMap[name].push(entity)
        }

        // Render each layer
        const allBounds = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity }
        for (const [name, entities] of Object.entries(layerMap)) {
          const color = LAYER_COLORS[name] || LAYER_COLORS[name.toUpperCase()] || '#5c6370'
          const group = []

          for (const e of entities) {
            let obj = null
            if (e.type === 'LINE') {
              obj = new fabric.Line([e.vertices[0].x, e.vertices[0].y, e.vertices[1].x, e.vertices[1].y], {
                stroke: color, strokeWidth: Math.max(1, (e.lineweight || 0) / 10), selectable: true
              })
            } else if (e.type === 'LWPOLYLINE' || e.type === 'POLYLINE') {
              const pts = e.vertices.flatMap(v => [v.x, v.y])
              if (pts.length >= 4) {
                obj = new fabric.Polyline(pts, {
                  stroke: color, strokeWidth: Math.max(1, (e.lineweight || 0) / 10), fill: '', selectable: true
                })
              }
            } else if (e.type === 'CIRCLE') {
              obj = new fabric.Circle({
                left: e.center.x - e.radius, top: e.center.y - e.radius,
                radius: e.radius, stroke: color, strokeWidth: 1, fill: '', selectable: true
              })
            } else if (e.type === 'ARC') {
              // Approximate arc as polyline
              const cx = e.center.x, cy = e.center.y, r = e.radius
              const sa = e.startAngle * Math.PI / 180, ea = e.endAngle * Math.PI / 180
              const pts = []
              const steps = 32
              for (let i = 0; i <= steps; i++) {
                const a = sa + (ea - sa) * i / steps
                pts.push(cx + Math.cos(a) * r, cy + Math.sin(a) * r)
              }
              obj = new fabric.Polyline(pts, {
                stroke: color, strokeWidth: 1, fill: '', selectable: true
              })
            } else if (e.type === 'TEXT' || e.type === 'MTEXT') {
              obj = new fabric.Text(e.text || '', {
                left: e.position?.x || 0, top: e.position?.y || 0,
                fontSize: e.height || 12, fill: color, fontFamily: 'monospace', selectable: true
              })
            }

            if (obj) {
              obj._tafLayer = name
              obj._tafType = e.type
              group.push(obj)
              // Track bounds
              if (obj.left !== undefined) allBounds.minX = Math.min(allBounds.minX, obj.left)
              if (obj.top !== undefined) allBounds.minY = Math.min(allBounds.minY, obj.top)
              if (obj.left !== undefined && obj.width !== undefined) allBounds.maxX = Math.max(allBounds.maxX, obj.left + (obj.width || 0))
              if (obj.top !== undefined && obj.height !== undefined) allBounds.maxY = Math.max(allBounds.maxY, obj.top + (obj.height || 0))
            }
          }

          // Add group to canvas
          for (const obj of group) fabricCanvas.add(obj)

          newLayers.push({
            name, color, count: group.length, visible: true, opacity: 100,
            objects: group
          })
        }

        layers.value = newLayers
        canvasSize.value = `${Math.round(allBounds.maxX - allBounds.minX)} × ${Math.round(allBounds.maxY - allBounds.minY)}`
        fabricCanvas.renderAll()

        // Auto-fit
        if (allBounds.minX !== Infinity) {
          fitScreen()
        }

        toast.show(`✅ 解析完成: ${dxf.entities.length} 实体, ${newLayers.length} 图层`)
      } catch(e) {
        console.error(e)
        toast.show('❌ DXF 解析失败: ' + e.message)
      }
    }

    const fitScreen = () => {
      if (!fabricCanvas) return
      const objs = fabricCanvas.getObjects()
      if (!objs.length) return
      const wrap = canvasWrap.value
      const w = wrap.clientWidth, h = wrap.clientHeight
      // Find bounds from all objects
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity
      objs.forEach(o => {
        const b = o.getBoundingRect()
        minX = Math.min(minX, b.left)
        minY = Math.min(minY, b.top)
        maxX = Math.max(maxX, b.left + b.width)
        maxY = Math.max(maxY, b.top + b.height)
      })
      const cw = maxX - minX, ch = maxY - minY
      if (cw <= 0 || ch <= 0) return
      const zoom = Math.min(w / cw, h / ch) * 0.9
      const cx = minX + cw / 2, cy = minY + ch / 2
      fabricCanvas.setViewportTransform([zoom, 0, 0, zoom, w / 2 - cx * zoom, h / 2 - cy * zoom])
      zoomPct.value = Math.round(zoom * 100)
      fabricCanvas.renderAll()
    }

    const updateLayerVisibility = (layer) => {
      layer.objects.forEach(o => { o.visible = layer.visible })
      fabricCanvas.renderAll()
    }

    const updateLayerOpacity = (layer) => {
      layer.objects.forEach(o => { o.opacity = layer.opacity / 100 })
      fabricCanvas.requestRenderAll()
    }

    const confirmText = () => {
      if (!textValue.value.trim()) { textInput.value = false; return }
      const text = new fabric.Text(textValue.value, {
        left: textTargetX, top: textTargetY,
        fontSize: 16, fill: '#ff6b6b', fontFamily: 'sans-serif',
        backgroundColor: 'rgba(0,0,0,0.6)', padding: 4
      })
      fabricCanvas.add(text)
      fabricCanvas.renderAll()
      textInput.value = false
    }
    const cancelText = () => { textInput.value = false }

    const exportView = () => {
      if (!fabricCanvas) return
      const dataUrl = fabricCanvas.toDataURL({ format: 'png', multiplier: 2 })
      const link = document.createElement('a')
      link.download = 'taf-basemap-' + Date.now() + '.png'
      link.href = dataUrl
      link.click()
      toast.show('📸 截图已导出')
    }

    // ── Facility placement ──
    const refreshFacilities = async () => {
      try {
        facilities.value = await API.get('/projects/' + route.params.id + '/facilities')
        renderFacilityMarkers()
      } catch(e) { console.error(e) }
    }

    const renderFacilityMarkers = () => {
      if (!fabricCanvas) return
      // Remove old markers
      facilityMarkers.forEach(m => fabricCanvas.remove(m))
      facilityMarkers = []

      facilities.value.forEach(f => {
        const pos = f.position || {}
        const x = pos.x || 0, y = pos.y || 0
        const icon = (f.custom_fields?.icon || '📌')
        const color = f.status === 'installed' ? '#67c23a' : f.status === 'confirmed' ? '#e6a23c' : '#4f8cff'

        const circle = new fabric.Circle({
          left: x - 6, top: y - 6, radius: 6,
          fill: color + '44', stroke: color, strokeWidth: 2,
          selectable: true, hasControls: false,
        })
        const text = new fabric.Text(icon, {
          left: x - 7, top: y - 12,
          fontSize: 12, fontFamily: 'sans-serif',
          selectable: false, evented: false,
        })
        circle._facilityId = f.id
        circle._facilityData = f

        fabricCanvas.add(circle)
        fabricCanvas.add(text)
        facilityMarkers.push(circle, text)
      })
      fabricCanvas.requestRenderAll()
    }

    const placeFacilityAt = async (x, y) => {
      // Create a pending facility at canvas position
      const id = prompt('标准项编号 (如 P1-01):')
      if (!id) return
      const name = prompt('设施名称:')
      if (!name) return
      const cat = id.split('-')[0] || 'P1'

      try {
        await API.post('/projects/' + route.params.id + '/facilities', {
          standard_item_id: id, name: name,
          type: 'credit', category: cat, status: 'draft',
          quantity: 1,
          position: { x: Math.round(x), y: Math.round(y), lng: null, lat: null },
          custom_fields: { icon: '📍' }
        })
        toast.show('✅ 设施已布点: ' + name)
        refreshFacilities()
      } catch(e) { toast.show('❌ 布点失败') }
    }

    const focusFacility = (f) => {
      if (!fabricCanvas || !f.position) return
      const pos = f.position
      const zoom = fabricCanvas.getZoom()
      const wrap = canvasWrap.value
      const cx = wrap.clientWidth / 2, cy = wrap.clientHeight / 2
      const tx = cx - (pos.x || 0) * zoom, ty = cy - (pos.y || 0) * zoom
      fabricCanvas.setViewportTransform([zoom, 0, 0, zoom, tx, ty])
      fabricCanvas.requestRenderAll()
      toast.show('📍 定位: ' + f.name)
    }

    onMounted(() => {
      loadProject()
      nextTick(() => {
        setTimeout(initCanvas, 100)
        // Load existing basemaps
        loadBasemaps()
      })
    })

    const loadBasemaps = async () => {
      try {
        const bms = await API.get('/projects/' + route.params.id + '/basemaps')
        if (bms?.length) {
          const dxfBm = bms.find(b => b.file_type === 'dxf')
          if (dxfBm?.file_url) {
            // file_url is like /root/data/disk/taf_uploads/{id}/{name}
            // nginx serves /taf/uploads/ → /root/data/disk/taf_uploads/
            const url = '/taf/uploads/' + dxfBm.file_url.split('/taf_uploads/')[1]
            const resp = await fetch(url)
            if (resp.ok) {
              const text = await resp.text()
              renderDXF(text)
              refreshFacilities()
            }
          }
        }
      } catch(e) { console.error(e) }
    }

    return { projectName, layers, tool, zoomPct, canvasSize, selectedObj, facilities,
      textInput, textValue, canvasWrap, canvasEl, fileInput,
      triggerUpload, onFileUpload, fitScreen, updateLayerVisibility, updateLayerOpacity,
      confirmText, cancelText, exportView, refreshFacilities, focusFacility }
  }
}

const FacilitiesPage = {
  template: `
  <div>

        <tbody><tr v-for="f in cat.items" :key="f.id" @click="editFacility(f)" style="cursor:pointer" @mouseenter="e=>e.currentTarget.style.background='#ffffff04'" @mouseleave="e=>e.currentTarget.style.background=''"><td style="padding:8px;font-family:monospace;font-size:11px;color:var(--accent)">{{ f.standard_item_id }}</td><td style="padding:8px">{{ (f.custom_fields?.icon||'📌')+' '+f.name }}</td><td style="padding:8px"><span style="font-size:11px;padding:2px 6px;border-radius:3px" :style="{background:f.type==='prerequisite'?'#f56c6c1a':'#67c23a1a',color:f.type==='prerequisite'?'#f56c6c':'#67c23a'}">{{ f.type==='prerequisite'?'必选':'可选' }}</span></td><td style="padding:8px"><span :style="{color:f.status==='installed'?'#67c23a':f.status==='confirmed'?'#e6a23c':'#8b8fa3'}">{{ f.status }}</span></td><td style="padding:8px">{{ f.quantity }}</td><td style="padding:8px;font-size:12px;color:var(--muted);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ f.notes || '-' }}</td><td style="padding:8px"><button class="btn sm" @click.stop="editFacility(f)">✎</button></td></tr></tbody>
      </table></div>

    <div class="dialog-mask" v-if="editDlg" @click.self="editDlg=false"><div class="dialog" style="width:480px"><h3>{{ editForm.id ? '编辑' : '新增' }}设施</h3><div class="form-group"><label>关联标准项</label><input type="text" v-model="editForm.standard_item_id"></div><div class="form-group"><label>名称</label><input type="text" v-model="editForm.name"></div><div class="form-group"><label>类型</label><select v-model="editForm.type"><option value="prerequisite">必选</option><option value="credit">可选</option></select></div><div class="form-group"><label>类别</label><select v-model="editForm.category"><option v-for="c in cats" :key="c.id" :value="c.id">{{ c.id }} {{ c.name }}</option></select></div><div class="form-group"><label>状态</label><select v-model="editForm.status"><option value="draft">草稿</option><option value="selected">已选</option><option value="confirmed">已确认</option><option value="installed">已安装</option></select></div><div class="form-group"><label>数量</label><input type="number" v-model.number="editForm.quantity" min="1"></div><div class="form-group"><label>备注</label><textarea v-model="editForm.notes" rows="2"></textarea></div><div class="form-actions"><button class="btn" @click="editDlg=false">取消</button><button class="btn danger" v-if="editForm.id" @click="deleteFacility">删除</button><button class="btn primary" @click="saveFacility">保存</button></div></div></div>
  </div>`,
  setup() {
    const route = VueRouter.useRoute()
    const projectName = ref(''), facilities = ref([]), evalResult = ref(null), evaluating = ref(false)
    const editDlg = ref(false)
    const editForm = reactive({ id:null, standard_item_id:'', name:'', type:'credit', category:'P1', status:'draft', quantity:1, notes:'' })
    const cats = ref([])
    const groupedFacilities = computed(() => { const g={}; for(const f of facilities.value){ const c=f.category; if(!g[c]) g[c]={id:c,name:cats.value.find(x=>x.id===c)?.name||c,items:[]}; g[c].items.push(f) } return Object.values(g).sort((a,b)=>a.id.localeCompare(b.id)) })
    const load = async () => { try { const p=await API.get('/projects/'+route.params.id); projectName.value=p.name; const std=await API.get('/projects/'+route.params.id+'/standard'); cats.value=std?.standard?.config?.categories||[]; facilities.value=await API.get('/projects/'+route.params.id+'/facilities') } catch(e){console.error(e)} }
    onMounted(load)
    const editFacility = (f) => { Object.assign(editForm,{id:f.id,standard_item_id:f.standard_item_id,name:f.name,type:f.type,category:f.category,status:f.status,quantity:f.quantity,notes:f.notes||''}); editDlg.value=true }
    const addFacility = () => { Object.assign(editForm,{id:null,standard_item_id:'',name:'',type:'credit',category:'P1',status:'draft',quantity:1,notes:''}); editDlg.value=true }
    const saveFacility = async () => { try { const pid=route.params.id; if(editForm.id){ await API.put('/facilities/'+editForm.id,{name:editForm.name,type:editForm.type,category:editForm.category,status:editForm.status,quantity:editForm.quantity,notes:editForm.notes}) } else { await API.post('/projects/'+pid+'/facilities',{standard_item_id:editForm.standard_item_id,name:editForm.name,type:editForm.type,category:editForm.category,status:editForm.status,quantity:editForm.quantity,notes:editForm.notes}) } toast.show('✅ 保存成功'); editDlg.value=false; load() } catch(e){ toast.show('❌ 保存失败') } }
    const deleteFacility = async () => { if(!confirm('确认删除？')) return; try { await fetch(API.base+'/facilities/'+editForm.id,{method:'DELETE'}); toast.show('✅ 已删除'); editDlg.value=false; load() } catch(e){ toast.show('❌ 删除失败') } }
    const evaluate = async () => { evaluating.value=true; try { evalResult.value=await API.post('/projects/'+route.params.id+'/evaluate',{}) } catch(e){ toast.show('❌ 评估失败') }; evaluating.value=false }
    const batchConfirm = async () => {

      try {
        for (const f of facilities.value) {
          if (f.status !== 'confirmed') await API.put('/facilities/'+f.id, {status:'confirmed'})
        }
        toast.show('✅ 全部确认完成')
        load()
        evaluate()
      } catch(e) { toast.show('❌ 确认失败') }
    }
    const exportReport = async () => {
      try {
        const r = await API.get('/projects/'+route.params.id+'/report')
        const blob = new Blob([r.report_html], {type:'text/html'})
        const url = URL.createObjectURL(blob)
        const a = document.createElement('a')
        a.href = url; a.download = 'TAF_Report_' + projectName.value + '_' + new Date().toISOString().slice(0,10) + '.html'
        a.click()
        URL.revokeObjectURL(url)
        toast.show('📄 报告已下载')
      } catch(e) { toast.show('❌ 导出失败') }
    }
    return { projectName, facilities, evalResult, evaluating, editDlg, editForm, cats, groupedFacilities, editFacility, addFacility, saveFacility, deleteFacility, evaluate, batchConfirm, exportReport }
  }
}

// ─── Deliverables Page ───
const DeliverablesPage = {
  template: `
  <div>
    <div style="margin-bottom:16px;display:flex;align-items:center;gap:12px">
      <button class="btn" @click="$router.back()">← 返回</button>
      <span style="font-size:18px;font-weight:600">{{ projectName }} · 策划成果</span>
    </div>

    <div v-if="loading" class="empty"><div class="icon">⏳</div>加载中...</div>

    <div v-if="!loading">
      <div class="card">
        <div class="card-title">📦 成果清单</div>
        <div class="card-sub">一键生成所有策划成果，自动打包上传坚果云</div>

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">
          <button class="btn primary" @click="generate('boq')" :disabled="generating">📋 设施清单</button>
          <button class="btn primary" @click="generate('priority-matrix')" :disabled="generating">📊 优先级矩阵</button>
          <button class="btn primary" @click="generate('layout')" :disabled="generating">🗺️ 布点图 DXF</button>
          <button class="btn primary" @click="generate('annotated-map')" :disabled="generating">🖼️ 标注渲染图</button>
          <button class="btn primary" @click="generate('heatmap')" :disabled="generating">🔥 热力图</button>
          <button class="btn primary" @click="generate('narrative')" :disabled="generating">✍️ 空间叙事</button>
          <button class="btn primary" @click="generate('prompts')" :disabled="generating">🎨 渲染提示词</button>
        </div>
        <button class="btn" style="background:var(--success);color:#fff;border-color:var(--success);width:100%;padding:10px" @click="packageAll" :disabled="generating">
          📦 一键打包全部 → 坚果云
        </button>
      </div>

      <div v-if="results.length" class="card" style="margin-top:16px">
        <div class="card-title">✅ 已生成 ({{ results.length }})</div>
        <div v-for="r in results" :key="r.id" style="display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);gap:12px">
          <span style="width:120px;font-size:13px">{{ r.name }}</span>
          <span style="font-size:11px;color:var(--muted)">{{ r.format }}</span>
          <span v-if="r.size" style="font-size:11px;color:var(--muted)">{{ (r.size/1024).toFixed(1) }} KB</span>
          <span v-if="r.status==='ok'" style="color:var(--success)">✅</span>
          <span v-if="r.status==='error'" style="color:var(--danger)">❌ {{ r.error }}</span>
          <button v-if="r.download_url" class="btn sm" @click="download(r)">⬇ 下载</button>
        </div>
      </div>

      <div v-if="packageResult" class="card" style="margin-top:16px">
        <div class="card-title">📦 打包结果</div>
        <div style="font-size:13px">ZIP: {{ (packageResult.zip_size/1024).toFixed(0) }} KB</div>
        <div v-if="packageResult.nutstore?.status===201" style="color:var(--success);font-size:13px">✅ 已上传坚果云</div>
        <div v-if="packageResult.nutstore?.path" style="font-size:11px;color:var(--muted)">{{ packageResult.nutstore.path }}</div>
      </div>
    </div>
  </div>`,
  setup() {
    const route = VueRouter.useRoute()
    const projectName = ref('')
    const loading = ref(true)
    const generating = ref(false)
    const results = ref([])
    const packageResult = ref(null)

    const API_BASE = '/taf/api/projects/' + route.params.id + '/deliverables'

    onMounted(async () => {
      try {
        const p = await (await fetch(API.base + '/projects/' + route.params.id)).json()
        projectName.value = p.name || p.code
      } catch(e) {}
      loading.value = false
    })

    const generate = async (type) => {
      generating.value = true
      const methods = { 'layout':'POST','annotated-map':'POST','benchmark':'POST' }
      const method = methods[type] || 'GET'
      const opts = method === 'POST' ? { method:'POST' } : {}
      try {
        const r = await fetch(API_BASE + '/' + type, opts)
        const ct = r.headers.get('content-type') || ''
        if (ct.includes('json')) {
          const json = await r.json()
          results.value.unshift({ id: Date.now(), name: json.code || type, format: 'json', status:'ok' })
        } else {
          const blob = await r.blob()
          results.value.unshift({
            id: Date.now(), name: type, format: type === 'layout' ? 'dxf' : type.includes('map')||type==='heatmap' ? 'png' : 'bin',
            size: blob.size, status:'ok',
            download_url: URL.createObjectURL(blob)
          })
        }
      } catch(e) {
        results.value.unshift({ id: Date.now(), name: type, status:'error', error: e.message })
      }
      generating.value = false
    }

    const packageAll = async () => {
      generating.value = true
      try {
        const r = await fetch(API_BASE + '/package', { method:'POST' })
        const json = await r.json()
        if (json.detail) throw new Error(json.detail)
        packageResult.value = json
        if (json.files) {
          json.files.forEach(f => {
            results.value.unshift({ id: Date.now(), name: f.name, format: f.format, size: f.size, status:'ok' })
          })
        }
      } catch(e) {
        packageResult.value = { error: e.message }
      }
      generating.value = false
    }

    const download = (r) => {
      const a = document.createElement('a')
      a.href = r.download_url
      a.download = r.name
      a.click()
    }

    return { projectName, loading, generating, results, packageResult, generate, packageAll, download }
  }
}

</script>

<style>
:root { --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a; --text: #e4e6eb; --muted: #8b8fa3; --accent: #4f8cff; --danger: #f56c6c; --success: #67c23a; --warning: #e6a23c; }
* { margin:0; padding:0; box-sizing:border-box; }body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }#app { display:flex; flex-direction:column; min-height:100vh; }

/* Nav */
.nav { background:var(--card); border-bottom:1px solid var(--border); padding:0 24px; display:flex; align-items:center; height:48px; gap:24px; flex-shrink:0; }.nav .logo { font-size:18px; font-weight:700; color:var(--accent); text-decoration:none; }.nav a { color:var(--muted); text-decoration:none; font-size:16px; padding:4px 12px; border-radius:4px; transition:all .2s; }.nav a:hover, .nav a.router-link-active, .nav a.router-link-exact-active { color:var(--accent) !important; background:#ffffff0f !important; }

/* Layout */
.main { flex:1; padding:24px; max-width:1400px; margin:0 auto; width:100%; }
/* 底图工作台: 占满浏览器宽 (默认全宽, 保留导航条) */
.main-fullwidth { max-width:none; padding:0; }.card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:20px; margin-bottom:16px; }.wizard-steps { display:flex; align-items:center; gap:0; }.wizard-step { display:flex; flex-direction:column; align-items:center; gap:2px; }.wizard-step .step-num { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; background:#ffffff08; color:var(--muted); border:2px solid var(--border); transition:all .3s; }.wizard-step .step-label { font-size:13px; color:var(--muted); white-space:nowrap; }.wizard-step.active .step-num { background:var(--accent); color:#fff; border-color:var(--accent); }.wizard-step.active .step-label { color:var(--accent); }.wizard-step.done .step-num { background:var(--success); color:#fff; border-color:var(--success); }.wizard-step.done .step-label { color:var(--success); }.wizard-line { flex:1; height:2px; background:var(--border); min-width:16px; transition:background .3s; }.wizard-line.done { background:var(--success); }.card-title { font-size:22px; font-weight:600; margin-bottom:16px; display:flex; align-items:center; gap:8px; }.card-sub { font-size:17px; color:var(--muted); margin-bottom:20px; }

/* Table */
.el-table { --el-table-bg-color:transparent; --el-table-tr-bg-color:transparent; --el-table-header-bg-color:transparent; --el-table-border-color:var(--border); --el-table-text-color:var(--text); --el-table-header-text-color:var(--muted); }.el-table th.el-table__cell { background:transparent; border-bottom:1px solid var(--border); font-size:16px; text-transform:uppercase; letter-spacing:.5px; }.el-table tr { transition:background .15s; cursor:pointer; }.el-table tr:hover > td { background:#ffffff06 !important; }

/* Element Plus dark mode overrides */
.el-loading-mask { background-color:rgba(10,10,30,0.85) !important; }.el-loading-spinner .el-loading-text { color:var(--muted) !important; }.el-loading-spinner .path { stroke:var(--accent) !important; }.el-table__empty-block { background:transparent !important; }.el-table__empty-text { color:var(--muted) !important; }


/* Category block */
.cat-block { border:1px solid var(--border); border-radius:8px; margin-bottom:12px; overflow:hidden; }.cat-header { display:flex; align-items:center; padding:14px 18px; background:#ffffff05; cursor:pointer; gap:12px; user-select:none; }.cat-header:hover { background:#ffffff0a; }.cat-header .drag-handle { color:var(--muted); cursor:grab; font-size:19px; }.cat-header .cat-name { font-weight:600; font-size:18px; flex:1; }.cat-header .cat-weight { font-size:16px; color:var(--muted); }.cat-header .cat-arrow { transition:transform .2s; color:var(--muted); }.cat-header .cat-arrow.open { transform:rotate(90deg); }.cat-body { border-top:1px solid var(--border); }.cat-body.hidden { display:none; }

/* Item row */
.item-row { display:flex; align-items:center; padding:10px 18px 10px 30px; gap:12px; border-bottom:1px solid var(--border); transition:background .15s; }.item-row:last-child { border-bottom:none; }.item-row:hover { background:#ffffff03; }.item-row .drag-handle { color:var(--muted); cursor:grab; font-size:17px; }.item-row .item-id { font-size:14px; color:var(--accent); font-family:monospace; min-width:48px; }.item-row .item-name { flex:1; font-size:18px; }.item-row .item-type { font-size:16px; padding:2px 8px; border-radius:3px; }.item-row .item-type.prerequisite { background:#f56c6c1a; color:#f56c6c; }.item-row .item-type.credit { background:#67c23a1a; color:#67c23a; }.item-row .item-score { font-size:17px; color:var(--muted); min-width:40px; text-align:right; }.item-row .item-actions { display:flex; gap:4px; }

/* Editable */
/* Dark mode selects */
select { background:#1a1a2e; color:var(--text); border:1px solid var(--border); border-radius:4px; padding:6px 10px; font-size:17px; }select option { background:#1a1a2e; color:var(--text); }.el-select-dropdown { background:#1a1a2e !important; border:1px solid var(--border) !important; }.el-select-dropdown__item { color:var(--text) !important; }.el-select-dropdown__item.hover, .el-select-dropdown__item:hover { background:#ffffff0a !important; }.el-select-dropdown__item.selected { color:var(--accent) !important; }.el-popper.is-light { background:#1a1a2e !important; border:1px solid var(--border) !important; }.dialog select, .dialog-mask select { background:#0f0f23; color:var(--text); border:1px solid var(--border); border-radius:4px; padding:8px 10px; font-size:17px; }input[type=text], textarea { background:#ffffff0a; border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:4px; font-size:16px; width:100%; outline:none; }input[type=text]:focus, textarea:focus { border-color:var(--accent); }select { background:#ffffff0a; border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:4px; font-size:16px; outline:none; }.weight-slider { display:flex; align-items:center; gap:12px; padding:4px 0; }.weight-slider input[type=range] { flex:1; accent-color:var(--accent); }.weight-slider .weight-val { font-size:17px; font-weight:600; min-width:48px; text-align:right; color:var(--accent); }

/* Buttons */
.btn { padding:6px 14px; border-radius:4px; font-size:16px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer; display:inline-flex; align-items:center; gap:4px; transition:all .15s; }.btn:hover { background:#ffffff0a; }.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }.btn.primary:hover { opacity:.9; }.btn.danger { color:var(--danger); border-color:var(--danger); }.btn.sm { padding:3px 8px; font-size:15px; }

/* Dialog overlay */
.dialog-mask { position:fixed; inset:0; background:#00000080; z-index:1000; display:flex; align-items:center; justify-content:center; }.dialog { background:var(--card); border:1px solid var(--border); border-radius:12px; width:520px; max-height:80vh; overflow-y:auto; padding:24px; }.dialog h3 { margin-bottom:16px; font-size:19px; }.dialog .form-group { margin-bottom:14px; }.dialog .form-group label { display:block; font-size:15px; color:var(--muted); margin-bottom:4px; text-transform:none; letter-spacing:0; }.dialog .form-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; }
/* Field display */
label { display:block; font-size:14px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px; }.field-val { padding:6px 0; font-size:18px; }.card label { display:block; font-size:14px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px; }.card .field-val { padding:6px 0; font-size:18px; }

/* Sortable ghost */
.sortable-ghost { opacity:.3; background:var(--accent) !important; }.sortable-chosen { background:#ffffff0a !important; }

/* Toast */
.toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--success); color:#fff; padding:10px 24px; border-radius:6px; font-size:17px; z-index:2000; animation:toastIn .3s; }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)} }

/* Empty state */
.empty { text-align:center; padding:60px 20px; color:var(--muted); }.empty .icon { font-size:51px; margin-bottom:16px; }.scoring-row { display:flex; gap:8px; align-items:center; margin-bottom:6px; }.scoring-row input { flex:1; }.scoring-row input[type=number] { width:60px; flex:0 0 60px; }

/* ── 底图工作台: 高度锁定, 页面无滚动, 仅内部面板滚动 (防双滚动条) ── */
.main-fullwidth { overflow:hidden; height:calc(100vh - 48px); }
.workbench-root { height:100%; display:flex; flex-direction:column; overflow:hidden; }

/* Dark scrollbar (全局) */
* { scrollbar-width:thin; scrollbar-color:#3a3f52 #14161f; }
*::-webkit-scrollbar { width:8px; height:8px; }
*::-webkit-scrollbar-track { background:#14161f; }
*::-webkit-scrollbar-thumb { background:#3a3f52; border-radius:4px; }
*::-webkit-scrollbar-thumb:hover { background:#4a5068; }

/* 分类点位行 (右栏竖排分类) */
.fac-cat-row { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:5px; }
</style>

// ─── API helper ───
const API = {
  base: (window.__TAF_API_BASE__ || '/taf/api'),
  async get(path) { const r = await fetch(this.base + path); if(!r.ok) throw await r.json(); return r.json(); },
  async post(path, data) { const r = await fetch(this.base + path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) }); if(!r.ok) throw await r.json(); return r.json(); },
  async put(path, data) { const r = await fetch(this.base + path, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) }); if(!r.ok) throw await r.json(); return r.json(); },
}

// ─── Toast ───
const toast = { ref: ref(null), msg: ref(''), show(m) { this.msg.value = m; clearTimeout(this._t); this._t = setTimeout(() => this.msg.value = '', 4500); } }

// ─── Standards List ───
const StandardsList = {
  template: `
  <div>
    <div class="card">
      <div class="card-title">📋 评估标准清单</div>
      <div class="card-sub">可插拔的评估标准插件，支持版本化管理</div>
      <el-table :data="standards" style="width:100%" v-loading="loading" empty-text="暂无标准" @row-click="openDetail">
        <el-table-column prop="code" label="编码" width="180" />
        <el-table-column prop="name" label="名称" min-width="200" />
        <el-table-column prop="version" label="版本" width="100" />
        <el-table-column label="状态" width="110">
          <template #default="{row}">
            <span :style="{color:row.status==='active'?'#67c23a':'#e6a23c'}">{{ row.status === 'active' ? '● 活跃' : '○ 预览' }}</span>
          </template>
        </el-table-column>
        <el-table-column label="指标" width="80">
          <template #default="{row}">
            {{ row.config?.total_items || row.config?.items?.length || '-' }}
          </template>
        </el-table-column>
        <el-table-column prop="release_date" label="发布日期" width="110" :formatter="formatDate" />
      </el-table>
    </div>
  </div>`,
  setup() {
    const standards = ref([])
    const loading = ref(true)
    onMounted(async () => {
      try {
        const list = await API.get('/standards')
        // Fetch full data for each
        const full = await Promise.all(list.map(s => API.get('/standards/' + s.code)))
        standards.value = full
      } catch(e) { console.error(e) }
      loading.value = false
    })
    const router = VueRouter.useRouter()
    const openDetail = (row) => { router.push('/standards/' + row.code) }
    const formatDate = (row, col, val) => { if(!val) return '-'; const d=val.split('T')[0].split('-'); return d[0]+'.'+parseInt(d[1])+'.'+parseInt(d[2]); };
    return { standards, loading, openDetail, formatDate }
  }
}

            总计 {{ config?.total_items || 0 }} 项 · 必选 {{ config?.prerequisite_count || 0 }} 项

        </div>
      </div>

      <!-- Tip -->
      <div style="padding:0 0 16px;font-size:15px;color:var(--muted)">
        ↕ 拖拽排序 · 点击板块展开编辑 · 
        权重总和: <span :style="{color:weightTotal===100?'#67c23a':'#f56c6c'}">{{ weightTotal }}%</span>
        <button class="btn sm primary" @click="save" style="margin-left:16px">💾 保存</button>
      </div>

      <!-- Categories -->
      <div ref="catList">
        <div v-for="(cat, ci) in categories" :key="cat.id" class="cat-block" :data-cat-id="cat.id">
          <div class="cat-header" @click="toggleCat(ci)">
            <span class="drag-handle">⠿</span>
            <span class="cat-name">{{ cat.id }} {{ cat.name }}</span>
            <div class="weight-slider" style="width:200px" @click.stop>
              <input type="range" min="0" max="100" step="1" v-model.number="cat.weight_pct" @input="onWeightChange(ci)">
              <span class="weight-val">{{ cat.weight_pct }}%</span>
            </div>
            <span class="cat-arrow" :class="{open: cat.open}">▶</span>
            <button class="btn sm" style="color:#f56c6c;margin-left:4px" @click.stop="deleteCategory(ci)" title="删除板块">✕</button>
          </div>
          <div class="cat-body" :class="{hidden: !cat.open}">
            <div :ref="el => { if(el) itemLists[cat.id] = el }">
              <div v-for="(item, ii) in cat.items" :key="item.id" class="item-row" :data-item-id="item.id">
                <span class="drag-handle">⠿</span>
                <span class="item-id">{{ item.id }}</span>
                <span class="item-name">{{ item.name }}</span>
                <span class="item-type" :class="item.type">{{ item.type === 'prerequisite' ? '必选' : '可选' }}</span>
                <span class="item-score">满分 {{ item.score_max }}</span>
                <span class="item-actions">
                  <button class="btn sm" @click="editItem(ci, ii)">✎</button>
                </span>
              </div>
            </div>
            <div v-if="!cat.items.length" style="padding:16px;text-align:center;color:var(--muted);font-size:16px">暂无评估项</div>
            <button class="btn sm" style="margin:8px 18px" @click="addItem(cat.id)">+ 添加评估项</button>
          </div>
        </div>
      </div>

      <!-- Add category button -->
      <button class="btn" style="margin-top:12px" @click="addCategory">+ 新增板块</button>
    </div>

    <!-- Edit Item Dialog -->
    <div class="dialog-mask" v-if="editing" @click.self="closeEdit">
      <div class="dialog">
        <h3>编辑评估项</h3>
        <div class="form-group"><label>编号</label><input type="text" v-model="editForm.id"></div>
        <div class="form-group"><label>名称</label><input type="text" v-model="editForm.name"></div>
        <div class="form-group">
          <label>类型</label>
          <select v-model="editForm.type">
            <option value="prerequisite">必选 (prerequisite)</option>
            <option value="credit">可选 (credit)</option>
          </select>
        </div>
        <div class="form-group"><label>满分</label><input type="number" v-model.number="editForm.score_max" min="1" max="10"></div>
        <div class="form-group"><label>评分标准（分数 | 描述）</label>
          <div v-for="(c, i) in editForm.scoring_criteria" :key="i" class="scoring-row">
            <input type="number" v-model.number="c.score" min="0" :max="editForm.score_max" style="width:60px;flex:0 0 60px">
            <input type="text" v-model="c.label" :placeholder="'描述 (如：全屋防滑地胶)'">
            <button class="btn sm danger" @click="editForm.scoring_criteria.splice(i,1)">×</button>
          </div>
          <button class="btn sm" style="margin-top:4px" @click="editForm.scoring_criteria.push({score:0,label:''})">+ 添加评分等级</button>
        </div>
        <div class="form-actions">
          <button class="btn" @click="closeEdit">取消</button>
          <button class="btn primary" @click="saveEdit">确认</button>
        </div>
      </div>
    </div>
  </div>`,
  setup() {
    const route = VueRouter.useRoute()
    const router = VueRouter.useRouter()
    const standard = ref(null)
    const config = ref(null)
    const categories = ref([])
    const loading = ref(true)
    const editing = ref(false)
    const editForm = reactive({ id:'', name:'', type:'credit', score_max:5, scoring_criteria:[{score:5,label:''}] })
    let editCi = -1, editIi = -1
    const catList = ref(null)
    const itemLists = reactive({})

    onMounted(async () => {
      try {
        const s = await API.get('/standards/' + route.params.code)
        standard.value = s
        config.value = s.config
        // Parse categories with open state and weight as percentage
        categories.value = (s.config.categories || []).map(c => ({
          ...c,
          open: false,
          weight_pct: Math.round(c.weight * 100),
          items: (s.config.items || []).filter(i => i.category === c.id)
        }))
        await nextTick()
        initSortable()
      } catch(e) { console.error(e) }
      loading.value = false
    })

    const toggleCat = (i) => { categories.value[i].open = !categories.value[i].open }

    const onWeightChange = (ci) => {
      // Auto-normalize: keep others proportional
    }

    const weightTotal = computed(() => {
      return categories.value.reduce((sum, c) => sum + (c.weight_pct || 0), 0)
    })

    const addItem = (catId) => {
      const cat = categories.value.find(c => c.id === catId)
      if (!cat) return
      const idx = cat.items.length + 1
      const newId = catId + '-' + String(idx).padStart(2, '0')
      cat.items.push({
        id: newId, name: '新评估项', type: 'credit', score_max: 5,
        scoring_criteria: [{score: 5, label: ''}], category: catId,
        affected_subjects: [], evaluation_method: ''
      })
      nextTick(() => initSortable())
    }

    const editItem = (ci, ii) => {
      editCi = ci; editIi = ii
      const item = categories.value[ci].items[ii]
      editForm.id = item.id
      editForm.name = item.name
      editForm.type = item.type
      editForm.score_max = item.score_max
      editForm.scoring_criteria = JSON.parse(JSON.stringify(item.scoring_criteria || [{score:5,label:''}]))
      editing.value = true
    }

    const closeEdit = () => { editing.value = false }

    const saveEdit = () => {
      if (editCi < 0) return
      const item = categories.value[editCi].items[editIi]
      item.name = editForm.name
      item.type = editForm.type
      item.score_max = editForm.score_max
      item.scoring_criteria = editForm.scoring_criteria.filter(c => c.label || c.score)
      // Ensure category matches
      item.category = categories.value[editCi].id
      editing.value = false
    }

    const addCategory = () => {
      const id = 'P' + (categories.value.length + 1)
      categories.value.push({
        id, name: '新板块', weight: 0, weight_pct: 0,
        description: '', open: true, items: []
      })
      nextTick(() => initSortable())
    }

    const deleteCategory = (ci) => {
      if (!confirm(`确定删除板块「${categories.value[ci].name}」及其所有评估项？`)) return
      categories.value.splice(ci, 1)
      nextTick(() => initSortable())
    }

    const save = async () => {
      // Rebuild config
      const cats = categories.value.map(c => ({
        id: c.id, name: c.name, weight: c.weight_pct / 100,
        description: c.description
      }))
      const items = categories.value.flatMap(c => c.items.map(i => ({
        ...i, category: c.id
      })))
      const cfg = {
        ...config.value,
        categories: cats,
        items: items,
        total_items: items.length,
        prerequisite_count: items.filter(i => i.type === 'prerequisite').length,
      }
      // Fix weight_presets: preserve existing keys, update with current
      const wp = {}
      cats.forEach(c => { wp[c.id] = c.weight_pct / 100 })
      const existingWp = config.value?.weight_presets || {}
      cfg.weight_presets = { ...existingWp }
      // Update all existing presets with current weights
      for (const key of Object.keys(cfg.weight_presets)) {
        cfg.weight_presets[key] = { ...cfg.weight_presets[key] }
        cats.forEach(c => { cfg.weight_presets[key][c.id] = c.weight_pct / 100 })
      }

      try {
        const body = {
          name: standard.value.name,
          version: standard.value.version,
          status: standard.value.status,
          release_date: standard.value.release_date,
          code: standard.value.code,
          config: cfg
        }
        const result = await API.put('/standards/' + standard.value.code, body)
        toast.show('✅ 已保存为新版本: ' + result.code)
        // Redirect to new version after short delay
        setTimeout(() => router.push('/standards/' + result.code), 800)
      } catch(e) {
        console.error(e)
        toast.show('❌ 保存失败: ' + (e.detail || e.message || ''))
      }
    }

    function initSortable() {
      // Sortable for categories
      if (catList.value) {
        Sortable.create(catList.value, {
          handle: '.drag-handle',
          animation: 200,
          onEnd(evt) {
            const moved = categories.value.splice(evt.oldIndex, 1)[0]
            categories.value.splice(evt.newIndex, 0, moved)
          }
        })
      }
      // Sortable for items in each category
      for (const catId in itemLists) {
        if (itemLists[catId]) {
          Sortable.create(itemLists[catId], {
            handle: '.drag-handle',
            animation: 200,
            group: 'items',
            onEnd(evt) {
              const fromCat = categories.value.find(c => c.id === evt.from.closest('.cat-block')?.dataset.catId)
              const toCat = categories.value.find(c => c.id === evt.to.closest('.cat-block')?.dataset.catId)
              if (fromCat && toCat) {
                const moved = fromCat.items.splice(evt.oldIndex, 1)[0]
                moved.category = toCat.id
                toCat.items.splice(evt.newIndex, 0, moved)
              }
            }
          })
        }
      }
    }

    return { standard, config, categories, loading, editing, editForm, catList, itemLists, weightTotal,
      toggleCat, onWeightChange, editItem, closeEdit, saveEdit, addCategory, addItem, deleteCategory, save }
  }
}

  setup() {
    const projects = ref([]), loading = ref(true), search = ref(''), filterPL = ref(''), filterStatus = ref('')

    const productLines = PRODUCT_LINES
    const router = VueRouter.useRouter()
    const load = async () => {
      loading.value = true
      const params = new URLSearchParams()
      if(search.value) params.append('search', search.value)
      if(filterPL.value) params.append('product_line', filterPL.value)
      if(filterStatus.value) params.append('status', filterStatus.value)
      try { const r = await API.get('/projects?' + params.toString()); projects.value = r.items || [] } catch(e) { console.error(e) }
      loading.value = false
    }
    onMounted(load)
    const openDetail = (row) => { router.push('/projects/' + row.id) }

        load()

    }
    return { projects, loading, search, filterPL, filterStatus, productLines, load, openDetail, showCreate, createForm, doCreate, statusLabel }
  }
}

        <div style="margin-bottom:12px">
          <label style="font-size:15px;color:var(--muted)">选择目标标准</label>
          <select v-model="switchTarget" style="width:100%;margin-top:4px">
            <option value="">-- 选择 --</option>
            <option v-for="s in standards" :key="s.code" :value="s.code">{{ s.name }} ({{ s.code }})</option>
          </select>
        </div>
        <button class="btn sm" @click="previewSwitch" :disabled="!switchTarget">🔍 预览影响</button>
        <div v-if="preview" style="margin-top:16px;padding:12px;background:#ffffff05;border-radius:6px">
          <div style="font-size:16px;display:flex;gap:12px;flex-wrap:wrap">
            <span>当前: <b>{{ preview.current_code }}</b></span>
            <span>→ 目标: <b>{{ preview.new_code }}</b></span>
          </div>
          <div style="margin-top:8px;font-size:15px;color:var(--muted)">
            <div v-if="preview.new_prerequisites?.length">新增必选项: {{ preview.new_prerequisites.join(', ') }}</div>
            <div v-if="preview.removed_items?.length">移除项: {{ preview.removed_items.join(', ') }}</div>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn" @click="switchDialog=false">取消</button>
          <button class="btn primary" @click="confirmSwitch" :disabled="!switchTarget">确认切换</button>
        </div>
      </div>
    </div>
  </div>`,
  setup() {
    const route = VueRouter.useRoute()
    const project = ref(null), editing = ref(false), switchDialog = ref(false), switchTarget = ref('')
    const wizardStep = ref(1)
    const boundStandard = ref(null), standards = ref([]), preview = ref(null)
    const productLines = PRODUCT_LINES
    const form = reactive({})

    const load = async () => {
      try {
        project.value = await API.get('/projects/' + route.params.id)
        Object.assign(form, project.value)
        // Load bound standard
        if (project.value.standard_id) {
          const r = await API.get('/projects/' + route.params.id + '/standard')
          if (r.standard) { boundStandard.value = r.standard; wizardStep.value = 2 }
        }
        // Load all standards for switch dialog
        try { standards.value = await API.get('/standards') } catch(e) {}
      } catch(e) { console.error(e) }
    }
    onMounted(load)

    const startEdit = () => { editing.value = true }
    const cancelEdit = () => { Object.assign(form, project.value); editing.value = false }
    const save = async () => {
      try {
        await API.put('/projects/' + route.params.id, {
          name: form.name, description: form.description, product_line: form.product_line,
          phase: form.phase, status: form.status, client_name: form.client_name,
          client_company: form.client_company, location: form.location
        })
        toast.show('✅ 保存成功')
        editing.value = false
        load()
      } catch(e) { toast.show('❌ 保存失败') }
    }

    const openSwitchDialog = () => { switchDialog.value = true; switchTarget.value = ''; preview.value = null }
    const previewSwitch = async () => {
      try {
        preview.value = await API.get('/projects/' + route.params.id + '/standard/preview/' + switchTarget.value)
      } catch(e) { toast.show('❌ 预览失败') }
    }
    const confirmSwitch = async () => {
      if (switchTarget.value === boundStandard.value?.code) { switchDialog.value = false; toast.show('已是当前标准'); return }
      try {
        await API.post('/projects/' + route.params.id + '/standard/switch', { new_standard_code: switchTarget.value })
        toast.show('✅ 标准切换成功')
        switchDialog.value = false
        load()
      } catch(e) { toast.show('❌ 切换失败') }
    }

    return { project, editing, form, startEdit, cancelEdit, save, boundStandard, standards, wizardStep, statusLabel,
      switchDialog, switchTarget, preview, openSwitchDialog, previewSwitch, confirmSwitch, productLines }
  }
}

    // ── SVG path → fabric 对象 (Maki 符号) ──
    const makeSymbol = (pathStr, vb, x, y, size, color) => {

      const parts = (vb || '0 0 15 15').split(' ').map(Number)
      const w = (parts[2] || 15), h = (parts[3] || 15)
      const scale = size / Math.max(w, h)
      const obj = new fabric.Path(pathStr, {

      t = t.replace(/\\[a-zA-Z][^;]*;/g, '')          // \fSTXihei|...; \W0.9; 等前缀
      t = t.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '')

    }
    // ── 世界坐标 ↔ 屏幕坐标映射 (DXF Y 向上 → canvas Y 向下) ──

    let coordMap = { scale: 1, offX: 0, offY: 0, bbox: null }   // sx = wx*scale+offX, sy = -wy*scale+offY
    const worldToScreen = (wx, wy) => ({ x: wx * coordMap.scale + coordMap.offX, y: -wy * coordMap.scale + coordMap.offY })
    const screenToWorld = (sx, sy) => ({ x: (sx - coordMap.offX) / coordMap.scale, y: -(sy - coordMap.offY) / coordMap.scale })

    let offCanvas = null, offCtx = null
    let dxfWorldBounds = null   // 世界坐标 bbox

    function computeWorldBounds(layerMap) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity
      for (const ents of Object.values(layerMap)) {
        for (const e of ents) {
          if (e.type === 'LINE' && e.vertices?.length >= 2) {
            for (const v of [e.vertices[0], e.vertices[1]]) { minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x); minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y) }
          } else if ((e.type === 'LWPOLYLINE' || e.type === 'POLYLINE') && e.vertices?.length) {
            for (const v of e.vertices) { minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x); minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y) }
          } else if (e.type === 'CIRCLE' && e.center) {
            minX = Math.min(minX, e.center.x - e.radius); maxX = Math.max(maxX, e.center.x + e.radius)
            minY = Math.min(minY, e.center.y - e.radius); maxY = Math.max(maxY, e.center.y + e.radius)
          } else if (e.type === 'ARC' && e.center) {
            minX = Math.min(minX, e.center.x - e.radius); maxX = Math.max(maxX, e.center.x + e.radius)
            minY = Math.min(minY, e.center.y - e.radius); maxY = Math.max(maxY, e.center.y + e.radius)
          } else if ((e.type === 'TEXT' || e.type === 'MTEXT') && e.position) {
            minX = Math.min(minX, e.position.x); maxX = Math.max(maxX, e.position.x)
            minY = Math.min(minY, e.position.y); maxY = Math.max(maxY, e.position.y)
          }
        }
      }
      if (minX === Infinity) return null
      const pad = Math.max((maxX - minX), (maxY - minY), 1) * 0.02
      return { minX: minX - pad, minY: minY - pad, maxX: maxX + pad, maxY: maxY + pad }
    }

    // 画单个实体到屏幕 ctx (坐标已映射到屏幕系)
    function strokeEntity(ctx, e, color, lwScale) {
      ctx.strokeStyle = color
      ctx.fillStyle = color
      if (e.type === 'LINE' && e.vertices?.length >= 2) {
        const a = worldToScreen(e.vertices[0].x, e.vertices[0].y)
        const b = worldToScreen(e.vertices[1].x, e.vertices[1].y)
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke()
      } else if ((e.type === 'LWPOLYLINE' || e.type === 'POLYLINE') && e.vertices?.length >= 2) {
        ctx.beginPath()
        e.vertices.forEach((v, i) => {
          const p = worldToScreen(v.x, v.y)
          i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)
        })
        if (e.shape || e.closed) ctx.closePath()   // 🔴 闭合多边形 → closePath
        ctx.stroke()
      } else if (e.type === 'CIRCLE' && e.center) {
        const c = worldToScreen(e.center.x, e.center.y)
        ctx.beginPath(); ctx.arc(c.x, c.y, e.radius * coordMap.scale, 0, Math.PI * 2); ctx.stroke()
      } else if (e.type === 'ARC' && e.center) {
        // ARC: dxf-parser 输出弧度 (Y-up 系)。屏幕系 Y 向下 → 角度取反
        const c = worldToScreen(e.center.x, e.center.y)
        const r = e.radius * coordMap.scale
        let sa = e.startAngle, ea = e.endAngle
        if (ea < sa) { const t = sa; sa = ea; ea = t }
        // Y 翻转: 屏幕角 = -世界角; arc 在 canvas 逆时针为负方向, 用 anticlockwise 处理
        ctx.beginPath()
        ctx.arc(c.x, c.y, r, -ea, -sa, false)   // 从 -ea 到 -sa (翻转后顺序)
        ctx.stroke()
      } else if ((e.type === 'TEXT' || e.type === 'MTEXT') && e.position) {
        const txt = cleanMtext(e.text || '')
        if (!txt) return
        const p = worldToScreen(e.position.x, e.position.y)
        ctx.font = `${Math.max(6, (e.height || 12) * coordMap.scale)}px sans-serif`
        ctx.textBaseline = 'middle'
        ctx.fillText(txt, p.x, p.y)
      }
    }

    // 重绘合成图 (图层显隐/透明度/加载完成时调用)
    function redrawComposite() {
      if (!offCanvas || !fabricCanvas) return
      const ctx = offCtx
      ctx.clearRect(0, 0, offCanvas.width, offCanvas.height)
      ctx.fillStyle = '#111318'
      ctx.fillRect(0, 0, offCanvas.width, offCanvas.height)
      // 按图层栈顺序绘制 (后画的在上)
      for (const l of layers.value) {
        if (!l.visible) continue
        ctx.globalAlpha = (l.opacity || 100) / 100
        ctx.strokeStyle = l.color
        ctx.fillStyle = l.color
        l.objects.forEach(e => strokeEntity(ctx, e, l.color, 1))
      }
      ctx.globalAlpha = 1
      const dataUrl = offCanvas.toDataURL('image/png')
      // 替换背景 image 对象 (若存在)
      const bg = fabricCanvas.getObjects().find(o => o._isBg)
      if (bg) { bg.setSrc(dataUrl, () => { fabricCanvas.requestRenderAll() }) }
      else {
        fabric.Image.fromURL(dataUrl, (img) => {
          img._isBg = true
          img.selectable = false
          img.evented = false
          img.lockMovementX = true
          img.lockMovementY = true
          fabricCanvas.add(img)
          fabricCanvas.sendToBack(img)
          fabricCanvas.requestRenderAll()
        })
      }
    }


    const renderDXF = (dxfText) => {
      try {
        loading.value = true
        loadProgress.value = 5
        loadStage.value = '解析 DXF...'
        // 让进度条先渲染
        setTimeout(() => {
          try { doParseDXF(dxfText) } catch(e) { console.error(e); loading.value = false; toast.show('❌ DXF 解析失败: ' + e.message) }
        }, 30)
      } catch(e) {
        console.error(e)
        loading.value = false
        toast.show('❌ DXF 解析失败: ' + e.message)
      }
    }

    // 把 19 个设施标准项图层合并进图层数组 (未布点也列出; markers 由 renderFacilityMarkers 管理)
    const mergeFacilityLayersInto = (layerArr) => {
      const existing = new Set(layerArr.map(l => l.name))
      for (const [itemId, sym] of Object.entries(makiSymbols)) {
        if (existing.has(sym.layer)) continue
        const cat = itemId.split('-')[0]
        const placedN = facilities.value.filter(f => f.standard_item_id === itemId && f.position?.x != null).length
        layerArr.push({
          name: sym.layer,
          color: CAT_COLORS[cat] || '#4f8cff',
          count: placedN,
          visible: true, opacity: 100,
          objects: [],
          locked: false,
          isFacilityLayer: true,
          itemId,
          iconPath: sym.path, viewbox: sym.viewbox,
          nameZh: sym.name_zh,
        })
      }
    }

    const doParseDXF = (dxfText) => {
      const parser = new DxfParser()
      const dxf = parser.parseSync(dxfText)
      loadProgress.value = 25
      loadStage.value = `整理 ${dxf.entities.length} 实体...`

      // 按图层分组 (保留全部实体供合成绘制)
      const layerMap = {}
      for (const entity of dxf.entities) {
        const name = entity.layer || '0'
        if (!layerMap[name]) layerMap[name] = []
        layerMap[name].push(entity)
      }
      loadProgress.value = 40
      loadStage.value = '计算图纸范围...'

      // 世界坐标 bbox (Y-up, 原始)
      const wb = computeWorldBounds(layerMap)
      if (!wb) { loading.value = false; toast.show('⚠️ DXF 无有效几何实体'); return }
      dxfWorldBounds = wb
      // 建立坐标映射: 世界 bbox → 离屏 canvas (最长边 ~4096px 保持精度)
      const MAX_DIM = 4096
      const ww = wb.maxX - wb.minX, wh = wb.maxY - wb.minY
      const scale = Math.min(MAX_DIM / Math.max(ww, wh), 8)   // 上限 8 (防止小图过度放大)
      const cw = Math.ceil(ww * scale), ch = Math.ceil(wh * scale)
      coordMap = {
        scale,
        offX: -wb.minX * scale,
        offY: wb.maxY * scale,   // 使 wy=maxY → sy=0 (顶); wy=minY → sy=ch (底)
        bbox: wb,
      }
      loadProgress.value = 50
      loadStage.value = '创建合成画布...'
      // 画布状态栏: 世界尺寸 (米/单位)
      canvasSize.value = `${Math.round(ww)} × ${Math.round(wh)} (世界单位)`

      offCanvas = document.createElement('canvas')
      offCanvas.width = Math.max(1, cw)
      offCanvas.height = Math.max(1, ch)
      offCtx = offCanvas.getContext('2d')

      // 图层列表 (含颜色/实体引用; objects 存实体数组供合成)
      const newLayers = []
      const LAYER_TO_SPACE = {
        'TAF-BUILDING': 'building', 'BUILDING': 'building',
        'TAF-CHANNEL': 'channel', 'CHANNEL': 'channel',
        'TAF-NODE': 'node', 'NODE': 'node',
        'TAF-ROAD': 'road', 'ROAD': 'road',
        'TAF-GREEN': 'green', 'GREEN': 'green',
        'TAF-FACADE': 'facade', 'FACADE': 'facade',
        'TAF-BOUNDARY': 'boundary', 'BOUNDARY': 'boundary',
      }
      const layerColorOf = (nm) => LAYER_COLORS[nm] || LAYER_COLORS[nm.toUpperCase()] || '#5c6370'
      geoAnchors = { building: [], channel: [], node: [], green: [], facade: [], road: [], boundary: [] }

      for (const [name, ents] of Object.entries(layerMap)) {
        const color = layerColorOf(name)
        const locked = LOCKED_LAYERS.has(name) || LOCKED_LAYERS.has(name.toUpperCase())
        // 收集锚点 (世界坐标)
        const pts = []
        for (const e of ents) {
          if (e.type === 'LINE' && e.vertices?.length >= 2) pts.push(e.vertices[0], e.vertices[1])
          else if ((e.type === 'LWPOLYLINE' || e.type === 'POLYLINE') && e.vertices?.length) pts.push(...e.vertices)
          else if (e.type === 'CIRCLE' && e.center) pts.push({ x: e.center.x - e.radius, y: e.center.y - e.radius }, { x: e.center.x + e.radius, y: e.center.y + e.radius })
        }
        const spaceType = LAYER_TO_SPACE[name] || LAYER_TO_SPACE[name.toUpperCase()]
        if (spaceType && pts.length >= 2) {
          const xs = pts.map(p => p.x), ys = pts.map(p => p.y)
          geoAnchors[spaceType].push({
            minX: Math.min(...xs), minY: Math.min(...ys),
            maxX: Math.max(...xs), maxY: Math.max(...ys),
            cx: (Math.min(...xs) + Math.max(...xs)) / 2,
            cy: (Math.min(...ys) + Math.max(...ys)) / 2,
          })
        }
        newLayers.push({
          name, color, count: ents.length, visible: true, opacity: 100,
          objects: ents,   // 实体引用 (合成用), 非 fabric 对象
          locked,
        })
      }
      // 融合 19 个设施标准项图层 (即使未布点也列出, 供显隐/锁定管理)
      mergeFacilityLayersInto(newLayers)
      layers.value = newLayers
      loadProgress.value = 70
      loadStage.value = '绘制合成图...'

      // 初次合成
      offCtx.fillStyle = '#111318'
      offCtx.fillRect(0, 0, offCanvas.width, offCanvas.height)
      for (const l of newLayers) {
        offCtx.strokeStyle = l.color
        for (const e of l.objects) strokeEntity(offCtx, e, l.color, 1)
      }
      loadProgress.value = 90
      loadStage.value = '渲染到画布...'

      // 清掉旧 fabric 对象 (保留 markers 之外全部)
      const old = fabricCanvas.getObjects().filter(o => !o._isFacility && !o._isFacilityLabel)
      old.forEach(o => fabricCanvas.remove(o))

      const dataUrl = offCanvas.toDataURL('image/png')
      fabric.Image.fromURL(dataUrl, (img) => {
        img._isBg = true
        img.selectable = false
        img.evented = false
        img.lockMovementX = true
        img.lockMovementY = true
        fabricCanvas.add(img)
        fabricCanvas.sendToBack(img)
        fabricCanvas.requestRenderAll()
        // 适配视图 (若无历史视图状态则全图适配)
        fitScreen()
        buildLegend()
        restoreViewState()   // 恢复上次图层显隐/透明度/视图
        loading.value = false
        loadProgress.value = 100
        loadStage.value = '完成'
        toast.show(`✅ 解析完成: ${dxf.entities.length} 实体, ${newLayers.length} 图层`)
      })
    }

    const fitScreen = () => {
      if (!fabricCanvas) return
      const wrap = canvasWrap.value
      const w = wrap.clientWidth, h = wrap.clientHeight
      if (w <= 0 || h <= 0) return
      // 基于离屏合成图尺寸精确适配 (避免遍历对象时 marker/文本干扰导致跑偏)
      if (offCanvas && offCanvas.width > 0 && offCanvas.height > 0) {
        const cw = offCanvas.width, ch = offCanvas.height
        const zoom = Math.min(w / cw, h / ch) * 0.92
        const cx = cw / 2, cy = ch / 2
        fabricCanvas.setViewportTransform([zoom, 0, 0, zoom, w / 2 - cx * zoom, h / 2 - cy * zoom])
        zoomPct.value = Math.round(zoom * 100)
        fabricCanvas.requestRenderAll()
        return
      }
      // fallback: 无离屏图时按对象 bounds
      const objs = fabricCanvas.getObjects()
      if (!objs.length) return
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity
      objs.forEach(o => {
        const b = o.getBoundingRect()
        minX = Math.min(minX, b.left)
        minY = Math.min(minY, b.top)
        maxX = Math.max(maxX, b.left + b.width)
        maxY = Math.max(maxY, b.top + b.height)
      })
      const cw2 = maxX - minX, ch2 = maxY - minY
      if (cw2 <= 0 || ch2 <= 0) return
      const zoom2 = Math.min(w / cw2, h / ch2) * 0.92
      const cx2 = minX + cw2 / 2, cy2 = minY + ch2 / 2
      fabricCanvas.setViewportTransform([zoom2, 0, 0, zoom2, w / 2 - cx2 * zoom2, h / 2 - cy2 * zoom2])
      zoomPct.value = Math.round(zoom2 * 100)
      fabricCanvas.renderAll()
    }

    // 可见性切换 (眼睛图标, 替代 checkbox)
    const toggleLayerVisible = (layer) => {
      layer.visible = !layer.visible
      updateLayerVisibility(layer)
    }

    const updateLayerVisibility = (layer) => {
      layer.visible = layer.visible !== false
      if (layer.isFacilityLayer) {
        // 设施层: markers 可见性
        facilityMarkers.forEach(m => {
          if (m._facLayer === layer.name) m.visible = layer.visible
        })
        fabricCanvas.requestRenderAll()
      } else {
        redrawComposite()   // 底图层: 重绘合成图
      }
      if (typeof saveViewState === 'function') saveViewState()
    }

    const updateLayerOpacity = (layer) => {
      if (layer.opacity == null) layer.opacity = 100
      if (layer.isFacilityLayer) {
        facilityMarkers.forEach(m => {
          if (m._facLayer === layer.name) m.opacity = layer.opacity / 100
        })
        fabricCanvas.requestRenderAll()
      } else {
        redrawComposite()
      }
      if (typeof saveViewState === 'function') saveViewState()
    }

    // ── 自动保存视图状态 (图层显隐/透明度/缩放平移; position 已实时入库) ──
    const viewKey = () => 'taf_view_' + (route.params.id || '')
    const saveViewState = () => {
      try {
        const state = {
          layers: layers.value.map(l => ({ name: l.name, visible: l.visible, opacity: l.opacity || 100 })),
          viewport: fabricCanvas ? fabricCanvas.viewportTransform : null,
          t: Date.now(),
        }
        localStorage.setItem(viewKey(), JSON.stringify(state))
      } catch(e) { /* localStorage 不可用时静默 */ }
    }
    const restoreViewState = () => {
      try {
        const raw = localStorage.getItem(viewKey())
        if (!raw) return
        const st = JSON.parse(raw)
        // 恢复图层显隐/透明度 (统一设置后单次重绘)
        let changed = false
        st.layers?.forEach(s => {
          const l = layers.value.find(x => x.name === s.name)
          if (l) {
            l.visible = s.visible !== false
            l.opacity = s.opacity || 100
            changed = true
          }
        })
        if (changed) {
          redrawComposite()
          renderFacilityMarkers()
        }
        // 恢复视图变换
        if (st.viewport && fabricCanvas) {
          fabricCanvas.setViewportTransform(st.viewport)
          zoomPct.value = Math.round(fabricCanvas.getZoom() * 100)
          fabricCanvas.requestRenderAll()
        }
      } catch(e) { console.warn('restore view state failed', e) }
    }
    // 定时自动保存 (每 30s) + 视图变更时立即保存
    if (typeof window !== 'undefined') {
      setInterval(() => { saveViewState() }, 30000)
    }

    // 图层显隐/透明度切换后保存
    const saveAfterLayerChange = (fn) => {
      return (layer) => { fn(layer); saveViewState() }
    }

    const toggleLayerLock = (layer) => {
      layer.locked = !layer.locked
      if (layer.isFacilityLayer) {
        renderFacilityMarkers()   // 重建 markers 应用锁定
        toast.show(layer.locked ? `🔒 ${layer.name} 已锁定 (不可拖动)` : `🔓 ${layer.name} 已解锁 (可拖动微调)`)
      } else {
        toast.show(layer.locked ? `🔒 ${layer.name} 锁定` : `🔓 ${layer.name} 解锁 (底图为合成图层, 几何不可单独编辑)`)
      }
    }

    // 透明度浮动面板开关 (再点关闭)
    const toggleOpacityPopup = (layer) => {
      opacityLayer.value = (opacityLayer.value === layer.name) ? null : layer.name
    }

    const confirmText = () => {
      if (!textValue.value.trim()) { textInput.value = false; return }
      const text = new fabric.Text(textValue.value, {
        left: textTargetX, top: textTargetY,
        fontSize: 16, fill: '#ff6b6b', fontFamily: 'sans-serif',
        backgroundColor: 'rgba(0,0,0,0.6)', padding: 4
      })
      fabricCanvas.add(text)
      fabricCanvas.renderAll()
      textInput.value = false
    }
    const cancelText = () => { textInput.value = false }

    const exportView = () => {
      if (!fabricCanvas) return
      const dataUrl = fabricCanvas.toDataURL({ format: 'png', multiplier: 2 })
      const link = document.createElement('a')
      link.download = 'taf-basemap-' + Date.now() + '.png'
      link.href = dataUrl
      link.click()
      toast.show('📸 截图已导出')
    }

    // ── 设施符号/颜色辅助 ──
    const facSymbol = (f) => {
      const id = f?.standard_item_id
      return (id && makiSymbols[id]) ? makiSymbols[id] : null
    }
    const facColor = (f) => {
      const cat = (f?.category || 'P1').toUpperCase()
      return CAT_COLORS[cat] || '#4f8cff'
    }
    const isPlacable = (f) => !NON_PLACABLE.has(f?.standard_item_id)
    const placableCount = computed(() => facilities.value.filter(isPlacable).length)
    const showAllFac = ref(false)   // 默认只显示可布点设施
    const filteredFacilities = computed(() => {
      let list = facilities.value
      if (!showAllFac.value) list = list.filter(isPlacable)
      if (facFilter.value !== 'ALL') list = list.filter(f => (f.category || '').toUpperCase() === facFilter.value)
      return list
    })

    // 更新设施层已布点计数
    const updateFacilityLayerCounts = () => {
      layers.value.forEach(l => {
        if (l.isFacilityLayer) {
          l.count = facilities.value.filter(f => f.standard_item_id === l.itemId && f.position?.x != null).length
        }
      })
    }

    const refreshFacilities = async () => {
      try {
        const list = await API.get('/projects/' + route.params.id + '/facilities')
        facilities.value = Array.isArray(list) ? list : (list.items || [])
        if (layers.value.length) {
          mergeFacilityLayersInto(layers.value)
          updateFacilityLayerCounts()
        }
        renderFacilityMarkers()
        buildLegend()
      } catch(e) { console.error(e) }
    }

    // ── 画布设施 marker (每设施独立可拖, 独立 Maki 符号; position=世界坐标) ──
    const renderFacilityMarkers = () => {
      if (!fabricCanvas) return
      facilityMarkers.forEach(m => { try { fabricCanvas.remove(m) } catch(e){} })
      facilityMarkers = []
      const size = symScale.value * 6   // 符号尺寸 (场景单位)

      facilities.value.forEach(f => {
        const pos = f.position
        if (pos?.x == null || pos?.y == null) return   // 未布点的不画
        const sp = worldToScreen(pos.x, pos.y)          // 世界 → 场景
        const x = sp.x, y = sp.y
        const color = facColor(f)
        const sym = facSymbol(f)
        const facLayer = sym?.layer || null   // 所属设施图层

        let marker
        if (sym?.path) {
          marker = makeSymbol(sym.path, sym.viewbox, x, y, size, color)
          marker._isFacility = true
          marker._facilityId = f.id
          marker._facilityData = f
          marker._facLayer = facLayer
          marker.selectable = true
          marker.evented = true
          marker.lockRotation = true
          marker.lockScalingX = true
          marker.lockScalingY = true
          marker.hasControls = false
        } else {
          // fallback: 圆点 + 标签
          const circle = new fabric.Circle({
            left: x - 6, top: y - 6, radius: 6,
            fill: color + '44', stroke: color, strokeWidth: 2,
            selectable: true, hasControls: false, lockRotation: true,
          })
          circle._isFacility = true
          circle._facilityId = f.id
          circle._facilityData = f
          circle._facLayer = facLayer
          marker = circle
        }
        // 编号标签
        const lbl = new fabric.Text(f.standard_item_id.replace('P', '').replace('-', '') || '', {
          left: x + size / 2 + 1, top: y - size / 2 - 1,
          fontSize: Math.max(6, size * 0.45), fill: color, fontFamily: 'sans-serif',
          selectable: false, evented: false,
        })
        lbl._isFacilityLabel = true
        // 应用所在图层的可见性/锁定
        const lobj = layers.value.find(l => l.name === facLayer)
        if (lobj) {
          if (!lobj.visible) { /* 隐藏层不显示 */ } else {
            fabricCanvas.add(marker)
            fabricCanvas.add(lbl)
          }
          marker.visible = lobj.visible
          lbl.visible = lobj.visible
          if (lobj.locked) { marker.selectable = false; marker.evented = false }
        } else {
          fabricCanvas.add(marker)
          fabricCanvas.add(lbl)
        }
        facilityMarkers.push(marker, lbl)
      })
      fabricCanvas.requestRenderAll()
    }

    // ── 手动布点: 选中设施后点击画布落点 ──
    const setTool = (t) => {
      // 再点同一工具 = 取消 (toggle)
      if (tool.value === t && (t === 'place' || t === 'text')) {
        tool.value = 'pan'
        selectedFac.value = null
        facPlaceHint.value = ''
        return
      }
      tool.value = t
      if (t === 'place') {
        if (!selectedFac.value) {
          // 自动选择第一个未布点的可布点设施
          const next = facilities.value.find(f => isPlacable(f) && (f.position?.x == null))
          selectedFac.value = next || facilities.value.find(isPlacable) || null
        }
        facPlaceHint.value = selectedFac.value
          ? `点击画布放置「${selectedFac.value.name}」(${selectedFac.value.standard_item_id}) · 再点「手动布点」或 Esc 取消`
          : '右侧清单先选择要布点的设施'
      } else {
        facPlaceHint.value = ''
      }
    }
    // Esc 取消手动布点
    const _keyHandler = (e) => {
      if (e.key === 'Escape' && (tool.value === 'place' || tool.value === 'text')) {
        tool.value = 'pan'
        selectedFac.value = null
        facPlaceHint.value = ''
        if (textInput.value) { textInput.value = false }
        fabricCanvas?.requestRenderAll()
      }
    }
    if (typeof document !== 'undefined') document.addEventListener('keydown', _keyHandler)
    // ── Undo/Redo: 基于全量 position 快照 (含 null 状态) ──
    const snapPositions = () => {
      const m = {}
      facilities.value.forEach(f => {
        m[f.id] = (f.position && f.position.x != null) ? { x: f.position.x, y: f.position.y } : null
      })
      return m
    }
    const pushUndo = () => {
      undoStack.value.push(snapPositions())
      if (undoStack.value.length > 100) undoStack.value.shift()
      redoStack.value = []
    }
    const applyPositions = async (snap) => {
      for (const f of facilities.value) {
        const pos = snap[f.id]   // {x,y} | null
        try {
          await API.put('/projects/' + route.params.id + '/facilities/' + f.id, {
            position: pos ? { x: pos.x, y: pos.y, lng: null, lat: null } : null
          })
          f.position = pos ? { x: pos.x, y: pos.y } : null
        } catch(e) { console.error('undo sync fail', f.id, e) }
      }
      updateFacilityLayerCounts()
      renderFacilityMarkers()
    }
    const undoPlacement = async () => {
      if (!undoStack.value.length) { toast.show('无可撤销操作'); return }
      const prev = undoStack.value.pop()
      redoStack.value.push(snapPositions())
      await applyPositions(prev)
      toast.show('↶ 已撤销上一步')
    }
    const redoPlacement = async () => {
      if (!redoStack.value.length) { toast.show('无可重做操作'); return }
      const next = redoStack.value.pop()
      undoStack.value.push(snapPositions())
      await applyPositions(next)
      toast.show('↷ 已重做')
    }
    // Ctrl+Z / Ctrl+Y 快捷键
    const _undoKey = (e) => {
      if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undoPlacement() }
      else if (e.ctrlKey && e.key.toLowerCase() === 'y') { e.preventDefault(); redoPlacement() }
    }
    if (typeof document !== 'undefined') document.addEventListener('keydown', _undoKey)

    // 删除布点 (清空 position; 支持点位库 🗑 按钮 / Delete 键)
    const removePlacement = async (f) => {
      pushUndo()
      try {
        await API.put('/projects/' + route.params.id + '/facilities/' + f.id, {
          position: null
        })
        f.position = null
        renderFacilityMarkers()
        updateFacilityLayerCounts()
        toast.show('🗑 已移除布点: ' + f.name)
      } catch(e) { console.error(e); toast.show('❌ 移除布点失败') }
    }
    // Delete 键移除选中设施布点
    const _delKey = (e) => {
      const tgt = e.target
      const inInput = tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA' || tgt.isContentEditable)
      if ((e.key === 'Delete' || e.key === 'Backspace') && !textInput.value && !inInput) {
        const f = selectedFac.value
        if (f && f.position?.x != null) {
          e.preventDefault()
          removePlacement(f); selectedFac.value = null
        }
      }
    }
    if (typeof document !== 'undefined') document.addEventListener('keydown', _delKey)

    const selectFacility = (f) => {
      selectedFac.value = f
      if (tool.value !== 'place') setTool('place')
      focusFacility(f)
    }
    const placeAtPointer = async (sx, sy) => {
      const f = selectedFac.value
      if (!f) { toast.show('⚠️ 先在右侧设施清单选择要布点的设施'); return }
      pushUndo()
      const w = screenToWorld(sx, sy)   // 场景 → 世界坐标 (CAD 用)
      const x = Math.round(w.x), y = Math.round(w.y)
      try {
        await API.put('/projects/' + route.params.id + '/facilities/' + f.id, {
          position: { x, y, lng: null, lat: null }
        })
        f.position = { x, y }
        renderFacilityMarkers()
        toast.show('✅ 已布点: ' + f.name)
        // 自动切到下一个未布点项
        const next = facilities.value.find(x => x.id !== f.id && isPlacable(x) && x.position?.x == null)
        if (next) { selectedFac.value = next; facPlaceHint.value = `点击画布放置「${next.name}」` }
        else { selectedFac.value = null; facPlaceHint.value = ''; setTool('pan') }
      } catch(e) { console.error(e); toast.show('❌ 布点保存失败') }
    }

    // ── 自动布点引擎 ──
    const openAutoPlace = () => {
      hideRight.value = false
      setTool('pan')
      runAutoPlace()
    }

    // 防抖: 拉杆拖动时延迟重算
    let _reautoTimer = null
    const scheduleReauto = () => {
      if (_reautoTimer) clearTimeout(_reautoTimer)
      _reautoTimer = setTimeout(() => {
        const placed = facilities.value.filter(f => f.position?.x != null).length
        if (placed > 0 && autoOverwrite.value) runAutoPlace()
        else if (placed > 0) toast.show('💡 调整后点「🚀 自动布点」或勾选覆盖后重算')
      }, 600)
    }

    // 核心: 计算每项设施的建议位置
    const computePlacements = () => {
      const spacing = placeSpacing.value
      const margin = placeMargin.value
      const rowCap = perRow.value
      // 问题7: 分类别布点 — 跟随点位库当前分类筛选 (facFilter), ALL=全部可布点
      let placable = facilities.value.filter(isPlacable)
      if (facFilter.value !== 'ALL') {
        placable = placable.filter(f => (f.category || '').toUpperCase() === facFilter.value)
      }
      const placed = []

      // 可用锚点池
      const poolOf = (spaceType) => geoAnchors[spaceType] || []
      const poolAll = ['building','channel','node','green','facade','road','boundary'].flatMap(t => poolOf(t))
      // 区域 = boundary 或整体范围
      let region = poolOf('boundary')[0]
      if (!region && poolAll.length) {
        region = {
          minX: Math.min(...poolAll.map(b => b.minX)), minY: Math.min(...poolAll.map(b => b.minY)),
          maxX: Math.max(...poolAll.map(b => b.maxX)), maxY: Math.max(...poolOf('building')[0] ? poolAll.map(b => b.maxX) : poolAll.map(b => b.maxX)),
          cx: 0, cy: 0,
        }
        region.cx = (region.minX + region.maxX) / 2
        region.cy = (region.minY + region.maxY) / 2
      }

      // 按分类分桶
      const buckets = {}
      placable.forEach(f => {
        const cat = (f.category || 'P1').toUpperCase()
        if (!buckets[cat]) buckets[cat] = []
        buckets[cat].push(f)
      })

      // 已有布点保留 (不覆盖时)
      const keepExisting = !autoOverwrite.value

      const placeOne = (f, bb, idx) => {
        const col = idx % rowCap
        const row = Math.floor(idx / rowCap)
        const x = bb.minX + margin + col * spacing + (row % 2) * (spacing / 2)
        const y = bb.minY + margin + row * spacing
        return { f, x, y }
      }

      // 智能策略: 分类 → 空间类型
      const placeBucketSmart = (cat, items) => {
        const spaceTypes = CAT_SPACE[cat] || ['building', 'channel']
        const pools = spaceTypes.map(t => poolOf(t)).filter(p => p.length)
        const anchors = pools.length ? pools[0] : poolAll
        if (!anchors.length) return []
        // 按中心距离从项目中心展开, 每锚点放若干
        const out = []
        let idx = 0
        for (const bb of anchors) {
          if (idx >= items.length) break
          const n = Math.min(items.length - idx, Math.max(1, Math.floor((bb.maxX - bb.minX) / spacing) || 1))
          for (let k = 0; k < n && idx < items.length; k++) {
            out.push(placeOne(items[idx], bb, k))
            idx++
          }
        }
        // 溢出: 均匀散布到区域
        while (idx < items.length) {
          if (!region) break
          out.push(placeOne(items[idx], region, idx))
          idx++
        }
        return out
      }

      // 通道线性策略
      const placeChannel = (items) => {
        const chans = poolOf('channel')
        const anchors = chans.length ? chans : poolAll
        const out = []
        if (!anchors.length) return out
        let idx = 0
        for (const bb of anchors) {
          const n = Math.min(items.length - idx, Math.max(1, Math.floor((bb.maxX - bb.minX) / spacing) || 1))
          for (let k = 0; k < n && idx < items.length; k++) {
            out.push(placeOne(items[idx], bb, k))
            idx++
          }
        }
        return out
      }
      const placeNode = (items) => {
        const nodes = poolOf('node')
        const anchors = nodes.length ? nodes : poolAll
        const out = []
        let idx = 0
        for (const bb of anchors) {
          const n = Math.min(items.length - idx, Math.max(1, Math.floor((bb.maxX - bb.minX) / spacing) || 1))
          for (let k = 0; k < n && idx < items.length; k++) {
            out.push(placeOne(items[idx], bb, k))
            idx++
          }
        }
        return out
      }
      const placeUniform = (items) => {
        if (!region) return []
        const out = []
        items.forEach((f, i) => {
          const col = i % rowCap
          const row = Math.floor(i / rowCap)
          const cellW = spacing
          const x = region.minX + margin + col * cellW + (row % 2) * (cellW / 2)
          const y = region.minY + margin + row * cellW
          out.push({ f, x, y })
        })
        return out
      }
      const placeBoundary = (items) => {
        const b = poolOf('boundary')[0]
        const bb = b || region
        if (!bb) return []
        const out = []
        items.forEach((f, i) => {
          const per = (i + 0.5) / Math.max(items.length, 1)
          const px = bb.minX + per * (bb.maxX - bb.minX)
          // 底边内侧
          out.push({ f, x: px, y: bb.maxY - margin })
        })
        return out
      }

      // 执行
      if (placeStrategy.value === 'channel') {
        placeChannel(placable).forEach(p => placed.push(p))
      } else if (placeStrategy.value === 'node') {
        placeNode(placable).forEach(p => placed.push(p))
      } else if (placeStrategy.value === 'uniform') {
        placeUniform(placable).forEach(p => placed.push(p))
      } else if (placeStrategy.value === 'boundary') {
        placeBoundary(placable).forEach(p => placed.push(p))
      } else {
        // smart
        for (const [cat, items] of Object.entries(buckets)) {
          placeBucketSmart(cat, items).forEach(p => placed.push(p))
        }
      }
      return { placed, keepExisting }
    }

    const runAutoPlace = async () => {
      if (autoPlacing.value) return
      autoPlacing.value = true
      try {
        pushUndo()
        const { placed, keepExisting } = computePlacements()
        const scope = facFilter.value === 'ALL' ? '全部可布点' : '分类 ' + facFilter.value
        if (!placed.length) { toast.show('⚠️ 无可用布点锚点，请先加载含 TAF 图层的 DXF'); return }
        let n = 0
        for (const p of placed) {
          const f = p.f
          if (keepExisting && f.position?.x != null) continue
          try {
            await API.put('/projects/' + route.params.id + '/facilities/' + f.id, {
              position: { x: Math.round(p.x), y: Math.round(p.y), lng: null, lat: null }
            })
            f.position = { x: Math.round(p.x), y: Math.round(p.y) }
            n++
          } catch(e) { console.error('place fail', f.id, e) }
        }
        renderFacilityMarkers()
        toast.show(`✅ 自动布点完成: ${n} 项已布点 (范围: ${scope}, 间距 ${placeSpacing.value}m)`)
        if (n === 0 && !keepExisting) toast.show('⚠️ 0 项更新 (可能已全部布点, 勾选「覆盖已有布点」重算)')
      } finally {
        autoPlacing.value = false
      }
    }

    const focusFacility = (f) => {
      if (!fabricCanvas || !f.position) { if (f?.position?.x == null) toast.show('📍 该设施尚未布点'); return }
      const sp = worldToScreen(f.position.x, f.position.y)   // 世界 → 场景
      const zoom = fabricCanvas.getZoom()
      const wrap = canvasWrap.value
      const cx = wrap.clientWidth / 2, cy = wrap.clientHeight / 2
      const tx = cx - sp.x * zoom, ty = cy - sp.y * zoom
      fabricCanvas.setViewportTransform([zoom, 0, 0, zoom, tx, ty])
      fabricCanvas.requestRenderAll()
      toast.show('📍 定位: ' + f.name)
    }

    // ── 图例表格 (旧层 + 布点符号层) ──
    const buildLegend = () => {
      const rows = []
      // 1) 底图空间图层
      const baseNames = ['TAF-BOUNDARY', 'TAF-BUILDING', 'TAF-CHANNEL', 'TAF-ROAD', 'TAF-GREEN', 'TAF-NODE', 'TAF-FACADE', 'BASEMAP']
      const baseDesc = {
        'TAF-BOUNDARY': '红线边界', 'TAF-BUILDING': '建筑', 'TAF-CHANNEL': '通道/走廊',
        'TAF-ROAD': '道路', 'TAF-GREEN': '绿地', 'TAF-NODE': '节点/广场',
        'TAF-FACADE': '立面', 'BASEMAP': '原始底图',
      }
      for (const nm of baseNames) {
        const l = layers.value.find(x => x.name === nm) || layers.value.find(x => x.name.toUpperCase() === nm)
        if (l || nm === 'TAF-BOUNDARY') {
          rows.push({ layer: nm, main: `${baseDesc[nm] || nm}`, color: LAYER_COLORS[nm] || '#5c6370', icon: null })
        }
      }
      // 2) 布点符号层 (19 项, 每项独立图层)
      for (const [itemId, sym] of Object.entries(makiSymbols)) {
        const fac = facilities.value.find(f => f.standard_item_id === itemId)
        const zh = fac?.name || sym.name_zh || ''
        const cat = itemId.split('-')[0]
        rows.push({
          layer: sym.layer,
          main: `${itemId} ${zh}`,
          icon: sym.path, viewbox: sym.viewbox,
          color: CAT_COLORS[cat] || '#4f8cff',
        })
      }
      legendRows.value = rows
    }

    // ── 全屏 ──
    // 路由级浏览器内全宽由 App 模板 .main-fullwidth 控制 (进入底图页即全宽)
    const toggleTrueFullscreen = async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen()
          trueFs.value = true
        } else {
          await document.exitFullscreen()
          trueFs.value = false
        }
        setTimeout(() => { if (fabricCanvas) fabricCanvas.renderAll() }, 120)
      } catch(e) { toast.show('❌ 全屏不可用: ' + e.message) }
    }
    if (typeof document !== 'undefined') {
      document.addEventListener('fullscreenchange', () => {
        trueFs.value = !!document.fullscreenElement
        setTimeout(() => { if (fabricCanvas) { fabricCanvas.setDimensions({ width: canvasWrap.value?.clientWidth, height: canvasWrap.value?.clientHeight }); fabricCanvas.renderAll() } }, 150)
      })
    }

    const loadMaki = async () => {
      // 内嵌常量立即生效 (无外部依赖, 不受 fetch 污染/失败影响)
      if (typeof MAKI_SYMBOLS !== 'undefined' && MAKI_SYMBOLS && Object.keys(MAKI_SYMBOLS).length) {
        makiSymbols = MAKI_SYMBOLS
        if (layers.value.length) {
          mergeFacilityLayersInto(layers.value)
          updateFacilityLayerCounts()
        }
        buildLegend()
      }
      // fetch 校验: 外部 JSON 若可解析则覆盖 (支持后续独立更新符号库)
      try {
        const resp = await fetch('/taf/maki_symbols.json')
        if (resp.ok) {
          const text = await resp.text()
          if (!/^\s*</.test(text.slice(0, 10))) {   // 防 sub_filter 污染
            const d = JSON.parse(text)
            if (d?.symbols && Object.keys(d.symbols).length) {
              makiSymbols = d.symbols
              if (layers.value.length) {
                mergeFacilityLayersInto(layers.value)
                updateFacilityLayerCounts()
              }
              buildLegend()
            }
          }
        }
      } catch(e) { console.warn('maki fetch update failed (embedded copy in use)', e) }
    }

    onMounted(() => {
      loadProject()
      loadMaki()
      nextTick(() => {
        setTimeout(initCanvas, 100)
        setTimeout(loadBasemaps, 150)
      })
    })

    const loadBasemaps = async () => {
      try {
        const bms = await API.get('/projects/' + route.params.id + '/basemaps')
        if (bms?.length) {
          const dxfBm = bms.find(b => b.file_type === 'dxf')
          if (dxfBm?.file_url) {
            // file_url 形如 {upload_dir}/{project_id}/{filename}; 取末两段拼静态 URL
            const parts = dxfBm.file_url.split('/').filter(Boolean)
            const rel = parts.slice(-2).join('/')
            const url = '/taf/uploads/' + rel
            let tries = 0
            while (!fabricCanvas && tries < 20) { await new Promise(r => setTimeout(r, 100)); tries++ }
            if (!fabricCanvas) { console.error('canvas not ready'); return }
            const resp = await fetch(url)
            if (resp.ok) {
              const text = await resp.text()
              if (/^\s*</.test(text.slice(0, 50)) && !/SECTION|AC1\d\d/.test(text.slice(0, 200))) {
                console.error('DXF fetch returned HTML (SPA fallback?)', url)
                toast.show('⚠️ 无法加载已上传底图 (静态文件路由缺失), 请重新上传或联系管理员')
                return
              }
              renderDXF(text)
              refreshFacilities()
            } else {
              console.error('DXF fetch failed', resp.status, url)
              toast.show('⚠️ 底图加载失败 HTTP ' + resp.status + ', 请重新上传')
            }
          }
        }
      } catch(e) { console.error(e) }
    }

    return { projectName, projectCode, layers, tool, zoomPct, canvasSize, selectedObj, facilities,
      undoStack, redoStack, undoPlacement, redoPlacement, removePlacement,
      textInput, textValue, canvasWrap, canvasEl, fileInput,
      triggerUpload, onFileUpload, fitScreen, updateLayerVisibility, updateLayerOpacity,
      confirmText, cancelText, exportView, refreshFacilities, focusFacility,
      hideLeft, hideRight, fullscreen, trueFs, toggleTrueFullscreen, showAllFac,
      loading, loadProgress, loadStage,
      setTool, selectFacility, facFilter, filteredFacilities, selectedFac, facPlaceHint,
      facSymbol, facColor, placableCount, autoPlacing, placeStrategy, placeSpacing,
      placeMargin, perRow, symScale, autoOverwrite, scheduleReauto,
      openAutoPlace, runAutoPlace, legendRows, buildLegend,
      facStatusCN, facStatusColor, facCats, facCountOf, toggleLayerLock,
      toggleLayerVisible, catNames, layerCN,
      opacityLayer, toggleOpacityPopup, startLeftDrag, leftWidth }
  }
}

          if (f.status !== 'confirmed') await API.put('/facilities/'+f.id, {status:'confirmed'})
        }
        toast.show('✅ 全部确认完成')
        load()
        evaluate()
      } catch(e) { toast.show('❌ 确认失败') }
    }
    const exportReport = async () => {
      try {
        const r = await API.get('/projects/'+route.params.id+'/report')
        const blob = new Blob([r.report_html], {type:'text/html'})
        const url = URL.createObjectURL(blob)
        const a = document.createElement('a')
        a.href = url; a.download = 'TAF_Report_' + projectName.value + '_' + new Date().toISOString().slice(0,10) + '.html'
        a.click()
        URL.revokeObjectURL(url)
        toast.show('📄 报告已下载')
      } catch(e) { toast.show('❌ 导出失败') }
    }
    return { projectName, facilities, evalResult, evaluating, editDlg, editForm, cats, groupedFacilities, editFacility, addFacility, saveFacility, deleteFacility, evaluate, batchConfirm, exportReport, facStatusLabel }
  }
}

// ─── Deliverables Page ───
const DeliverablesPage = {
  template: `
  <div>
    <div style="margin-bottom:16px;display:flex;align-items:center;gap:12px">
      <button class="btn" @click="$router.back()">← 返回</button>
      <span style="font-size:21px;font-weight:600">{{ projectName }} · 策划成果</span>
    </div>

    <div v-if="loading" class="empty"><div class="icon">⏳</div>加载中...</div>

    <div v-if="!loading">
      <div class="card">
        <div class="card-title">📦 成果清单</div>
        <div class="card-sub">一键生成所有策划成果，自动打包上传坚果云</div>

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">
          <button class="btn primary" @click="generate('boq')" :disabled="generating">📋 设施清单</button>
          <button class="btn primary" @click="generate('priority-matrix')" :disabled="generating">📊 优先级矩阵</button>
          <button class="btn primary" @click="generate('layout')" :disabled="generating">🗺️ 布点图 DXF</button>
          <button class="btn primary" @click="generate('annotated-map')" :disabled="generating">🖼️ 标注渲染图</button>
          <button class="btn primary" @click="generate('heatmap')" :disabled="generating">🔥 热力图</button>
          <button class="btn primary" @click="generate('narrative')" :disabled="generating">✍️ 空间叙事</button>
          <button class="btn primary" @click="generate('prompts')" :disabled="generating">🎨 渲染提示词</button>
        </div>
        <button class="btn" style="background:var(--success);color:#fff;border-color:var(--success);width:100%;padding:10px" @click="packageAll" :disabled="generating">
          📦 一键打包全部 → 坚果云
        </button>
      </div>

      <div v-if="results.length" class="card" style="margin-top:16px">
        <div class="card-title">✅ 已生成 ({{ results.length }})</div>
        <div v-for="r in results" :key="r.id" style="display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);gap:12px">
          <span style="width:120px;font-size:16px">{{ r.name }}</span>
          <span style="font-size:14px;color:var(--muted)">{{ r.format }}</span>
          <span v-if="r.size" style="font-size:14px;color:var(--muted)">{{ (r.size/1024).toFixed(1) }} KB</span>
          <span v-if="r.status==='ok'" style="color:var(--success)">✅</span>
          <span v-if="r.status==='error'" style="color:var(--danger)">❌ {{ r.error }}</span>
          <button v-if="r.download_url" class="btn sm" @click="download(r)">⬇ 下载</button>
        </div>
      </div>

      <div v-if="packageResult" class="card" style="margin-top:16px">
        <div class="card-title">📦 打包结果</div>
        <div style="font-size:16px">ZIP: {{ (packageResult.zip_size/1024).toFixed(0) }} KB</div>
        <div v-if="packageResult.nutstore?.status===201" style="color:var(--success);font-size:16px">✅ 已上传坚果云</div>
        <div v-if="packageResult.nutstore?.path" style="font-size:14px;color:var(--muted)">{{ packageResult.nutstore.path }}</div>
      </div>
    </div>
  </div>`,
  setup() {
    const route = VueRouter.useRoute()
    const projectName = ref('')
    const loading = ref(true)
    const generating = ref(false)
    const results = ref([])
    const packageResult = ref(null)

    const API_BASE = '/taf/api/projects/' + route.params.id + '/deliverables'

    onMounted(async () => {
      try {
        const p = await (await fetch(API.base + '/projects/' + route.params.id)).json()
        projectName.value = p.name || p.code
      } catch(e) {}
      loading.value = false
    })

    const generate = async (type) => {
      generating.value = true
      const methods = { 'layout':'POST','annotated-map':'POST','benchmark':'POST' }
      const method = methods[type] || 'GET'
      const opts = method === 'POST' ? { method:'POST' } : {}
      try {
        const r = await fetch(API_BASE + '/' + type, opts)
        const ct = r.headers.get('content-type') || ''
        if (ct.includes('json')) {
          const json = await r.json()
          results.value.unshift({ id: Date.now(), name: json.code || type, format: 'json', status:'ok' })
        } else {
          const blob = await r.blob()
          results.value.unshift({
            id: Date.now(), name: type, format: type === 'layout' ? 'dxf' : type.includes('map')||type==='heatmap' ? 'png' : 'bin',
            size: blob.size, status:'ok',
            download_url: URL.createObjectURL(blob)
          })
        }
      } catch(e) {
        results.value.unshift({ id: Date.now(), name: type, status:'error', error: e.message })
      }
      generating.value = false
    }

    const packageAll = async () => {
      generating.value = true
      try {
        const r = await fetch(API_BASE + '/package', { method:'POST' })
        const json = await r.json()
        if (json.detail) throw new Error(json.detail)
        packageResult.value = json
        if (json.files) {
          json.files.forEach(f => {
            results.value.unshift({ id: Date.now(), name: f.name, format: f.format, size: f.size, status:'ok' })
          })
        }
      } catch(e) {
        packageResult.value = { error: e.message }
      }
      generating.value = false
    }

    const download = (r) => {
      const a = document.createElement('a')
      a.href = r.download_url
      a.download = r.name
      a.click()
    }

    return { projectName, loading, generating, results, packageResult, generate, packageAll, download }
  }
}

// ─── Router ───
const routes = [
  { path: '/', redirect: '/standards' },
  { path: '/standards', component: StandardsList },
  { path: '/standards/:code', component: StandardsDetail },
  { path: '/projects', component: ProjectsList },
  { path: '/projects/:id', component: ProjectDetail },
  { path: '/projects/:id/basemap', component: BasemapEditor },
  { path: '/projects/:id/facilities', component: FacilitiesPage },
  { path: '/projects/:id/deliverables', component: DeliverablesPage },
]
const router = createRouter({ history: createWebHashHistory(), routes })

// ─── App ───
const App = {
  template: `<div>
    <nav class="nav">
      <a href="#/" class="logo">它界 TAF</a>
      <router-link to="/standards">评估标准</router-link>
      <router-link to="/projects">评估项目</router-link>
    </nav>
    <div v-if="toast.msg.value" class="toast">{{ toast.msg.value }}</div>
    <div :class="isBasemap ? 'main main-fullwidth' : 'main'"><router-view></router-view></div>
  </div>`,
  setup() {
    const route = VueRouter.useRoute()
    const isBasemap = Vue.computed(() => /\/basemap$/.test(route.path))
    return { toast, isBasemap }
  }
}

const app = createApp(App)
app.use(router)
app.use(ElementPlus)
app.mount('#app')
</script>
</body>
